 c3rd_rep_arrow_up:0 "[Player.Custom('c3rd_rep_arrow_up_custom_loc')]"
 c3rd_rep_arrow_up_custom_loc1:0 "The state of the republic is changing slowly but surely. We can still keep it under control and act accordingly, if we so choose... \n\nAt this rate, the republic will last another century, or two, perhaps even longer?"
 c3rd_rep_arrow_up_custom_loc2:0 "Tensions within the republic are mounting, and difficult choices lie ahead. \n\nAt this rate, the republic will last less than a century, or perhaps just a few decades at most..."
 c3rd_rep_arrow_up_custom_loc3:0 "Institutions are rushing headlong towards the republic’s imminent demise. Is it a total loss of control or the will of its leaders? Who can say? \n\nAt this rate, the republic will last another twenty years at most."
 c3rd_rep_arrow_down:0 "[Player.Custom('c3rd_rep_arrow_down_custom_loc')]"
 c3rd_rep_arrow_down_custom_loc1:0 "Republican institutions are being restored. A slight and perhaps temporary change, but a welcome one. \n\nAt this rate, however, it would be impossible to completely eliminate the tension in less than a century... or three"
 c3rd_rep_arrow_down_custom_loc2:0 "Republican tensions are steadily and surely easing. \n\nAt this rate, it will take less than a century, or even just a few decades, to eliminate all tensions!"
 # Rising tension (red)
 c3rd_rep_src_cities_tt:0 "#T Size of the Empire#!\nThe Republican system was not built for empires. Every new province stretches its institutions further, #R increasing#! Republican Tension."
 c3rd_rep_src_deflation_tt:0 "#T Monetary Deflation#!\nEconomic crisis erodes the population's confidence in the state's ability to govern, fuelling factional agitation."
 c3rd_rep_src_crash_tt:0 "#T Monetary Collapse#!\nA severe devaluation of the currency is generating social unrest and direct pressure on the Republican institutions."
 c3rd_rep_src_solidus_tt:0 "#T Gold Standard#!\nThe introduction of the Gold Standard has concentrated wealth in the hands of the aristocracy, fuelling factional ambitions and separatist impulses."
 c3rd_rep_src_unworthy_tt:0 "#T Unworthy Leadership#!\nThe generals' growing contempt for the current leadership is undermining the constitutional authority of the magistrates."
 c3rd_rep_src_stab_tt:0 "#T Stability : [Player.GetStability|2]#!\nLow and very low stability #R increases#! Republican Tension considerably, while high and very high stability #G reduces#! it moderately."
 c3rd_rep_src_low_senate_tt:0 "#T Support in the Senate : [Player.GetSenateApproval|2]#!\nThe various factions might have their own different reasons to be dissatisfied, but the global satisfaction is the key to limit Republican Tension.\nThe more #R dissatisfied#! the Senate is, the more it will #R increase#! tension.\nA #G satisfied#! Senate will #G reduce#! tension moderately."
 c3rd_rep_time_tt:0 "#T Time Pressure#!\nIn times of larges empires, autocracy and decline of democracy, the pressure on the republican institutions grows. Senates, councils and representations are considered remnants of the past, and the need for a strong hand to guide the state is more and more accepted.\n\n #Y Republican Tension#! will #R increase#! over time passively."
 c3rd_rep_monetary_tt:0 "#T Monetary Effect#! \nThe state of  the monetary balance has a direct effect on the Republican Tension. #Y Deflation#! or #Y Silver Devaluation#! will #R increase#! tension, in proportion to the scale of the crisis.\n#bold However#!, establishing the #Y Gold standard#! will also #R increase#! tension, symbolising the concentration of wealth and the erosion of the middle class that fuels factional ambitions and separatist impulses."
 c3rd_rep_military_tt:0 "#T Military Discontent#!\nThe generals' growing contempt for the current leadership is undermining the constitutional authority of the magistrates, and increasing the pressure on the republican institutions.\nYou can only have a vague idea of this discontent, but it can greatly #R increase#! Republican Tension, create crises, and even coups if left unchecked."
 c3rd_rep_title:0 "#T Status of Institutions#!"
 c3rd_c3rd_rep_relief_tt:0 "#G Republic Preserved#!\nFollowing a violent civil war against supporters of the monarchy, the republic was preserved\n\nThis is #G decreasing#! #Y Republican Tension#!"
 c3rd_rep_divided_empire_tt:0 "#G Divided Empire#!\nThe empire has been divided, ensuring batter stability and endurance.\n\nThis is #G decreasing#! #Y Republican Tension#!"

 c3rd_rep_incr_tension_tt:0 "#R Increasing Tension#!\nThis law is increasing Republican Tension."
 c3rd_rep_law_small_tension_tt:0 "#R Increasing Tension#!\nThis law is slowly increasing Republican Tension."
 c3rd_rep_law_decr_tension_tt:0 "#G Reducing Tension#!\nThis law is reducing Republican Tension."
 c3rd_rep_law_sdecr_tension_tt:0 "#G Reducing Tension#!\nThis law is slowly reducing Republican Tension."
 c3rd_rep_law_decr_mil_tt:0 "#G Reducing Military Discontent#!\nThis law is slowly reducing military discontent."
 c3rd_rep_law_mon_effect_tt:0 "#R Decrease Monetary balance#!\nThis law has a negative effect on the monetary balance.\n\nReforming the #Y Solidus#! will change this law back to #Y Mos Maiorum#! ."


