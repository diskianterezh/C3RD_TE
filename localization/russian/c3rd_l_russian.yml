 #Decisions
 stop_political_unstability_small:0 "Остановить политическую нестабильность"
 stop_political_unstability_small_desc:0 "Малое государство управлять значительно проще, чем большим."
 stop_political_unstability_huge:0 "Стабилизировать правительство"
 stop_political_unstability_huge_desc:0 "Когда правительство будет стабилизировано и восстановит контроль, период волнений закончится."
 stop_political_unstability_what:0 "Устранить нестабильность"
 stop_political_unstability_what_desc:0 "У вас не должно быть этого модификатора... нажмите здесь, чтобы исправить проблему."
 start_the_reform:0 "Реформа правительства"
 start_the_reform_desc:0 "Пришло время отказаться от старых систем и вступить в новую эпоху.\n#R Вы станете на путь монархии #! \n#G Это устранит любую политическую нестабильность #!"
 resolve_administrative_problem:0 "Решить административные проблемы"
 resolve_administrative_problem_desc:0 "Эффективное распределение административной нагрузки позволит устранить многие прежние трудности."
 has_noble_decision:0 "Не менее 20% населения принадлежит к культуре с правами знати"
 culture_group_boosted_c3rd_tt:0 "Культуры, находящиеся в нашей стране и относящиеся к культурной группе #Y [SCOPE.sCountryCulture('chosen_new_nobles').GetCulture.GetCultureGroup.GetName]#!, получают #G +5%#! счастья до конца игры."
 check_the_great_book:0 "Проверить великую книгу"
 check_the_great_book_desc:0 "Великая книга содержит данные о состоянии экономики страны.\nИнформация из великой книги перенесена в окно 'Денежный кризис', доступное через кнопку на вкладке экономики, но при желании доступ к книге сохраняется."
 inject_liquidity:0 "Влить наличность"
 inject_liquidity_desc:0 "Чтобы выправить денежный баланс, мы можем влить в экономику новые средства из казны.\n #G Дефляция уменьшится #!\n\nЭто решение можно принять здесь или на вкладке 'Денежный кризис'."
 new_silver_currency:0 "Ввести новую серебряную валюту"
 new_silver_currency_desc:0 "Чтобы смягчить денежный обвал, введение новой валюты с образом нашего лидера стабилизирует курсы.\n#G Это снизит обесценивание серебра #!\n\nЭто решение можно принять здесь или на вкладке 'Денежный кризис'."
 has_deflation_decision:0 "У вас есть дефляция"
 has_silver_decision:0 "У вас есть обесценивание серебра"
 overexpansion_the_reform:0 "Решение проблемы республиканской экспансии"
 overexpansion_the_reform_desc:0 "Успешная реформа замедлит административные трудности ценой некоторого трения.\n#R В случае провала возникнет политическая нестабильность #! \nПопулярность лидера повышает шанс успеха, а коррупция его снижает.\n#G Все модификаторы республиканской экспансии будут убраны #!"
 overexpansion_the_reform_instability:0 "Решение проблемы республиканской экспансии"
 overexpansion_the_reform_instability_desc:0 "Во времена нестабильности многие могут силой своей воли протолкнуть реформы ради навязывания решения...\n#G Все модификаторы республиканской экспансии будут убраны #!"
 repair_great_work:0 "Отремонтировать великие сооружения"
 repair_great_work_desc:0 "Начать ремонт великого сооружения"
 new_cultural_identity:0 "Принять новую культурную идентичность"
 new_cultural_identity_desc:0 "Мы действительно римляне? Похоже, что мы не главная сила, имеющая право на это наследие.\n\nВозможно, более локальные корни принесут нам больше пользы?"
 tutela_limitum:0 "Tutela Limitum"
 tutela_limitum_desc:0 "Границы империи должны быть защищены — и лучшая защита, чем нападение, вряд ли найдётся."
 split_empire:0 "Разделить империю"
 split_empire_desc:0 "Нашей империи тяжело управлять из-за её огромных размеров, возможно, стоит рассмотреть административное разделение?"

