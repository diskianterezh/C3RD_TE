 #Events

 low_stab_event.1.t:0 "Катастрофическая нестабильность"
 low_stab_event.1.desc:0 "Наша страна переживает тяжёлый кризис нестабильности. Каковы бы ни были причины, приведшие нас к такому положению, мы должны быстро принять решение, чтобы избежать полного краха всего, что мы построили."
 low_stab_event.1.a:0 "И что же мы можем с этим поделать?"
 low_stab_event.1.a.tt1:0 "Может быть, всё само собой уладится?"
 low_stab_event.1.b:0 "Наш правитель лично вмешается"
 low_stab_event.1.b.tt1:0 "Чтобы выйти из этой ситуации, правитель рискует собственной личностью"
 low_stab_event.1.c:0 "Заручиться поддержкой Сената!"
 low_stab_event.1.c.tt1:0 "Члены Сената обязаны нам многими услугами, организуем чрезвычайное заседание, чтобы исправить ситуацию"
 low_stab_event.1.d:0 "Пусть элита возьмёт всё под контроль"
 low_stab_event.1.d.tt1:0 "Знатнейшие семьи усилят контроль над страной, чтобы предотвратить полный крах"
 low_stab_event.1.e:0 "Власть народу — единственный способ избежать катастрофы"
 low_stab_event.1.e.tt1:0 "Демократы протолкнут реформы, чтобы спасти ситуацию"
 low_stab_event.1.f:0 "Ещё не поздно обратиться к богам"
 low_stab_event.1.f.tt1:0 "Вмешательство жрецов могло бы стабилизировать ситуацию"

 low_stab_event.2.t:0 "Страна стабилизирована"
 low_stab_event.2.desc:0 "После почти случившейся катастрофы наше безупречное управление страной позволило нам значительно смягчить кризис и вернуть более стабильное положение."
 low_stab_event.2.a:0 "Будем осторожнее в следующий раз"
 low_stab_event.2.a.tt1:0 "Кризис урегулирован"

 low_stab_event.3.t:0 "Губернатор отделяется"
 low_stab_event.3.desc:0 "Один из наших нелояльных губернаторов воспользовался кризисом и в одностороннем порядке объявил себя королём [byebye.GetName]. Это предательство не останется безнаказанным."
 low_stab_event.3.a:0 "На одну проблему меньше"
 low_stab_event.3.a.tt1:0 "Уход смутьянов — это возможность очистить страну"
 low_stab_event.3.b:0 "Смерть ему!"
 low_stab_event.3.b.tt1:0 "Восстановим порядок мечом"

 low_stab_event.4.t:0 "Губернатор вмешивается"
 low_stab_event.4.desc:0 "[independent_current_governor.GetName], губернатор [independent_governorship.GetName], прислал нам предложение. В хаосе нынешних событий он предлагает хартию автономии для своего губернаторства. Такая реорганизация упростит управление, делегировав большинство решений ему, но это может быть лишь хитростью для укрепления его власти над богатыми землями!"
 low_stab_event.4.a:0 "Спасительное предложение!"
 low_stab_event.4.a.tt1:0 "Губернаторство станет клиентским государством"
 low_stab_event.4.b:0 "Хитро, но нет!"
 low_stab_event.4.b.tt1:0 "Всё останется как есть, но [independent_current_governor.GetName] затаит обиду"
 low_stab_event.4.c:0 "Ты предатель!"
 low_stab_event.4.c.tt1:0 "Всё останется как есть, но обида [independent_current_governor.GetName] нанесёт ущерб единству страны"

 low_stab_event.7.t:0 "Землевладелец отстраняется"
 low_stab_event.7.desc:0 "Перед лицом потрясений, сотрясающих страну, [byebye_owner.GetName] решил, что приоритетом является защита своих владений. Поэтому он в одностороннем порядке удалился в своё поместье в [byebye_domain.GetName], чтобы управлять ими как полный автократ."
 low_stab_event.7.tt1:0 "Области во владениях [byebye_owner.GetName], граничащие с [byebye_domain.GetName], перейдут под власть [byebye_domain.GetName]"
 low_stab_event.7.a:0 "Пусть играет в царя, у нас есть дела поважнее"
 low_stab_event.7.a.tt1:0 "[byebye_owner.GetName] присоединится к [byebye_domain.GetName] как новый правитель. [byebye_domain.GetName] становится клиентским государством"
 low_stab_event.7.b:0 "Предатель! Отобрать всё, что осталось"
 low_stab_event.7.b.tt1:0 "Все регионы, принадлежащие [byebye_owner.GetName], больше не будут под его контролем и не смогут быть унаследованы его семьёй"

 low_stab_event.8.t:0 "Землевладелец вмешивается"
 low_stab_event.8.desc:0 "[asked_landowner.GetName], фактический хозяин некоторых регионов нашей страны, обратился к нам с предложением. В условиях ухудшающейся ситуации он хочет укрыть часть своих владений и, по его словам, «гарантировать стабильность своих земель». Это означало бы дать ему ещё больше автономии... но есть ли у нас выбор?"
 low_stab_event.8.a:0 "Если уж придётся..."
 low_stab_event.8.a.tt1:0 "[asked_landowner.GetName] объединит часть своих владений в автономное поместье"
 low_stab_event.8.b:0 "Хитро, но нет!"
 low_stab_event.8.b.tt1:0 "Всё останется как есть, но обида [asked_landowner.GetName] нанесёт ущерб единству страны"
 low_stab_event.8.c:0 "Ты предатель!"
 low_stab_event.8.c.tt1:0 "Всё останется как есть, но обида [asked_landowner.GetName] сильно ударит по единству страны"

 low_stab_event.9.t:0 "Расширенная защита"
 low_stab_event.9.desc:0 "[duchy_subject_grabber.GetName], наш приграничный Дукат, объявил о намерении «великодушно» распространить защиту своих крепких стен на [state_duchy_grab.GetName]. По их словам, этот регион также подвергается давлению на границах, и они «щедро» предлагают распространить на него свои защитные меры. \nНо не обманывайтесь: это чистая аннексия, и лишь катастрофическое положение нашей страны дало им смелость на такой шаг. Однако официальное разрешение позволит нам сохранить видимость суверенитета — ценой этих земель..."
 low_stab_event.9.a:0 "Вот необходимые документы"
 low_stab_event.9.a.tt1:0 "[state_duchy_grab.GetName] будет аннексирован [duchy_subject_grabber.GetName]"
 low_stab_event.9.a.tt2:0 "#R У вас недостаточно войск, чтобы этому помешать#!"
 low_stab_event.9.b:0 "Срочно мобилизовать гарнизон в регионе"
 low_stab_event.9.b.tt1:0 "Вы разместите гарнизон в [state_duchy_grab.GetName], чтобы пресечь экспансию [duchy_subject_grabber.GetName]"

 low_stab_event.10.t:0 "Независимый дух"
 low_stab_event.10.desc:0 "В разгар смуты возрождается самобытность: [asking_minority_want.GetName], значительное меньшинство в нашей стране, являются наиболее ярким тому примером. Пока столпы нашего государства рушатся в эти трудные времена, представители этой важной культуры объединяются вокруг своих ценностей.\nБанальная тоска? Начало более широкого движения? В любом случае, стоит предпринять шаги, чтобы включить [asking_minority_want.GetName] в наше культурное единство."
 low_stab_event.10.a:0 "Эта страна принадлежит и им!"
 low_stab_event.10.a.tt1:0 "[asking_minority_want.GetName] получат культурное право #Y Знати#!"
 low_stab_event.10.b:0 "Игнорируйте этих... крестьян"
 low_stab_event.10.b.tt1:0 "#R [asking_minority_want.GetName] начнут заговор с целью широкой сецессии#!"

 low_stab_event.11.t:0 "Восстание прикованных"
 low_stab_event.11.desc:0 "Всем известно, что наше правительство не отличается мягкосердечием и что железная рука [ROOT.GetCountry.GetRuler.GetName] крепко держит страну, подавляя всякую оппозицию. Однако в условиях надвигающегося краха всё больше голосов, требующих решительных перемен, собирается вокруг [tyranny_character.GetName].\nЕдинодушные и сильные, они готовы пойти до конца и разрушить государство тирании.\nОтмена некоторых репрессивных мер могла бы удовлетворить этих мятежников, но какой ценой для стабильности государства?"
 low_stab_event.11.a:0 "Сдадимся, чего бы это ни стоило"
 low_stab_event.11.a.tt1:0 "Восстание не распространится"
 low_stab_event.11.b:0 "Предательство!"
 low_stab_event.11.b.tt1:0 "Вы отказываетесь уступить, несмотря на неспособность подавить восстание"
 low_stab_event.11.b.tt2:0 "Члены семьи [tyranny_character.GetName] потеряют #R 10#! лояльности"
 low_stab_event.11.b.tt3:0 "#R Все мятежные губернаторства получат тяжёлые штрафы#!"
 low_stab_event.11.c:0 "Попросим вмешаться [king_maker_tyranny.GetName]"
 low_stab_event.11.c.tt1:0 "#G Это возможно, так как [king_maker_tyranny.GetName] является верным творцом королей#!"

 low_stab_event.12.t:0 "Каждый кризис — это возможность"
 low_stab_event.12.desc:0 "Пока наш правитель занят в столице, удерживая распадающуюся империю, в провинциях все стремятся захватить богатые земли, оставшиеся без присмотра. Особенно часто мишенью становятся частные владения правителя: как оправдать такое изобилие частных земель, доходы с которых напрямую идут на личные расходы [ROOT.GetCountry.GetRuler.GetName], когда страна стоит на грани краха?\n\nО том, что все остальные поступают так же, умалчивается, но ясно, что это атака на интересы лидера в землях, которые ещё не полностью перешли под контроль какой-либо фракции..."
 low_stab_event.12.a:0 "Откажемся от этих земель ради [ROOT.GetCountry.GetName]"
 low_stab_event.12.a.tt1:0 "Ваш правитель полностью откажется от владений в губернаторствах:"
 low_stab_event.12.a.tt2:0 "[tmp_loc_govship.GetName]"
 low_stab_event.12.b:0 "Эти земли вполне в порядке!"
 low_stab_event.12.b.tt1:0 "Ничего не изменится"

 low_stab_event.13.t:0 "Захваченные владения"
 low_stab_event.13.desc:0 "Хотя наши решительные меры осудили любые действия против частных земель [ROOT.GetCountry.GetRuler.GetName], разгорячённое состояние страны способствовало возникновению тайного заговора под руководством [event_13_character.GetName]. С поддержкой губернаторов он организовал прямой захват владений правителя в регионах, где его власть не была прочной. Мы всё ещё можем решительно осудить это, но не лучше ли объединить людей в это смутное время?"
 low_stab_event.13.a:0 "Поступим так, стабильность страны превыше всего"
 low_stab_event.13.a.tt1:0 "Ваш правитель полностью откажется от владений в губернаторствах:"
 low_stab_event.13.b:0 "Осудим эти несправедливые практики!"
 low_stab_event.13.b.tt1:0 "Вы сократите потерю владений на 50% в губернаторствах:"

 low_stab_event.14.t:0 "С великими бедами приходят великие реформы"
 low_stab_event.14.desc:0 "В то время как всё вокруг рушится, коалиция влиятельных людей во главе с [event_14_character.GetName] предложила амбициозную программу реформ государственного управления. Идея заключается в радикальном расширении полномочий местных сообществ и элит, чтобы они могли эффективно решать проблемы. Это могло бы значительно укрепить нашу страну, но ценой определённой децентрализации..."
 low_stab_event.14.a:0 "Отчаянные времена требуют отчаянных мер!"
 low_stab_event.14.a.tt1:0 "Вы предоставите элите особые местные права и привилегии"
 low_stab_event.14.b:0 "Мы не настолько отчаянны"
 low_stab_event.14.b.tt1:0 "Эта возможность не представится ещё долгое время"

 low_stab_event.15.t:0 "Разрушающаяся администрация"
 low_stab_event.15.desc:0 "Небольшие, но тревожные сообщения указывают на опасную тенденцию в регионе [problems_governorship.GetName]. Потеря доверия к институтам, усугублённая нашей... сложной ситуацией, породила сильные автономистские настроения. Население предпочитает обходные пути — бартер, а также местное правосудие и налогообложение, минуя государство. Кто-то скажет, что это логично и со временем утихнет, но что если нет?"
 low_stab_event.15.a:0 "Это прискорбно"
 low_stab_event.15.a.tt1:0 "Государства в регионе [problems_governorship.GetName] получат серьёзный штраф к производству\n#R Государства, захваченные варварами, станут независимыми#!"
 low_stab_event.15.a.tt2:0 "На все государства будет наложен следующий модификатор:"
 low_stab_event.15.b:0 "Не сдавайтесь и стойте твёрдо!"
 low_stab_event.15.b.tt1:0 "Так как ваша стабильность выше минимума, вы сможете предотвратить эти эффекты"


 c3rd_events.1.t:0 "Бюрократический хаос"
 c3rd_events.1.desc:0 "Наша бюрократическая система запуталась в дипломатических отношениях и больше не справляется с делами многочисленных стран, составляющих империю. Однако некоторые подданные приспособились, и особенно [chosen_subject.GetName], который естественным образом заполнил административные пробелы собственными управленцами. По их словам, это «значительно облегчит административную перегрузку»..."
 c3rd_events.1.a:0 "Ну, наверное, это хорошо?"
 c3rd_events.1.a.tt1:0 "[chosen_subject.GetName] станет более автономным и отдалится от центрального управления, став теперь Даньником"

 c3rd_events.2.t:0 "Конец эпохи?"
 c3rd_events.2.desc:0 "Время идёт, и цивилизации уходят. Эта эпоха, похоже, достигла своего пика... и своих пределов. Вековые традиции и даже самые совершенные системы выдыхаются, а время словно остановилось, ожидая неминуемого бедствия. Ветер перемен дует по этим землям, принося звуки надвигающейся бури.\nПусть столпы вашей империи устоят в грядущие века..."
 c3rd_events.2.a:0 "Не будем слушать этих пророков беды"
 c3rd_events.2.a.tt1:0 "Теперь могут происходить события III века"


 c3rd_events.3.t:0 "Генерал берёт власть"
 c3rd_events.3.desc:0 "Кризис преемственности, похоже, открыл поле возможностей для многих... [king_maker_general.GetName], один из наших генералов, при поддержке [general_friend.GetName] усилил своё командование и готов использовать рычаги своей армии, чтобы навязать свою волю."
 c3rd_events.3.desc.1:0 "\nВ ярости от возвышения [general_target.GetName] к власти, он настойчиво потребовал выдать ему этого человека, которого назвал «предательским вором», чтобы тот был «судим за свои преступления». Такая дерзость была бы смешной, если бы не поддержка армии, готовой двинуться на нашу столицу..."
 c3rd_events.3.desc.2:0 "\nОпасаясь притязаний [general_target.GetName], он заявляет о готовности нейтрализовать угрозу, которую тот несёт стабильности страны. И предлагает опереться на легитимность силы, чтобы оправдать его арест и немедленный суд. Было бы опасно враждовать с таким решительным человеком, способным силой добиться своего..."
 c3rd_events.3.a:0 "По правде говоря, наш новый лидер не так уж незаменим"
 c3rd_events.3.a.tt1:0 "Наш лидер будет выдан в плен [king_maker_general.GetName]\n#R Предоставление такой легитимности генералу может стать опасным прецедентом#!"
 c3rd_events.3.b:0 "Хороший повод избавиться от помехи"
 c3rd_events.3.b.tt1:0 "[general_target.GetName] будет выдан в плен [king_maker_general.GetName]\n#R Предоставление такой легитимности генералу может стать опасным прецедентом#!"
 c3rd_events.3.c:0 "Немного поздно, [king_maker_general.GetName]"
 c3rd_events.3.c.tt1:0 "Это было бы заманчиво, если бы человек не успел сбежать за границу..."
 c3rd_events.3.d:0 "Генерал не будет диктовать закон!"
 c3rd_events.3.d.tt1:0 "Явный отказ, который, несомненно, не понравится генералу и его сторонникам."

 c3rd_events.4.t:0 "Генерал берёт власть"
 c3rd_events.4.desc.1:0 "Во время фиктивного назначения [general_target.GetName] не понял, что его охрану заменили доверенные люди [king_maker_general.GetName]. Его арест по обвинению в «измене» прошёл быстро, крики протеста были жестко подавлены кляпом, а повседневные дела вело покладистое правительство.\nЧерез несколько дней мы узнали, что «исключительный военный трибунал» под председательством [king_maker_general.GetName] признал [general_target.GetName] виновным в государственной измене и немедленно казнил его."
 c3rd_events.4.desc.2:0 "Благодаря нашему сотрудничеству [general_target.GetName], похоже, был захвачен и доставлен к [king_maker_general.GetName].\nЧерез несколько дней мы узнали, что «исключительный военный трибунал» под председательством [king_maker_general.GetName] признал [general_target.GetName] виновным в государственной измене и немедленно казнил его."
 c3rd_events.4.a:0 "Хорошо выполненная работа"
 c3rd_events.4.a.tt1:0 "Хорошая организация операции не вызовет потрясений в государственных делах"
 c3rd_events.4.b:0 "Провозгласим [king_maker_general.GetName] нашим новым правителем"
 c3rd_events.4.b.tt1:0 "Эта опция доступна, потому что [king_maker_general.GetName] популярен.\nНазначение сильного лидера во главе государства стабилизирует ситуацию"
 c3rd_events.4.c:0 "Несколько утечек позволят незаметно обвинить [king_maker_general.GetName]"
 c3rd_events.4.c.tt1:0 "Разумно ограничить влияние таких людей"


 c3rd_events.5.t:0 "Протянутая рука"
 c3rd_events.5.desc:0 "Пока наша страна сталкивается с трудностями, [volontary_general.GetName] решил помочь нам по собственной инициативе. С большой армией и поддержкой в стране он предлагает публично вмешаться на нашей стороне. Это может укрепить нашу власть в трудное время.\nОднако это может быть воспринято как незаконный захват власти и привести к новым проблемам..."
 c3rd_events.5.a:0 "Демонстрация силы — то, что нам нужно."
 c3rd_events.5.a.tt1:0 "[volontary_general.GetName] вмешается, чтобы укрепить нашу власть.\n#R Это может быть воспринято как переворот#!\nПопулярность генерала увеличит шансы на успех"
 c3rd_events.5.b:0 "Это опасно и ненужно"
 c3rd_events.5.b.tt1:0 "Амбиции сдержаны на данный момент, но мы потеряем расположение [volontary_general.GetName]."

 c3rd_events.6.t:0 "Силовое вмешательство"
 c3rd_events.6.desc.1:0 "Если публичное вмешательство [volontary_general.GetName] несомненно дало результат, мы, вероятно, переоценили его дипломатические способности. Когда его люди демонстрировали силу в столице, среди элит возникло сильное сопротивление: они были возмущены тем, что армия вторглась в их сферу влияния. Задетый до глубины души, наш генерал удвоил рвение, заковал оппозицию и установил железную хватку над институтами.\nХотя наша власть несомненно укрепилась, новая влиятельность [volontary_general.GetName] явно не входила в цели операции."
 c3rd_events.6.desc.2:0 "Когда [volontary_general.GetName] публично выступил в нашу поддержку, никто не мог предсказать, что такие благородные слова будут так плохо приняты. Волна возмущения прокатилась по сенату, старейшины кричали в негодовании, считая это попыткой переворота.\n\nСессия могла обернуться кошмаром, но невероятным политическим мастерством наш правитель сумел отмежевать правительство от «изолированной попытки» [volontary_general.GetName]. Поскольку он взял всю ответственность на себя, в итоге мы вернули симпатию и поддержку всех."
 c3rd_events.6.a:0 "Так много власти в руках армии."
 c3rd_events.6.a.tt1:0 "Начинается период смуты..."
 c3rd_events.6.b:0 "Фух! Будем надеяться, [volontary_general.GetName] простит нас"
 c3rd_events.6.b.tt1:0 "Попытка провалилась, но мы всё же смогли извлечь выгоду. Надеемся, мы не слишком обидели армию."

 c3rd_events.7.t:0 "Слава империи"
 c3rd_events.7.desc:0 "Уже несколько месяцев ропот недовольства потрясает ряды офицеров. Группа военных во главе с [general_leader.GetName] открыто жалуется на слабость правительства."
 c3rd_events.7.desc.1:0 "\nПодчёркивая моральное превосходство нашей империи и факел цивилизации, который она несёт, для этих людей абсолютно невыносимо, что банда 'некультурных варваров' угрожает нашим границам. Они требуют немедленной интервенции против [target_neighbour.GetName], чтобы умиротворить рубежи."
 c3rd_events.7.desc.2:0 "\nОни утверждают, что угрозу, исходящую от [target_neighbour.GetName] у наших границ, игнорировать нельзя, и призывают к немедленному упреждающему военному вмешательству."
 c3rd_events.7.a:0 "Опасения этих генералов обоснованны, на войну!"
 c3rd_events.7.a.tt1:0 "Вы объявите войну державе [target_neighbour.GetName]"
 c3rd_events.7.b:0 "Нам нужно время, чтобы подготовиться"
 c3rd_events.7.b.tt1:0 "Вы обещаете вмешательство в [target_neighbour.GetName] в течение года. #R Нарушение обещания будет воспринято крайне негативно #!"
 c3rd_events.7.c:0 "Не вам решать политику государства!"
 c3rd_events.7.c.tt1:0 "Генералы будут разочарованы"

 c3rd_events.75.t:0 "Нарушенное обещание"
 c3rd_events.75.desc:0 "После вашего обещания вмешаться в дела [target_neighbour.GetName] генералы возлагали большие надежды на правительство. Однако прошёл год, и обещание, похоже, окончательно забыто... Военные чувствуют себя преданными, и ходят слухи о том, что в их глазах органы власти потеряли легитимность."
 c3rd_events.75.a:0 "Что могут значить какие-то жалобы?"
 c3rd_events.75.a.tt1:0 " #R Генералы сильно разочарованы #!"

 c3rd_events.8.t:0 "Необходимые реформы"
 c3rd_events.8.desc:0 "Делегация генералов во главе с [general_leader.GetName] явилась с просьбой о реорганизации армии. Начинает ощущаться нехватка людей, а набор затруднён в сословиях, традиционно занимающихся этим делом. Они требуют большей гибкости в наборе и пересмотра уровня жалования. \nЭто разумное предложение, хотя опытный политик легко заметит, что такие изменения дадут [general_leader.GetName] неоспоримое влияние на войска."
 c3rd_events.8.a:0 "Очень разумное требование"
 c3rd_events.8.a.tt1:0 "Уровень рекрутирования будет снижен"
 c3rd_events.8.b:0 "Мы видим твои истинные цели... абсолютно неприемлемо"
 c3rd_events.8.b.tt1:0 "Этот отказ оскорбит генералов. #R Это может увеличить риск военного мятежа #!"

 c3rd_events.81.t:0 "Влиятельный воин"
 c3rd_events.81.desc:0 "Наша армия доблестна, и во главе её [general_leader.GetName], снискавший репутацию незаменимого полководца. Этот влиятельный человек держит военную мощь в своих руках и, похоже, намерен извлечь из этого выгоду.\nТеперь он требует от правительства проявить щедрость, чтобы воздать должное его защите наших институтов. Хотя он пока настроен благожелательно, ясно, что это не что иное, как давление ради почестей и престижа... отказать в которых было бы неразумно."
 c3rd_events.81.a:0 "Он заслужил эти почести"
 c3rd_events.81.a.tt1:0 "Генерал будет осыпан почестями"
 c3rd_events.81.b:0 "Хороший генерал должен знать своё место"
 c3rd_events.81.b.tt1:0 "Этот отказ оскорбит генерала. #R Это может увеличить риск военного мятежа #!"

 c3rd_events.9.t:0 "Военное вмешательство"
 c3rd_events.9.desc:0 "Несколько недель решения нашего правителя [assa_ruler.GetName] только снижали его популярность. Генералы открыто обвиняли его в мягкотелости, и его политика была для них невыносима. Но хотя этот напряжённый климат был известен нашему лидеру, мало кто мог предвидеть, что случится дальше."
 c3rd_events.9.desc.1:0 "\n\nШок был полным, когда дрожащий гонец принёс сенату ужасную новость: наш правитель, направлявшийся в парламент, был жестоко убит несколькими людьми, а его тело осталось окровавленным на городской мостовой. Виновные не пойманы, но все подозревают, что [general_leader.GetName], глава самой воинственной военной фракции, не чужд этому событию..."
 c3rd_events.9.desc.2:0 "\n\nКогда наш царь отдыхал в шатре во время смотра войск, несколько солдат ворвались внутрь и зверски зарубили его мечами, несмотря на мольбы. Виновные вскоре были распяты, но всем ясно, что за этим убийством стояла рука [general_leader.GetName].\nБолее того, он был одним из первых, кто явился к преемнику, чтобы принести присягу верности и заверить в защите — пока тот 'не будет повторять ошибок предшественника'..."
 c3rd_events.9.desc.3:0 "\n\nКогда наш царь отдыхал в шатре во время смотра войск, несколько солдат ворвались внутрь и зверски зарубили его мечами, несмотря на мольбы. Виновные вскоре были распяты, но всем ясно, что за этим убийством стояла рука [general_leader.GetName].\nЭта могущественная фигура, обладающая несомненной политической властью и военным авторитетом, не уставала указывать на неспособность нашего лидера.\nВ хаосе, что последовал, он первым объявил себя 'законным' преемником — и никто не возразил... пока что. Прежний наследник был быстро устранён, и страна замерла в ожидании."
 c3rd_events.9.a:0 "Что за...?"
 c3rd_events.9.a.tt1:0 "Это событие потрясёт страну"
 c3rd_events.9.b:0 "Ну, да здравствует [general_leader.GetName], наверное?"
 c3rd_events.9.b.tt1:0 "[general_leader.GetName] захватывает власть при поддержке армии"

#Military anarchy split

 c3rd_events.10.t:0 "Раскол [rival_emperor.GetName]"
 c3rd_events.10.desc:0 "[rival_emperor.GetName], ожидая скорого ареста, произнёс перед своими войсками, фанатично вдохновлёнными его личностью, пламенную речь о величии нашей державы, её недавнем упадке, а также о «несправедливостях», жертвой которых он стал. Под одобрительные крики солдат и восхваления соратников, он был провозглашён новым законным императором. Из всех уголков страны приходят тревожные вести о войсках и губернаторах, признающих его притязания."
 c3rd_events.10.a:0 "Предателям одна участь — смерть."
 c3rd_events.10.a.tt1:0 "Немедленно будет объявлена война сепаратистам"
 c3rd_events.10.b:0 "Если они думают, что этот выскочка защитит их лучше..."
 c3rd_events.10.b.tt1:0 "Соперничающая империя отделяется, и пока всё остаётся как есть.\nТак как обе империи претендуют на главный титул, в дальнейшем может появиться шанс мирного воссоединения.\nЕсли разделение продлится слишком долго, раскол станет окончательным."
 c3rd_events.10.c:0 "Наши администраторы и верные люди всегда на местах..."
 c3rd_events.10.c.tt1:0 "Эта опция доступна, потому что ваша империя значительно больше.\nМы можем выстроить административные пути, которые облегчат будущее воссоединение.\nТак как обе империи претендуют на главный титул, в дальнейшем может появиться шанс мирного воссоединения.\nЕсли разделение продлится слишком долго, раскол станет окончательным."

 c3rd_events.11.t:0 "Воссоединение"
 c3rd_events.11.desc:0 "После смерти нашего правителя усердный совет постановил прекратить это безумие и подчиниться требованиям истинной империи."
 c3rd_events.11.a:0 "Конец истории."
 c3rd_events.11.a.tt1:0 "Вы будете присоединены к [moma_wait_for_me.GetName], приключение окончено"
 c3rd_events.11.b:0 "Подождите, нет, НЕТ!"
 c3rd_events.11.b.tt1:0 "Будучи игроком, вы сможете продолжить историю, но за определённую цену..."

 c3rd_events.12.t:0 "Воссоединение"
 c3rd_events.12.desc:0 "После смерти их правителя, государство [reunification.GetName] и устойчивость его институтов сделали претензии на империю весьма слабыми. Их новый лидер, [reunification.GetRuler.GetName], разумный и хитрый, прислал нам заманчивое предложение: в обмен на защиту себя и своего народа он готов содействовать мирному воссоединению империи.\nПосле инсценированной битвы [reunification.GetRuler.GetName] был «случайно» пленён и доставлен в столицу, где подвергся символическому наказанию, после чего был восстановлен в своих правах и обязанностях.\nИмперия вновь объединена."
 c3rd_events.12.a:0 "Добро пожаловать обратно, дети империи."
 c3rd_events.12.a.tt1:0 "Империя воссоединена, бывший персонаж возвращён"
 c3rd_events.12.b:0 "Пощадите его, но смерть остальным!"
 c3rd_events.12.b.tt1:0 "Империя воссоединена, но все прочие бывшие персонажи казнены"

 c3rd_events.13.t:0 "Воссоединение провалилось"
 c3rd_events.13.desc:0 "После смерти их правителя, [rival_empire.GetName] обрела нового лидера — [rival_empire.GetRuler.GetName],"
 c3rd_events.13.desc.1:0 " однако сепаратистские настроения всё ещё глубоко укоренены в элите, и даже мысли о воссоединении не возникло."
 c3rd_events.13.desc.2:0 " хотя переход власти прошёл спокойно, обсуждения возможности воссоединения оказались весьма неохотными..."
 c3rd_events.13.desc.3:0 " однако преемственность не была очевидной, значительная часть элиты, похоже, выступала за воссоединение."
 c3rd_events.13.desc.4:0 " однако передача власти сопровождалась сильными волнениями, большинство элиты хотело прекратить раскол, и мы совсем немного не дотянули до воссоединения..."
 c3rd_events.13.a:0 "Их маленькое приключение продолжается..."
 c3rd_events.13.a.tt1:0 "Империя остаётся разделённой"

 c3rd_events.14.t:0 "Раскол закреплён"
 c3rd_events.14.desc:0 "После смерти их правителя новый лидер [ex_rival_empire.GetName], [ex_rival_empire.GetRuler.GetName], сумел объединить великие семьи под своей властью и окончательно закрыл вопрос о каком-либо воссоединении. Хотя он всё ещё претендует на наш титул, теперь он правитель страны, которая определённо отличается от нашей.\nПохоже, что воссоединение империи возможно лишь более... классическими методами."
 c3rd_events.14.a:0 "Вот что бывает, когда сидишь сложа руки!"
 c3rd_events.14.a.tt1:0 "Империя окончательно разделена, и возможность воссоединения после смерти монарха теперь невозможна."

 c3rd_events.15.t:0 "Смута в [rival_empire.GetName]"
 c3rd_events.15.desc:0 "Прибыл посланник из «двора» [rival_empire.GetName]. Их маленькая империя, некогда единая, сейчас раздираема соперничающими фракциями и стоит на грани распада. У нас, однако, есть уникальная возможность: часть их элиты обращается к нам, желая избежать кровопролития.\nПозволить им скатиться в гражданскую войну заманчиво, но тонкое вмешательство для восстановления порядка укрепит нашу власть и напомнит, что только мы способны хранить мир."
 c3rd_events.15.a:0 "Здравое решение."
 c3rd_events.15.a.tt1:0 "Вы вмешаетесь, чтобы восстановить гражданский мир в [rival_empire.GetName].\n #G Это увеличит шансы на будущее воссоединение #!"
 c3rd_events.15.b:0 "И упустить шанс плясать на их руинах?"
 c3rd_events.15.b.tt1:0 "Вы ничего не предпримете"

 c3rd_events.16.t:0 "Призыв о помощи"
 c3rd_events.16.desc:0 "[rival_empire.GetName] оказалась в тяжёлом положении, их текущая война идёт не по плану. Чудесным образом вспомнив о своём истинном владыке, один из их посланников обратился к нам за помощью в войне.\nТакая наглость забавна, но разве это не подходящий момент напомнить им, почему мы незаменимы?"
 c3rd_events.16.a:0 "Их земля — наша земля, и мы обязаны её защитить."
 c3rd_events.16.a.tt1:0 "Вы вступите в войну на стороне [rival_empire.GetName].\n #G Это сильно увеличит шансы на будущее воссоединение #!"
 c3rd_events.16.b:0 "Очень смешно..."
 c3rd_events.16.b.tt1:0 "Вы ничего не предпримете"

 c3rd_events.17.t:0 "Нестабильность в [rival_empire.GetName]"
 c3rd_events.17.desc:0 "Прибыл посланник: [rival_empire.GetName] переживает трудные времена, народ теряет доверие к правительству, управление катастрофично.\nВспомнив о нашем сюзеренитете над их землями, часть их элиты склоняется к нашей интервенции для восстановления равновесия. Это предложение, хотя и крайне забавное, учитывая их сепаратизм, может стать интересной возможностью укрепить нашу власть."
 c3rd_events.17.a:0 "Наши земли управляются хорошо, а их земли — наши."
 c3rd_events.17.a.tt1:0 "Вы вмешаетесь, чтобы стабилизировать их страну.\n #G Это увеличит шансы на будущее воссоединение #!"
 c3rd_events.17.b:0 "Пусть плачут и смотрят, как справляемся мы"
 c3rd_events.17.b.tt1:0 "Вы ничего не предпримете"

 c3rd_events.18.t:0 "Шанс в [rival_empire.GetName]"
 c3rd_events.18.desc:0 "Наши осведомители сообщают, что правительство [rival_empire.GetName] в упадке, некоторые начинают говорить, что их лидер недостоин и раскол был ошибкой. Похоже, это блестящая возможность подтолкнуть их элиту к присоединению к нам."
 c3rd_events.18.a:0 "Не жалеть даров."
 c3rd_events.18.a.tt1:0 "Вы покажете, что их интересы куда лучше защищены у нас.\n#G Это увеличит шансы на воссоединение#!"
 c3rd_events.18.b:0 "Разве это не доказательство, что только мы законны?"
 c3rd_events.18.b.tt1:0 "Вы ничего не предпримете"

 c3rd_events.19.t:0 "Конец раскола"
 c3rd_events.19.desc:0 "После исчезновения старой империи никто больше не оспаривает наше право на власть. Пусть начнётся наша история!"
 c3rd_events.19.a:0 "Пора."
 c3rd_events.19.a.tt1:0 "Империя окончательно независима."

 c3rd_events.20.t:0 "Конец раскола"
 c3rd_events.20.desc:0 "После смерти нашего правителя новый лидер сумел объединить великие семьи под своей властью и навсегда закрыл страницу возможного воссоединения. Теперь мы свободны следовать своей цели без угроз смут при наследовании."
 c3rd_events.20.a:0 "Пора."
 c3rd_events.20.a.tt1:0 "Империя окончательно независима."

 c3rd_events.21.t:0 "Дезертирство губернатора"
 c3rd_events.21.desc:0 "Так как империя разделена между двумя соперничающими монархами, некоторые видят в этом шанс для личной выгоды. \n[governor_defect.GetName], губернатор [governorship_defect.GetName], находящийся в «серой зоне» неопределённого суверенитета, похоже, склоняется к притязаниям [rival_empire_defect_to.GetName] и готов признать его законным правителем империи. Это станет серьёзным ударом по нашему влиянию в регионе, но его ещё можно избежать... если действовать быстро!"
 c3rd_events.21.a:0 "Золото вернёт ему здравомыслие"
 c3rd_events.21.a.tt1:0 "Дезертирство губернатора будет предотвращено"
 c3rd_events.21.b:0 "Великие почести для нашего друга!"
 c3rd_events.21.b.tt1:0 "Дезертирство губернатора будет предотвращено"
 c3rd_events.21.c:0 "Минус один предатель"
 c3rd_events.21.c.tt1:0 "Губернатор перейдёт вместе с управляемыми землями"

 c3rd_events.30.t:0 "Переворот [rival_emperor.GetName]"
 c3rd_events.30.desc:0 "Ужасные вести: [rival_emperor.GetName], заручившись поддержкой многих губернаторов и преданных войск, утратил всякое благоразумие. После долгой речи, где он пространно говорил о мнимой «неспособности» нашего правителя, он заявил свои права на трон и объявил, что его партия готова поддержать его без колебаний."
 c3rd_events.30.a:0 "Лучше уступить."
 c3rd_events.30.a.tt1:0 "[rival_emperor.GetName] станет новым правителем страны. #R Однако это затянет военный кризис, который мы переживаем #!"
 c3rd_events.30.b:0 "Отправим представителя арестовать его"
 c3rd_events.30.b.tt1:0 "Вы попытаетесь остановить амбиции мятежника и заключить его под стражу. Результат будет зависеть от вашей легитимности и популярности цели.\n #G В случае успеха вы получите стабильность, а сторонники [rival_emperor.GetName] покорятся #!\n #R В случае неудачи начнётся имперский кризис #!"

 c3rd_events.31.t:0 "Конец переворота"
 c3rd_events.31.desc:0 "Когда наш представитель прибыл, [rival_emperor.GetName] попытался воодушевить свои войска и сторонников речами. Однако перед лицом государственной власти прежняя твёрдая поддержка дрогнула, и солдаты отвернулись. Брошенный своими соратниками, его эго сдулось, как лепёшка, и [rival_emperor.GetName] был доставлен в столицу, где суд быстро отправил его в тюрьму.\nЕго сторонники теперь куда осторожнее, а наша власть укрепилась."
 c3rd_events.31.a:0 "Превосходно"
 c3rd_events.31.a.tt1:0 "Вы положили конец этой угрозе."

 c3rd_events.32.t:0 "Требования влиятельного человека"
 c3rd_events.32.desc:0 "[king_maker_exige.GetName] внезапно ворвался в тронный зал, разъярённый и дрожащий от ярости: «Действия этого подлеца [king_maker_rival.GetName] должны быть прекращены, я требую его немедленного ареста», — провозгласил он без дальнейших объяснений, его взгляд был полон скрытого смысла. Все взгляды обратились к царю; какое будет его решение?"
 c3rd_events.32.a:0 "Лучше не злить [king_maker_exige.GetName]."
 c3rd_events.32.a.tt1:0 "Влияние [king_maker_exige.GetName] позволит арестовать соперника без проблем"
 c3rd_events.32.b:0 "Здесь правлю я, а не ты!"
 c3rd_events.32.b.tt1:0 "Вы не подчинитесь требованиям самодовольного человека."

 c3rd_events.33.t:0 "Хвастовство среди войск"
 c3rd_events.33.desc:0 "До нас дошли слухи из расположенных легионов. Похоже, [popular_general.GetName], один из наших генералов, больше заботится о своём имидже, чем о обязанностях военачальника. Он тратит значительную часть своих сил на укрепление популярности, даже ценой порочащих высказываний о нашем правителе на пьяных пирушках. Эти привычки не были бы серьёзной проблемой, если бы не начинали распространяться и оказывать влияние..."
 c3rd_events.33.a:0 "Неважно."
 c3rd_events.33.a.tt1:0 "Вы оставляете генерала предаваться хвастовству"
 c3rd_events.33.b:0 "Похоже, пора вмешаться"
 c3rd_events.33.b.tt1:0 "Вы приструните генерала."

 c3rd_events.34.t:0 "Конфликт между генералами"
 c3rd_events.34.desc:0 "[general_one.GetName] и [general_two.GetName], два наших генерала, открыто соперничают. Они не перестают демонстрировать доблесть и щедрость, стремясь превзойти друг друга в глазах войск. Их соперничество привлекло столько внимания, что теперь каждый выбирает сторону. Хотя это и не вопрос государственной важности, может быть разумным арбитражировать конфликт в пользу одного из них для нашей выгоды."
 c3rd_events.34.a:0 "Эти перепалки не заслуживают внимания."
 c3rd_events.34.a.tt1:0 "Вы позволяете делу идти своим ходом"
 c3rd_events.34.b:0 "Наше расположение на стороне [general_one.GetName]"
 c3rd_events.34.b.tt1:0 "Вы поддерживаете одного из соперников."
 c3rd_events.34.c:0 "Наше расположение на стороне [general_two.GetName]"
 c3rd_events.34.c.tt1:0 "Вы поддерживаете одного из соперников."

 c3rd_events.35.t:0 "Просьба ради друга"
 c3rd_events.35.desc:0 "[asking_general.GetName], влиятельный генерал, просит аудиенции с необычной просьбой. Потрясённый бездействием своего друга [asking_friend.GetName], он требует для него наместничества [asked_governorship.GetName] в обмен на символическую сумму. Хотя он громко заявляет о великой компетентности своего друга, нет сомнений, что это лишь способ обрести больше влияния."
 c3rd_events.35.a:0 "Угодить [asking_general.GetName] будет мудро."
 c3rd_events.35.a.tt1:0 "Наместничество будет передано"
 c3rd_events.35.b:0 "Нет, ни за что"
 c3rd_events.35.b.tt1:0 "Вы ничего не предпримете, что сильно разозлит [asking_general.GetName]."

 c3rd_events.36.t:0 "Восхождение могущественного человека"
 c3rd_events.36.desc:0 "Общеизвестно, что самые влиятельные люди в нашей стране — могущественные генералы, и хотя это печально, именно их решения часто определяют, чья голова носит корону... Один из наших генералов, [new_king_maker.GetName], собравший поддержку и популярность, похоже, стал одним из них. Однако, чтобы избежать обвинений в нелояльности, он публично заявил, что правительство пользуется его полной поддержкой и защитой.\nИ всё же тяжело видеть империю во власти прихотей ещё одного человека."
 c3rd_events.36.a:0 "Твоя преданность — великая честь, [new_king_maker.GetName]"
 c3rd_events.36.a.tt1:0 "Вы решаете не злить генерала, даже ценой унижения"
 c3rd_events.36.b:0 "Нужно сократить его влияние, пока ещё есть время!"
 c3rd_events.36.b.tt1:0 "Несколько удачных слов должны задеть самоуверенность этого могущественного человека."

 c3rd_events.37.t:0 "Военная анархия"
 c3rd_events.37.desc:0 "Соперничество между rival_one и Philipe достигает новых высот; эти два могущественных человека не перестают противостоять друг другу, и кажется, что на вершине есть место лишь для одного. Ослеплённые своей силой и военной славой, они следуют лишь собственной амбиции и не заботятся о гневе нашего правителя. Тот может лишь наблюдать, как соперники точат оружие и постепенно разрушают его авторитет.\nОднако можно отправить одного из этих двух чемпионов ликторам в оправдание его действий, что позволит сохранить видимость порядка, но настроит против нас другого..."
 c3rd_events.37.a:0 "Пусть сражаются"
 c3rd_events.37.a.tt1:0 "Вы позволяете двум генералам воевать, рискуя выглядеть марионеточным правительством"
 c3rd_events.37.b:0 "Поддержим [rival_one.GetName]"
 c3rd_events.37.b.tt1:0 "[rival_one.GetName] получит поддержку ликторов."
 c3rd_events.37.c:0 "Наше расположение на стороне [rival_two.GetName]"
 c3rd_events.37.c.tt1:0 "[rival_two.GetName] получит поддержку ликторов."

 c3rd_events.38.t:0 "Столкновение"
 c3rd_events.38.desc:0 "Восхождение двух соперников должно было закончиться взрывом. После недель подготовки и интриг [rival_one.GetName] и [rival_two.GetName] собрали большие частные армии и вступили во фратрицидальную битву. После нескольких дней боёв [winner.GetName] сумел загнать противника в угол и уничтожить его, пока его войска бежали в деревни. Теперь он бесспорен и могущественнее, чем когда-либо...\nИ хотя кажется, что этим бедам конец, какой образ показал наш правитель, позволив столь могущественным людям свободно воевать внутри империи! Не говоря уже о разрушениях, которые их войска и беглецы нанесли урожаям и городам на пути."
 c3rd_events.38.a:0 "Поздравляем, [winner.GetName]..."
 c3rd_events.38.a.tt1:0 "[winner.GetName] выходит победителем в столкновении"

 c3rd_events.39.t:0 "Заговоры и пиры"
 c3rd_events.39.desc:0 "[king_maker_unhappy.GetName], могущественный и влиятельный человек, в данный момент не занимает никаких должностей и не имеет занятий. Хотя это значительно ослабляет его власть, он, похоже, глубоко обижен...\nСообщают, что он устраивает у себя пиры и приёмы, пытаясь переманить к себе чиновников. Вино, золото и обещания льются рекой, как и угрозы нашему правительству.\nБудет мудро держать такого человека ближе и без промедления найти ему занятие."
 c3rd_events.39.a:0 "Это раздражает"
 c3rd_events.39.a.tt1:0 "Бездействие [king_maker_unhappy.GetName] подрывает ваше правительство"

 c3rd_events.391.t:0 "Интриги на виду"
 c3rd_events.391.desc:0 "[king_maker_unloyal.GetName], могущественный генерал, находящийся в конфликте с правительством, похоже, готовится к действиям. По словам разведчиков, на месте его дислокации замечены тайные встречи, где, как они утверждают, «обсуждают карты и передвижения войск».\n\nМы пока не знаем, что всё это значит, но лучше быть готовыми."
 c3rd_events.391.a:0 "Это тревожно"
 c3rd_events.391.a.tt1:0 "Бездействие [king_maker_unloyal.GetName] подрывает ваше правительство"

 c3rd_events.40.t:0 "Внеочередное заседание"
 c3rd_events.40.desc:0 "После убийства нашего правителя последовало внеочередное заседание. Однако спокойные и ясные дебаты, бывшие гордостью нашей демократии, на этот раз сменились яростными нападками и открытыми требованиями публичной проскрипции всех. Вряд ли порядок вернётся, пока переворот всё ещё в памяти."
 c3rd_events.40.desc.1:0 "\nВолнение достигло пика, когда [general_leader.GetName], предводитель путчистов, вошёл в парламент в сопровождении вооружённых людей, произнеся длинную речь о жалком состоянии наших институтов и очевидной слабости империи. Он настойчиво требовал срочно передать ему власть, чтобы восстановить величие страны."
 c3rd_events.40.desc.2:0 "\nПрисутствие [general_leader.GetName], недавно избранного главой государства, усилило хаос. Он с уверенной улыбкой начал длинную речь о былом величии страны и слабом состоянии наших институтов. Теперь он настоятельно призывает передать ему власть для восстановления порядка."
 c3rd_events.40.desc.3:0 "\nПосреди хаоса наш недавно избранный правитель тщетно пытался быть услышанным, призывая к радикальным изменениям в институтах и даже к передаче ему власти для наведения порядка."
 c3rd_events.40.a:0 "Арестуем виновных и восстановим порядок!"
 c3rd_events.40.a.tt1:0 " #G Этот выбор возможен благодаря вашей высокой стабильности и поддержке сената #!\n Вы заключите виновных под стражу и положите конец кризису силой воли"
 c3rd_events.40.b:0 "[general_leader.GetName] прав и поведёт нас!"
 c3rd_events.40.b.tt1:0 "[general_leader.GetName] возьмёт под контроль институты, чтобы разрешить кризис.\n #R Это необратимо поведёт вас по пути реформ к монархии #!\n #G В конце реформ вы решите проблему политической нестабильности и получите мощный модификатор для преодоления проблем этой эпохи #!"
 c3rd_events.40.c:0 "[general_leader.GetName] прав и должен вести нас!"
 c3rd_events.40.c.tt1:0 "[general_leader.GetName] возьмёт под контроль институты, чтобы разрешить кризис.\n #R Это необратимо поведёт вас по пути реформ к монархии #!\n #G В конце реформ вы решите проблему политической нестабильности и получите мощный модификатор для преодоления проблем этой эпохи #!"
 c3rd_events.40.d:0 "Мы действительно проведём реформы"
 c3rd_events.40.d.tt1:0 "Вы проведёте радикальные институциональные изменения для разрешения кризиса.\n #R Это необратимо поведёт вас по пути реформ к монархии #!\n #G В конце реформ вы решите проблему политической нестабильности и получите мощный модификатор для преодоления проблем этой эпохи #!"
 c3rd_events.40.e:0 "И изменить наши устои? Никогда!"
 c3rd_events.40.e.tt1:0 " #R Вы упускаете шанс разрешить кризис #!\n #G Вы сохраните республиканский строй и получите решение для преодоления институционального кризиса #!"

 c3rd_events.41.t:0 "Восстановление авторитета"
 c3rd_events.41.desc:0 "Авторитет государства падает, нам необходимо объединить народ вокруг харизматичного лидера, который защитит интересы нации. Но тот, кто хочет вести народ, должен сначала заручиться поддержкой элит и убедить их, что их интересы будут в равной мере защищены."
 c3rd_events.41.a:0 "Одна лишь аура правителя убедит их"
 c3rd_events.41.a.tt1:0 "#G Этот выбор возможен благодаря высокой популярности вашего правителя #!\n Авторитет будет восстановлен"
 c3rd_events.41.b:0 "Золото всегда решает"
 c3rd_events.41.b.tt1:0 "Никто не сможет отказаться."
 c3rd_events.41.c:0 "Элиты пользуются нашим полным доверием, стоит им об этом сообщить"
 c3rd_events.41.c.tt1:0 "Великая свобода наверняка обеспечит поддержку."

 c3rd_events.42.t:0 "Контроль над страной"
 c3rd_events.42.desc:0 "Теперь, когда авторитет государства восстановлен, мы должны вернуть контроль над страной. Были принесены жертвы и даны большие привилегии, но необходимо держать всё под контролем и следить за эффективностью администрации."
 c3rd_events.42.a:0 "Жёсткий закон будет принят без проблем"
 c3rd_events.42.a.tt1:0 "#G Этот выбор возможен благодаря высокой поддержке сената #!\n Контроль будет восстановлен"
 c3rd_events.42.b:0 "Впереди долгие дебаты..."
 c3rd_events.42.b.tt1:0 "Закон в итоге будет принят."
 c3rd_events.42.c:0 "Аристократия всегда пировала без меры..."
 c3rd_events.42.c.tt1:0 "Им это не понравится, но закон пройдёт."

 c3rd_events.43.t:0 "Стабилизация страны"
 c3rd_events.43.desc:0 "Сильное государство ничто, если его основы шатки; для этого поддержка народа необходима, а лучший способ её заручиться — религия. Наши жрецы лишь ждут небольшого поощрения, чтобы объявить нашего правителя избранником богов. Это ясно утвердит наш новый режим как неоспоримый."
 c3rd_events.43.a:0 "Разве мы не единый народ под небом?"
 c3rd_events.43.a.tt1:0 "#G Этот выбор возможен благодаря высокой религиозной единстве #!\n Стабильность будет укреплена"
 c3rd_events.43.b:0 "Все наши проблемы исходят от одних и тех же людей..."
 c3rd_events.43.b.tt1:0 "Козёл отпущения — отличный выход"
 c3rd_events.43.c:0 "Мы всегда уважали жречество!"
 c3rd_events.43.c.tt1:0 "Просто дайте им то, чего они хотят!"

 c3rd_events.44.t:0 "Новая эра"
 c3rd_events.44.desc:0 "Все преграды преодолены, и восхождение нашей новой империи уже не остановить. Перед собранием различных знатных вельмож и новых советников, уже занятых интригами, наш правитель получает длённое благословение от высшего духовенства, после чего обращается к великой центральной площади, где собралась огромная толпа, благодарная тому, кто спас государственные институты. \nБудущее, однако, не будет лёгким — основы ещё не укреплены, и многие вновь жаждут твоего падения. Вступи в эту новую эру с мужеством и мудростью!"
 c3rd_events.44.a:0 "Пусть этот день воспевают вечно!"
 c3rd_events.44.a.tt1:0 "Твоя реформа завершена"


 c3rd_events.45.t:0 "Обожаемый правитель"
 c3rd_events.45.desc:0 "[adored_ruler.GetName] — популярный и могущественный лидер. Немногие из его предшественников обладали такой властью. Естественно, что столь выдающийся человек испытывает более... вечные амбиции во главе государства... Недавно он предпринял шаги, которые некоторые могли бы назвать автократическими, и планирует крупную реформу, чтобы уменьшить влияние противовесов и продлить своё правление. \nПодобное развитие наших институтов наверняка будет недемократичным, но принесёт несомненные преимущества перед лицом вызовов этой эпохи."
 c3rd_events.45.a:0 "Поможем ему в этих реформах"
 c3rd_events.45.a.tt1:0 " #R Это неотвратимо поставит тебя на путь реформ в сторону монархии #!\n #G В конце реформы ты решишь проблему политической нестабильности и получишь мощный модификатор, чтобы противостоять вызовам этой эпохи #!"
 c3rd_events.45.b:0 "Нужно этому помешать!"
 c3rd_events.45.b.tt1:0 "Ты попытаешься сорвать попытку реформ лидера.\n #R Это может вызвать политическую нестабильность #!"

 c3rd_events.46.t:0 "Политическая нестабильность"
 c3rd_events.46.desc:0 "[adored_ruler.GetName] крайне бурно отреагировал на нашу попытку воспрепятствовать его реформам. Наше вмешательство в Сенате с целью осудить его меры едва не вызвало бунт, когда его сторонники и различные оппозиционные группы обменялись старыми обвинениями и проскрипциями. Порядок ещё не восстановлен, и есть опасения новых вспышек насилия. Потребуется время, прежде чем наша конституция оправится."
 c3rd_events.46.a:0 "Проклятье!"
 c3rd_events.46.a.tt1:0 "Реформа остановлена, но начинается трудный период"

 c3rd_events.47.t:0 "Остановленные реформы"
 c3rd_events.47.desc:0 "Напряжение в Сенате было ощутимым, когда длинная вереница противников один за другим выступали против возмутительных желаний реформ [adored_ruler.GetName]. Разъярённый, он поспешил потребовать заключения всех противников, но быстро почувствовал, что настроение зала изменилось не в его пользу... Угроза проскрипции против него заставила его быстро понять, что лучше отказаться..."
 c3rd_events.47.a:0 "Дело сделано"
 c3rd_events.47.a.tt1:0 "Реформа остановлена"


 c3rd_events.48.t:0 "Республиканское управление"
 c3rd_events.48.desc:0 "Никто не может оспорить совершенство наших республиканских институтов. Во всём мире завидуют прочности нашей системы. \nОднако непрерывное расширение нашей территории начинает создавать серьёзные управленческие трудности: поток новых граждан из покорённых земель переполняет собрания, и политические институты начинают шататься. Очевидно, что необходимо рассмотреть важнейшие поправки, чтобы адаптироваться к новой ситуации. Но возможно, что эти изменения, затрагивающие многие привилегии, будут непросто приняты значительной частью нашей элиты."
 c3rd_events.48.a:0 "Стабилизируем ситуацию"
 c3rd_events.48.a.tt1:0 "Серьёзные вложения позволят отсрочить проблему на некоторое время"
 c3rd_events.48.b:0 "Несмотря на риски, реформа необходима"
 c3rd_events.48.b.tt1:0 "Успешная реформа позволит замедлить рост административных проблем ценой некоторого трения. \n#R Если она провалится, наступит политическая нестабильность #!\n Популярность твоего лидера повышает шансы на успех, а коррупция — снижает их. \n#G Любой модификатор республиканской сверхэкспансии будет снят #!"
 c3rd_events.48.c:0 "Неважно"
 c3rd_events.48.c.tt1:0 "Ничего предпринято не будет"

 c3rd_events.49.t:0 "Успех реформы"
 c3rd_events.49.desc:0 "После долгих обсуждений удалось достичь компромисса о значительной реформе институтов. Это соглашение вызовет определённое трение, но часть привилегий будет лучше урегулирована, что позволит демократии просуществовать ещё несколько лет."
 c3rd_events.49.a:0 "Хорошие новости"
 c3rd_events.49.a.tt1:0 "Республика адаптируется на ближайшие годы, и вероятность дальнейшей сверхэкспансии будет снижена на некоторое время"

 c3rd_events.50.t:0 "Провал реформы"
 c3rd_events.50.desc:0 "Когда дебаты, казалось, уже должны были увенчаться успехом, сильное консервативное движение набрало достаточно сторонников, чтобы в лоб сорвать любую попытку реформы. Немногие тексты, принятые для решения проблемы представительства, подверглись яростной критике, а отсутствие консенсуса вынудило исполнительную власть навязать их без демократической легитимности. Республика теперь крайне нестабильна."
 c3rd_events.50.a:0 "Для нашей республики открывается тревожный период"
 c3rd_events.50.a.tt1:0 "Сверхэкспансия устранена, но ценой хронической нестабильности республиканских институтов"


 c3rd_events.51.t:0 "Стабилизация институтов"
 c3rd_events.51.desc:0 "Меньшие размеры нашей империи позволили восстановить здоровую административную основу."
 c3rd_events.51.a:0 "Хорошие новости"
 c3rd_events.51.a.tt1:0 "Любая сверхэкспансия устранена"


 c3rd_events.52.t:0 "Стабилизация институтов"
 c3rd_events.52.desc:0 "Политическая нестабильность хотя бы имеет то преимущество, что упрощает процедуры... Гибкая реформа провинциального и республиканского управления, несомненно, решит наши институциональные проблемы."


 c3rd_events.100.t:0 "Отладка"
 c3rd_events.100.desc:0 "Это отладочное событие только для целей кодинга. бип-буп"
 c3rd_events.100.a:0 "КОМПЬЮТЕРНЫЕ ЗВУКИ"
 c3rd_events.100.a.tt1:0 "[char_tooltip.GetName] : [char_tooltip.MakeScope.GetVariable('country_ownership').GetValue]%"


 #1.2 События

 c3rd_other_events.1.t:0 "Король без клыков"
 c3rd_other_events.1.desc:0 "Недавние поражения подпитали опасное настроение среди населения: как может наш правитель, желающий быть властелином армий и главнокомандующим, управлять, обладая столь скудными военными знаниями? Голоса протеста множатся, а войска теряют уверенность..."
 c3rd_other_events.1.desc.1:0 "Эллинское население сомневается в способности своего царя претендовать на наследие Александра... Как вообразить вождя, достойного этого имени, если он не ведёт войска к победе?"
 c3rd_other_events.1.a:0 "Признаем наши недостатки и попросим совета"
 c3rd_other_events.1.a.tt1:0 " #G Этот выбор возможен, так как твой лидер имеет меньше @military_icon!, чем один из твоих военных советников #!\n Твой лидер будет учиться у советников, чтобы заслужить уважение народа"
 c3rd_other_events.1.b:0 "Император выше подобных жалоб"
 c3rd_other_events.1.b.tt1:0 "Эллины в твоей стране будут возмущены этим ответом"
 c3rd_other_events.1.c:0 "Великая речь успокоит недовольных"
 c3rd_other_events.1.c.tt1:0 " #G Этот выбор возможен благодаря популярности твоего лидера и @oratory_icon! #!\n"


 c3rd_other_events.2.t:0 "Восхождение нового царя"
 c3rd_other_events.2.desc:0 "Приход [currentruler.GetName] к власти успокоил прежние протесты против способностей его предшественника. Теперь он свободен писать новую страницу истории."
 c3rd_other_events.2.a:0 "Прекрасно"
 c3rd_other_events.2.a.tt1:0 "Все предыдущие модификаторы легитимности были сняты"


 c3rd_other_events.3.t:0 "Король без божественности"
 c3rd_other_events.3.desc:0 "Недавние поражения подпитали опасное настроение среди населения: как может наш правитель, который должен быть богом среди людей, оправдать своё божественное право управлять, обладая столь скудными священными знаниями? Голоса протеста множатся, а войска теряют уверенность..."
 c3rd_other_events.3.desc.1:0 "Египетское население начинает сомневаться в божественном происхождении нашего монарха... Как вообразить лидера, достойного этого имени, если он не ведёт войска к победе и не поражает врагов?"
 c3rd_other_events.3.a:0 "Признаем наши недостатки и попросим совета"
 c3rd_other_events.3.a.tt1:0 " #G Этот выбор возможен, так как твой лидер имеет меньше @religious_icon!, чем один из твоих религиозных советников #!\n Твой лидер будет учиться у советников, чтобы заслужить уважение народа"
 c3rd_other_events.3.b:0 "Император выше подобных жалоб"
 c3rd_other_events.3.b.tt1:0 "Египтяне в твоей стране будут возмущены этим ответом"
 c3rd_other_events.3.c:0 "Великая речь успокоит недовольных"
 c3rd_other_events.3.c.tt1:0 " #G Этот выбор возможен благодаря популярности твоего лидера и @oratory_icon! #!\n"

 c3rd_other_events.4.t:0 "Административный недостаток"
 c3rd_other_events.4.desc:0 "Наша империя, находящаяся в полном расширении, всегда подчиняла низшие народы, предоставляя им полный доступ к нашему языку, нашей культуре и навязывая нашу валюту.\nОднако, быть может, слишком гордые своим превосходством или ослеплённые богатством, правящие власти покорённых народов проявляют всё меньше желания заниматься варварскими массами, накапливающимися на новых землях — будь то их обучение или регулирование их деятельности.\nНарод [chosen_new_nobles.GetName], один из самых многочисленных, похоже, воспользовался нехваткой администраторов из нашей культуры, чтобы управлять землями под своим контролем... разумеется, от нашего имени! Узаконить возвышение этой этнической группы в нашей империи было бы надёжным способом восполнить пробелы, хотя это, несомненно, оскорбило бы самых консервативных среди нас..."
 c3rd_other_events.4.a:0 "Узаконить возвышение этой новой элиты"
 c3rd_other_events.4.a.tt1:0 "Культура [chosen_new_nobles.GetName] получит права знати и управления, что решит все административные проблемы."
 c3rd_other_events.4.b:0 "[chosen_new_nobles.GetName] были и останутся ниже нас"
 c3rd_other_events.4.b.tt1:0 "Социальных изменений не будет, культура [chosen_new_nobles.GetName] будет разочарована.\n #R Это вызовет серьёзные административные проблемы, а контроль над меньшинствами нашей страны станет слабее #!\n #G Будет доступно решение, чтобы устранить эти проблемы, когда число культурных попов с правами знати станет достаточным #!"
 c3rd_other_events.4.c:0 "Немного административных хитростей должно хватить..."
 c3rd_other_events.4.c.tt1:0 "#G Этот выбор доступен, потому что твой лидер обладает высоким Государственным искусством или имеет черты хитрости/ума #!\n Незначительные административные проблемы сохранятся ненадолго"

 c3rd_other_events.5.t:0 "Недостаток богатства"
 c3rd_other_events.5.desc:0 "Наша империя может казаться сияющей, переполненной богатством и купающейся в успехе. Но настоящая экономика не ограничивается стенами казны государства, а зависит от торговли, социального баланса и достатка населения. Этот баланс трудно достичь, и очень часто привилегированные слои богатеют за счёт покорённых, пока государство печатает деньги для своих проектов. \nНедавно же счета ушли в минус... будь то из-за отсутствия новых богатств или нежелания элиты платить налоги... Атмосфера такова, что ощущается нехватка денег, и если позволить этому продолжаться, может начаться всеобщая дефляция."
 c3rd_other_events.5.a:0 "Но... что насчёт наших игр?"
 c3rd_other_events.5.a.tt1:0 "Твой экономический баланс склоняется к дефляции. Нужно увеличить источники богатства, чтобы спасти августовскую систему, или изменить монетарный закон.\nИсточники богатства включают:\n#G Количество неинтегрированных попов \nПопов из порабощённых культур \nКоличество товаров «Драгоценные металлы» в твоей стране (как из производства, так и из импорта)#!"

 c3rd_other_events.6.t:0 "Истощение шахты"
 c3rd_other_events.6.desc:0 "После многих лет изобилия и богатства, которые приносила шахта [exhausted_mine.GetName], её жила, похоже, иссякла. Телеги, переполненные золотом и пополнявшие наши казны, теперь пусты, а рабы перенаправлены к другим местным источникам ресурсов."
 c3rd_other_events.6.desc.1:0 "Наши инженеры сообщают, что с небольшими инвестициями можно добыть дополнительные металлы, если копать глубже. Это, без сомнения, будет дорого и опасно, но позволит сохранить поток золота для покрытия наших расходов."
 c3rd_other_events.6.a:0 "Двигаемся дальше"
 c3rd_other_events.6.a.tt1:0 "[exhausted_mine.GetName] больше не будет производить драгоценные металлы"
 c3rd_other_events.6.b:0 "Во что бы то ни стало, держим шахту открытой!"
 c3rd_other_events.6.b.tt1:0 "Ваши инвестиции откроют новые жилы на некоторое время..."

 c3rd_other_events.7.t:0 "Экономическое равновесие"
 c3rd_other_events.7.desc:0 "На последней проверке финансов наши казначеи радостно объявили, что экономическое равновесие достигнуто. Наши усилия принесли плоды."
 c3rd_other_events.7.a:0 "Прекрасно, устроим ещё игры!"
 c3rd_other_events.7.a.tt1:0 "Любая дефляция была урегулирована"

 c3rd_other_events.8.t:0 "Жалоба влиятельных"
 c3rd_other_events.8.desc:0 "[character_taxed_1.GetName], [character_taxed_2.GetName] и [character_taxed_3.GetName], три могущественных человека, недавно выразили недовольство нашей налоговой политикой. На аудиенции с нашим правителем они пожаловались на бремя постоянных проверок и упрёков со стороны налоговых органов и потребовали немедленной отмены этих «несправедливых» мер, которые, по их словам, лишь карают честных граждан, пока варвары низших слоёв процветают в преступности.\nОни заверили, что в случае отказа используют своё влияние, чтобы обнародовать плохое управление казной."
 c3rd_other_events.8.a:0 "Эти верные слуги нашей страны правы!"
 c3rd_other_events.8.a.tt1:0 "Политика налоговых проверок будет отменена\n#R Её нельзя будет восстановить в течение 10 лет #!"
 c3rd_other_events.8.b:0 "А как насчёт справедливой компенсации?"
 c3rd_other_events.8.b.tt1:0 "Это удовлетворит просителей"
 c3rd_other_events.8.c:0 "Никто не уклонится от налогов!"
 c3rd_other_events.8.c.tt1:0 "Вы отказываетесь выполнить требования просителей"

 c3rd_other_events.9.t:0 "Требования влиятельных"
 c3rd_other_events.9.desc:0 "[character_taxed_1.GetName], [character_taxed_2.GetName] и [character_taxed_3.GetName] — три влиятельные фигуры государства и, следовательно, ясно выражают притязания наших элит. На слушании они высказали обеспокоенность законами о налогах. Как может быть справедливо, по их мнению, что важнейшие люди и землевладельцы облагаются теми же налогами, что и остальное население? Разве они не вносят куда больший вклад в богатство государства, чем простолюдины?\nОни выразили готовность вознаградить милосердие государства по отношению к ним своей мощной поддержкой правительства."
 c3rd_other_events.9.a:0 "Это естественно!"
 c3rd_other_events.9.a.tt1:0 "Граждане и знать будут освобождены от переписи\n#R Нельзя будет отменить в течение 10 лет #!"
 c3rd_other_events.9.a.tt2:0 "#R Эта привилегия негативно скажется на денежном равновесии #!"
 c3rd_other_events.9.b:0 "Что ж, государство может быть щедрее, чем простые налоги"
 c3rd_other_events.9.b.tt1:0 "Вы купите поддержку этих людей"
 c3rd_other_events.9.c:0 "Государство неподкупно"
 c3rd_other_events.9.c.tt1:0 "Вы отказываетесь выполнить требования просителей"

 c3rd_other_events.10.t:0 "Великая Книга Денег"
 c3rd_other_events.10.desc:0 "#R Salvete Imperator\n Это решение устарело, и я удалю его, но многие до сих пор используют его вместо денежной вкладки\n\n Если вы не можете открыть денежную вкладку через экономику, пожалуйста, свяжитесь со мной #!"
 c3rd_other_events.10.desc.1:0 "\n Экономика государства финансируется на #G [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('what_is_my_eco').GetValue]% #!"
 c3rd_other_events.10.desc.2:0 "\n Экономика государства финансируется на #R [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('what_is_my_eco').GetValue]% #!"
 c3rd_other_events.10.desc.3:0 "\n\n #G Так как вы установили золотой стандарт, это значение больше не имеет значения, но вы всё же можете наблюдать за изменениями со временем... #!"
 c3rd_other_events.10.desc.4:0 "\n Следующие модификаторы могут повлиять на это число:\n"
 c3rd_other_events.10.desc.5:0 "\n #R Освобождение граждан от налоговой переписи #!"
 c3rd_other_events.10.desc.6:0 "\n #R Военные льготы #!"
 c3rd_other_events.10.desc.7:0 "\n #R Политическая нестабильность #!"
 c3rd_other_events.10.desc.8:0 "\n #G Политика налоговых проверок #!"
 c3rd_other_events.10.desc.9:0 "\n #G Реформа Аврелиана #!"
 c3rd_other_events.10.desc.10:0 "\n #G Некоторые культуры порабощены #!"
 c3rd_other_events.10.desc.11:0 "\n #G Вассалы эксплуатируются #!"
 c3rd_other_events.10.desc.12:0 "\n #G Аристократические реформы #!"
 c3rd_other_events.10.desc.13:0 "\n #G Денежная консолидация #!"
 c3rd_other_events.10.desc.14:0 "\n #R Полное освобождение элит от налогов #!"
 c3rd_other_events.10.desc.20:0 "\n\nВы создаёте деньги, уменьшая содержание серебра в монете, #G это полностью устраняет любую дефляцию #!, но в будущем может привести к денежному краху"
 c3rd_other_events.10.a:0 "Интересно"
 c3rd_other_events.10.a.tt1:0 "Это число отражает внутреннее богатство страны — насколько богаты люди, как циркулируют деньги между рабочими и владельцами. Оно мало связано с суммой денег в казне или доходом... но последствия плохого управления могут косвенно на него влиять.\n\nКаждый житель неинтегрированной культуры вносит #G положительный вклад#! в это значение, символизируя эксплуатацию завоёванных народов на благо страны.\n#G Каждая культура с правами «рабов» будет вносить двойной вклад #!\nКаждый драгоценный минерал также будет давать #G положительный вклад#!.\nКаждый интегрированный житель, символизирующий привилегии элиты, будет вносить #R отрицательный вклад#!.\n\nСоотношение положительных и отрицательных значений будет зависеть от законов, культурных решений вроде #G политики налоговых проверок#!, а также со временем. Удерживать баланс будет всё труднее, что символизирует прогрессирующую коррупцию общества, гордящегося своим успехом."

 c3rd_other_events.1005.t:0 "Эра денежной экономики"
 c3rd_other_events.1005.desc:0 "Времена меняются, и если раньше мы тонули в ресурсах завоеваний, то грядущая эпоха будет богата скорее... трудностями.\n\n #Y Теперь информация о денежной механике разблокирована и доступна через дополнительную кнопку в экономическом интерфейсе. #!"
 c3rd_other_events.1005.a:0 "Интересно"
 c3rd_other_events.1005.a.tt1:0 "Столько информации в моём распоряжении"

 c3rd_other_events.11.t:0 "Безупречная передача власти"
 c3rd_other_events.11.desc:0 "К власти приходит новый правитель. Но хотя лица меняются и ключевые должности перераспределяются, одна из фракций остаётся сильной и не должна быть проигнорирована... Король без поддержки своей армии рискует куда большим, чем редкими случаями неповиновения! Стоит удостовериться, что эта передача власти будет безупречной — с помощью щедрых пожертвований."
 c3rd_other_events.11.a:0 "Разумеется, мы ценим наших верных генералов!"
 c3rd_other_events.11.a.tt1:0 "Огромные суммы золота и пышные пиры покорят этих влиятельных людей"
 c3rd_other_events.11.b:0 "Мы легко обеспечим их всем необходимым"
 c3rd_other_events.11.b.tt1:0 "#G Это решение доступно, так как у вас есть закон «Серебряная реформа» #!\nНетрудно наградить кого угодно, если можно чеканить столько монет, сколько пожелаешь!"
 c3rd_other_events.11.c:0 "Мы этого не сделаем"
 c3rd_other_events.11.c.tt1:0 "Это разочарует генералов"
 c3rd_other_events.11.d:0 "А как насчёт привилегий?"
 c3rd_other_events.11.d.tt1:0 "Вы даруете генералам обширные права"

 c3rd_other_events.12.t:0 "Великие народные игры"
 c3rd_other_events.12.desc.1:0 "Столицу охватила буря радости после объявления первых Великих народных игр. Граждане всех сословий стекались в огромный колизей,争ив за лучшие места. Вокруг правительской ложи толпились советники, тщетно скрывая волнение: какие празднества были подготовлены?"
 c3rd_other_events.12.desc.2:0 "Настал час. Народ слишком долго ждал; народ требует своих Великих игр! Торговцы уже готовятся, столица кипит... Советники обступают правителя: что будет?"
 c3rd_other_events.12.a:0 "Игры величайшие из всех!"
 c3rd_other_events.12.a.tt1:0 "Крупные вложения сделают этот выпуск незабываемым!"
 c3rd_other_events.12.b:0 "Мы можем позволить любые траты!"
 c3rd_other_events.12.b.tt1:0 "Залейте столицу новыми деньгами, чтобы обеспечить великие игры"
 c3rd_other_events.12.c:0 "Будут хорошие игры"
 c3rd_other_events.12.c.tt1:0 "Необходимые инвестиции будут сделаны"
 c3rd_other_events.12.d:0 "На этот раз игр не будет"
 c3rd_other_events.12.d.tt1:0 "Разочарование будет велико"

 c3rd_other_events.13.t:0 "Важная реформа"
 c3rd_other_events.13.desc:0 "Требуется глубокая реформа денежной системы, чтобы она пережила трудности грядущих веков. Серебро, некогда самая используемая валюта, должно быть заменено в обращении более стабильным золотом. Настало время начать масштабное государственное обсуждение, чтобы определить лучший путь вперёд."
 c3rd_other_events.13.a:0 "Начнём"
 c3rd_other_events.13.a.tt1:0 "Реформа будет начата.#R Обратного пути не будет #!"
 c3rd_other_events.13.b:0 "Подождём, сейчас не время"
 c3rd_other_events.13.b.tt1:0 "Вы отмените реформу. #G Всегда сможете начать её позже #!"

 c3rd_other_events.14.t:0 "Контроль над денежной системой"
 c3rd_other_events.14.desc:0 "Наш план ясен: чтобы восстановить стабильность золота, сначала нужно взять под контроль денежную систему целиком. Есть проверенный метод — значительно усилить работу финансовых инспекторов во всех регионах империи. Но возможны и другие методы."
 c3rd_other_events.14.a:0 "Укрепить сборщиков"
 c3rd_other_events.14.a.tt1:0 "Сборщики налогов получат специальные средства для усиления своего влияния и сокращения финансовых лазеек"
 c3rd_other_events.14.b:0 "[office_treasure_man.GetName] прекрасно справится"
 c3rd_other_events.14.b.tt1:0 "#G Этот выбор доступен, так как у [office_treasure_man.GetName] высокая государственная мудрость #! \nПерсонаж обеспечит надёжный контроль над денежной системой"
 c3rd_other_events.14.c:0 "Наш правитель вполне способен"
 c3rd_other_events.14.c.tt1:0 "#G Этот выбор доступен, так как у нашего правителя высокая государственная мудрость #! \nПравитель обеспечит надёжный контроль над денежной системой"

 c3rd_other_events.15.t:0 "Стабильность золота"
 c3rd_other_events.15.desc:0 "Пришло время закрепить относительную ценность золота. Стандартная валюта не должна колебаться, как старая, в зависимости от богатства, и содержание драгоценного металла в ней должно быть чистым. Это потребует особенно тонкого подхода."
 c3rd_other_events.15.a:0 "Сделаем это"
 c3rd_other_events.15.a.tt1:0 "Реформа будет проведена, но с некоторыми временными побочными эффектами"
 c3rd_other_events.15.b:0 "[office_treasure_man.GetName] прекрасно справится"
 c3rd_other_events.15.b.tt1:0 "#G Этот выбор доступен, так как у [office_treasure_man.GetName] есть черты Умный, Основатель, Полимат или Учёный #! \nПерсонаж обеспечит плавный переход системы"
 c3rd_other_events.15.c:0 "Наш правитель вполне способен"
 c3rd_other_events.15.c.tt1:0 "#G Этот выбор доступен, так как у нашего правителя есть черты Умный, Основатель, Полимат или Учёный #! \nПравитель обеспечит плавный переход системы"

 c3rd_other_events.16.t:0 "Солид"
 c3rd_other_events.16.desc:0 "'Единственная стабильная валюта в денежной системе, где вес серебряных и бронзовых монет часто колебался, в основном снижаясь, и распространялся по всей Римской империи, солид был единственным средством выражения долгов и цен, защищая их от обесценивания. Золотой пенни стал опорой экономики и торговли на века. Золото стало основой налоговой системы и императорских расходов. Налоги выражались в солидах, а иногда и в их дробях. Штрафы, известные из Кодекса Феодосия, с примерно 360 года выражались только в золоте. Военные расходы, регулярные жалования и чрезвычайные выплаты (донатива) производились в солидах (отсюда и слово «солдат»). Через налогообложение солида возвращались в государственную казну, где их переплавляли в слитки, считали по весу и чеканили заново. Выпущенные солида использовались для выплат войскам, и, исходя из оценки численности армии во второй половине IV века, ежегодная эмиссия солидов оценивается от 1 до 2 миллионов штук, а во время крупных военных мобилизаций, вероятно, и больше. Слово «солид» дало начало таким словам как 'sol', 'sou', 'solde', 'soldat' и 'soldo''"
 c3rd_other_events.16.a:0 "Это хорошо"
 c3rd_other_events.16.a.tt1:0 "Введён золотой стандарт"

 c3rd_other_events.17.t:0 "Кризис стабилизирован"
 c3rd_other_events.17.desc:0 "Важно сдержать дефляцию, чтобы наша экономическая модель не рухнула. \nМы можем сосредоточить усилия на нескольких направлениях: стоит ли развивать торговлю, стимулировать возвращение к труду или компенсировать богатейших?"
 c3rd_other_events.17.a:0 "Торговля — кровь экономики"
 c3rd_other_events.17.a.tt1:0 "Небольшой рост торговли"
 c3rd_other_events.17.b:0 "Все за работу!"
 c3rd_other_events.17.b.tt1:0 "Небольшой рост производства"
 c3rd_other_events.17.c:0 "Компенсация за потери"
 c3rd_other_events.17.c.tt1:0 "Небольшой рост удовлетворённости элит"

 c3rd_other_events.18.t:0 "Серебро стабилизировано"
 c3rd_other_events.18.desc:0 "Возвращение к нормальным денежным ценностям должно стать глотком свежего воздуха для нашей страны, позволяя ей снова двигаться вперёд. \nНесколько небольших локальных мер дадут хорошо продуманный стимул..."
 c3rd_other_events.18.a:0 "Сообщим всем, что всё под контролем"
 c3rd_other_events.18.a.tt1:0 "Это успокоит людей"
 c3rd_other_events.18.b:0 "Наш правитель будет образцом"
 c3rd_other_events.18.b.tt1:0 "Вера в правителя всегда полезна!"
 c3rd_other_events.18.c:0 "Эта помощь должна достаться наиболее пострадавшим"
 c3rd_other_events.18.c.tt1:0 "Менее универсально, но всё равно оценят"

 c3rd_other_events.20.t:0 "Экономические потрясения"
 c3rd_other_events.20.desc:0 "В экономике ощущается лёгкое неблагополучие. Снижение источников богатства по сравнению с его распределением среди населения привело к постепенному росту ценности денег, которые теперь больше у простого народа, чем у элит. Этот неожиданный рост покупательной способности низших слоёв может иметь неприятные последствия в долгосрочной перспективе и должен быть сдержан... хотя пока эффект воспринимается скорее положительно."
 c3rd_other_events.20.a:0 "Интересно"
 c3rd_other_events.20.a.tt1:0 "Чувствуются последствия лёгкой дефляции"

 c3rd_other_events.21.t:0 "Экономический кризис"
 c3rd_other_events.21.desc:0 "Постепенное укрепление серебряной валюты оказывает крайне разрушительное влияние на страну. Население, уверенное в том, что ценность денег со временем возрастает, не желает их тратить. Инвестиции рухнули, государственные проекты постоянно тормозятся, а богатые землевладельцы не могут найти рабочую силу."
 c3rd_other_events.21.a:0 "Тревожно"
 c3rd_other_events.21.a.tt1:0 "Дефляция усиливается.... #G Требования закона «Серебряная реформа» были обойдены #!"

 c3rd_other_events.22.t:0 "Экономический крах"
 c3rd_other_events.22.desc:0 "Дефляционный кризис серьёзен. Экономика замирает, растёт недовольство. Теперь крайне важно действовать, если мы хотим избежать нарастающих последствий нашей финансовой беспомощности."
 c3rd_other_events.22.a:0 "Это ужасно"
 c3rd_other_events.22.a.tt1:0 "Эффекты дефляции достигли максимума. Без дополнительных действий её будет всё труднее обратить. #G Требования закона «Серебряная реформа» были обойдены, крайне рекомендуется использовать этот закон для борьбы с дефляцией #!"

 c3rd_other_events.23.t:0 "Стабилизация кризиса"
 c3rd_other_events.23.desc:0 "Наши усилия по стабилизации ослабленной экономики дали обнадёживающие первые результаты. Ситуация теперь менее катастрофическая, но всё ещё тревожная."
 c3rd_other_events.23.a:0 "Всё же это хорошие новости"
 c3rd_other_events.23.a.tt1:0 "Дефляция уменьшилась"

 c3rd_other_events.24.t:0 "Экономическая стабилизация"
 c3rd_other_events.24.desc:0 "Дефляционный кризис, похоже, в значительной мере сдержан, снова видны обнадёживающие признаки здоровой экономики."
 c3rd_other_events.24.a:0 "Это хорошо"
 c3rd_other_events.24.a.tt1:0 "Дефляция уменьшилась"

 c3rd_other_events.25.t:0 "Конец дефляции"
 c3rd_other_events.25.desc:0 "Серебряная валюта вернулась к более разумной низкой цене. Мы можем поблагодарить свои верные действия."
 c3rd_other_events.25.a:0 "Превосходно"
 c3rd_other_events.25.a.tt1:0 "Эффекты дефляции устранены"

 c3rd_other_events.26.t:0 "Подорванная денежная стоимость"
 c3rd_other_events.26.desc:0 "Наша политика обилия серебра дала нам большой источник богатства для финансирования проектов, умиротворения населения и поддержки нужд постоянно растущей империи. \nОднако похоже, что у этой политики эмиссии денег есть пределы. Постепенное снижение доли драгоценных металлов в народной валюте породило недоверие к её реальной ценности. Взамен появилась количественная инфляция, вызывающая законное беспокойство, но значительно оживляющая торговлю."
 c3rd_other_events.26.a:0 "Тревожно"
 c3rd_other_events.26.a.tt1:0 "Начинают ощущаться эффекты валютного кризиса. Это в основном последствия закона «Серебряная реформа». Отмена этого закона остановит прогрессирующий кризис, но не защитит от новой дефляции....\n #G Денежный закон «Реформа Аврелиана» обратит последствия #!"

 c3rd_other_events.27.t:0 "Сильно обесцененная валюта"
 c3rd_other_events.27.desc:0 "Поддержание нашей денежной политики имеет серьёзные последствия; количество серебра, циркулирующего в экономике, стало совершенно несоразмерным, что разрушает покупательную способность рабочих классов и многократно увеличивает бедность, вызывая при этом всеобщую инфляцию."
 c3rd_other_events.27.a:0 "Это плохо"
 c3rd_other_events.27.a.tt1:0 "Эффекты валютного кризиса усиливаются. Это в основном последствия закона «Серебряная реформа». Отмена этого закона остановит прогрессирующий кризис, но не защитит от новой дефляции....\n #G Денежный закон «Реформа Аврелиана» обратит последствия #!"

 c3rd_other_events.28.t:0 "Крах августинианской системы"
 c3rd_other_events.28.desc:0 "Денежная система больше не имеет прочной основы, валюта чеканится из дешёвых и бесполезных металлов. Бартер заменяет деньги в экономике, растут насилие и нестабильность. Недовольство усиливается."
 c3rd_other_events.28.a:0 "Это катастрофа"
 c3rd_other_events.28.a.tt1:0 "Эффекты валютного кризиса достигли максимума. Это в основном последствия закона «Серебряная реформа». Отмена этого закона остановит прогрессирующий кризис, но не защитит от новой дефляции....\n #G Денежный закон «Реформа Аврелиана» обратит последствия #!"

 c3rd_other_events.291.t:0 "Стабилизация кризиса"
 c3rd_other_events.291.desc:0 "Наши усилия по стабилизации рушащейся денежной системы дали обнадёживающие первые результаты. Ситуация теперь менее катастрофическая, но всё ещё тревожная."
 c3rd_other_events.291.a:0 "Всё же это хорошие новости"
 c3rd_other_events.291.a.tt1:0 "Денежный крах удалось предотвратить"

 c3rd_other_events.292.t:0 "Экономическая стабилизация"
 c3rd_other_events.292.desc:0 "Денежный кризис, похоже, в значительной мере сдержан, снова видны обнадёживающие признаки здоровой экономики."
 c3rd_other_events.292.a:0 "Это хорошо"
 c3rd_other_events.292.a.tt1:0 "Стоимость серебра стабилизирована"

 c3rd_other_events.293.t:0 "Конец денежного кризиса"
 c3rd_other_events.293.desc:0 "Серебряная валюта вернулась к более разумной стоимости. Мы можем поблагодарить свои верные денежные меры."
 c3rd_other_events.293.a:0 "Превосходно"
 c3rd_other_events.293.a.tt1:0 "Эффекты денежного кризиса устранены"

 c3rd_other_events.2942.t:0 "Супер секретная проверка"
 c3rd_other_events.2942.desc:0 "Дефляция = [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('deflation_value').GetValue]\nСеребро = [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('silver_unvalue').GetValue]"

 c3rd_other_events.30.t:0 "Восстание [culture_slave_revolt.GetName]"
 c3rd_other_events.30.desc:0 "В наших провинциях назревает восстание. Гордый народ [culture_slave_revolt.GetName], влиятельная элита определённой части нашей империи, не может терпеть рабское положение, в которое мы их загнали. Местная аристократия, похоже, даже поддерживает серьёзные действия против нашей власти. Это легко может перерасти в вооружённое восстание без нашего вмешательства. \nНаши советники предлагают вернуть им статус свободных, чтобы успокоить ситуацию, но другие настаивают на жёсткой линии без уступок."
 c3rd_other_events.30.a:0 "Мы ничего не уступим"
 c3rd_other_events.30.a.tt1:0 "[culture_slave_revolt.GetName] с большей вероятностью восстанут позже"
 c3rd_other_events.30.b:0 "Смелые переговоры помогут нам"
 c3rd_other_events.30.b.tt1:0 "Этот выбор возможен, потому что у вашего правителя #G высокая харизма #! или есть черты #G выдающийся #! ,#G красноречивый #! или #G оратор #! \nВы дадите символические права, чтобы успокоить ситуацию, до [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('max_number_massacre').GetValue] городов получат локальное ассимиляционное и отрицательное модификатор рабского производства"
 c3rd_other_events.30.c:0 "Уничтожить мятежников"
 c3rd_other_events.30.c.tt1:0 "Этот выбор возможен, потому что у вашего правителя #G высокая военная доблесть #! или есть черты #G жестокий #!,#G энергичный #! или #G суровый #! \nВы убьёте множество мятежных жителей в до [SCOPE.GetRootScope.GetCountry.MakeScope.GetVariable('max_number_massacre').GetValue|0] городах, чтобы успокоить ситуацию"
 c3rd_other_events.30.d:0 "Даровать им эти права"
 c3rd_other_events.30.d.tt1:0 "Вы уступите требованиям и дадите [culture_slave_revolt.GetName] права свободных"

 c3rd_other_events.31.t:0 "Восстание [revolting_slave_culture.GetName]"
 c3rd_other_events.31.desc:0 "После лет растущего напряжения в крупных городах, которые они контролируют, лидеры восстания [revolting_slave_culture.GetName] собрали достаточно поддержки, чтобы централизовать свои требования и выдвинуть нам ультиматум. Устав от принятых против них мер, они требуют полной свободы и независимости провинций, которые называют своей родиной, под новым независимым государством. \nОднако они готовы к переговором и признают нашу власть, если мы примем их условия. \nЭто был бы умный способ избежать войны и урегулировать ситуацию, но воинственная часть нашего правительства наверняка не согласится и будет настаивать на массовой резне этих мятежников."
 c3rd_other_events.31.a:0 "Примем это предложение"
 c3rd_other_events.31.a.tt1:0 "Преимущественно [revolting_slave_culture.GetName] провинции выйдут из состава в новый клиентское государство. Все модификаторы восстания будут сняты с культуры [revolting_slave_culture.GetName]"
 c3rd_other_events.31.b:0 "Тогда к оружию"
 c3rd_other_events.31.b.tt1:0 "Преимущественно [revolting_slave_culture.GetName] провинции выйдут из состава в новое государство. Вы объявите ему войну. Соседние мятежные провинции смогут присоединиться к сепаратистам, а также провинции с низкой лояльностью"

 c3rd_other_events.32.t:0 "Сецессия [revolting_noble_culture.GetName]"
 c3rd_other_events.32.desc:0 "После многих лет растущего напряжения в крупных городах, которые они контролируют, лидеры восстания [revolting_noble_culture.GetName] собрали достаточно сторонников, чтобы централизовать свои требования и выдвинуть нам ультиматум. Устав от мер, которым их подвергали, они требуют полной свободы и независимости провинций, которые считают своей родиной, под новым независимым государством. \nОднако они готовы к переговорам и примут нашу сюзеренитет, если мы согласимся на их условия. \nЭто могло бы быть разумным способом избежать войны и урегулировать ситуацию, но воинствующие круги в нашем правительстве наверняка не захотят слушать и будут толкать нас к кровавой расправе над мятежниками."
 c3rd_other_events.32.a:0 "Примем это предложение"
 c3rd_other_events.32.a.tt1:0 "Преимущественно [revolting_noble_culture.GetName] провинции выйдут в новое клиентское государство. Все модификаторы восстания будут сняты с культуры [revolting_noble_culture.GetName]"
 c3rd_other_events.32.b:0 "Тогда к оружию"
 c3rd_other_events.32.b.tt1:0 "Преимущественно [revolting_noble_culture.GetName] провинции выйдут в новое государство. Вы объявите ему войну. #R Соседние мятежные провинции смогут присоединиться к сепаратистам, а также провинции с низкой лояльностью#!"

 c3rd_other_events.33.t:0 "Новое начало?"
 c3rd_other_events.33.desc:0 "Со временем различия между нашим населением и нашими далекими истоками ощущаются всё сильнее. Многие из нашего народа чувствуют себя ближе к местным обычаям [new_cultural_identity.GetName]. Чтобы утвердить нашу новую культурную идентичность, мы можем официально поддержать эти тенденции и вступить в новую эпоху."
 c3rd_other_events.33.a:0 "В будущее!"
 c3rd_other_events.33.a.tt1:0 "Мы примем новую культуру. Наша старая культура останется интегрированной"
 c3rd_other_events.33.b:0 "Нет, плохая идея"
 c3rd_other_events.33.b.tt1:0 "Ничего не произойдет, но мы не сможем принять это решение какое-то время."

 c3rd_other_events.40.t:0 "Горы золота"
 c3rd_other_events.40.desc:0 "Наша страна полна богатств. И величайшие из этих богатств находятся в лучшем месте — в государственных резервах. Наша умелая организация доходов очевидна и вызывает вопросы: что делают наши лидеры с таким количеством золота?\n\n«Это абсолютно бесконечно! Я даже не могу отличить одну кучу золота от другой». Такие слова можно услышать на пирах из уст правителей. Быть во главе одной из богатейших держав мира действительно может вскружить голову. \nК счастью, национальное богатство в руках самых честных!"
 c3rd_other_events.40.a:0 "Разумеется, ничего не попадает в наши карманы"
 c3rd_other_events.40.a.tt1:0 "Богатства нации обогащают её правителей"
 c3rd_other_events.40.b:0 "Большие выгоды — большие услуги!"
 c3rd_other_events.40.b.tt1:0 "Деньги потекут в карманы всех чиновников"
 c3rd_other_events.40.c:0 "Хлеба и зрелищ!"
 c3rd_other_events.40.c.tt1:0 "Все получат выгоду. #G Это снизит любую возможную дефляцию#!"

 c3rd_other_events.50.t:0 "Великое творение среди голода"
 c3rd_other_events.50.desc:0 "Уже несколько недель голод наносит всё более тяжелый удар по городу [wonder_province_starve.GetName]. Измученное население ищет виновных и, похоже, направило свой гнев на символ утраченной роскоши. \nРазъярённая толпа направилась к местному чуду, намереваясь разграбить его ради пропитания... или просто чтобы излить свою ярость. \nМестная стража пока сдерживает их, но мы должны действовать, чтобы предотвратить худшее."
 c3rd_other_events.50.a:0 "Лично займёмся снабжением этой провинции"
 c3rd_other_events.50.a.tt1:0 "Вы организуете экстренное снабжение этой провинции, чтобы решить проблему и спасти Великое творение. Это предотвратит новые восстания на время"
 c3rd_other_events.50.b:0 "Послать армию"
 c3rd_other_events.50.b.tt1:0 "Вы отправите сильный отряд для защиты Великого творения. Народ сильно пострадает."
 c3rd_other_events.50.c:0 "Проигнорировать"
 c3rd_other_events.50.c.tt1:0 "Великое творение будет считаться разграбленным.\n#G Этот модификатор исчезнет, если Великое творение будет восстановлено или вручную уничтожено.#!"

 c3rd_other_events.51.t:0 "Великие творения"
 c3rd_other_events.51.desc:0 "Пришло время начать работы по восстановлению наших поврежденных великих творений. На что нам сосредоточить внимание?"
 c3rd_other_events.51.a:0 "[wonder_province_destroyed_1.GetName]"
 c3rd_other_events.51.a.tt1:0 "Великое творение будет считаться восстановленным"
 c3rd_other_events.51.b:0 "[wonder_province_destroyed_2.GetName]"
 c3rd_other_events.51.b.tt1:0 "Великое творение будет считаться восстановленным"
 c3rd_other_events.51.c:0 "[wonder_province_destroyed_3.GetName]"
 c3rd_other_events.51.c.tt1:0 "Великое творение будет считаться восстановленным"
 c3rd_other_events.51.d:0 "[wonder_province_destroyed_4.GetName]"
 c3rd_other_events.51.d.tt1:0 "Великое творение будет считаться восстановленным"
 c3rd_other_events.51.e:0 "Забудем об этом"
 c3rd_other_events.51.e.tt1:0 "Ничего не будет восстановлено"

 c3rd_other_events.52.t:0 "Рушащееся наследие"
 c3rd_other_events.52.desc:0 "Истинное величие измеряется следом, оставленным в истории. Но что можно сказать о нашей империи, если великие творения нашей цивилизации находятся в плачевном состоянии, разрушенные временем и кризисами... Разве это не неумолимый знак упадка, который тянет нас всех вниз?"
 c3rd_other_events.52.a:0 "Это всего лишь временные ошибки."
 c3rd_other_events.52.a.tt1:0 "Ваш правитель возьмёт ответственность.\nЭто происходит из-за того, что у вас значительное количество великих творений разграблено или разрушено. Уничтожение или восстановление (по решению) этих монументов снимет этот статус."
 c3rd_other_events.52.b:0 "Такое случается"
 c3rd_other_events.52.b.tt1:0 "Это происходит из-за того, что у вас значительное количество великих творений разграблено или разрушено. Уничтожение или восстановление (по решению) этих монументов снимет этот статус."
 c3rd_other_events.52.c:0 "Немедленно начать восстановление!"
 c3rd_other_events.52.c.tt1:0 "Это происходит из-за того, что у вас значительное количество великих творений разграблено или разрушено. Уничтожение или восстановление (по решению) этих монументов снимет этот статус.\n#G Вы начнёте рассматривать возможность ремонта.#!"

 c3rd_other_events.60.t:0 "Разрушающиеся границы"
 c3rd_other_events.60.desc:0 "Под угрозой ли наша цивилизация? Пока многие наши подданные видят, как их некогда безопасные дома грабят и разоряют кровожадные варвары, доверие к власти падает, а на окраинах империи назревают волнения. Мы должны вернуть контроль над границами, если хотим сохранить наши завоевания."
 c3rd_other_events.60.desc.tt1:0 "#R Ваш правитель напрямую владеет частью разграбленных провинций, что подрывает его легитимность и доверие к власти #!"
 c3rd_other_events.60.a:0 "Это лишь временные ошибки."
 c3rd_other_events.60.a.tt1:0 "Ваш правитель возьмет на себя ответственность.\nЭто происходит из-за того, что значительное количество ваших провинций подверглось вторжению варваров."
 c3rd_other_events.60.b:0 "Такое случается"
 c3rd_other_events.60.b.tt1:0 "Это происходит из-за того, что значительное количество ваших провинций подверглось вторжению варваров."

 c3rd_other_events.70.t:0 "Аристократическое вмешательство"
 c3rd_other_events.70.desc:0 "Катастрофическое состояние экономики парализует рост и занятость, и богатые решили предпринять жесткие меры, чтобы вернуть, как они выражаются, «ленивых» к работе. Ограничив доступ к инфраструктуре, находящейся под их контролем, для тех, кто не является активным работником, и даже организуя патрули для поимки свободных бездельников с целью обращения их в рабство, они стремятся силой добиться восстановления экономики. \nЭти меры быстро распространяются по стране, и необходимо принять решение для восстановления контроля. Следует ли поддержать эти инициативы по всей стране ради стабилизации экономики или же полностью их запретить? \nМожет быть, будет мудрее наказать этих богачей, конфисковав их имущество и пустив его в экономику."
 c3rd_other_events.70.a:0 "Поддержим эти инициативы, все должны работать!"
 c3rd_other_events.70.a.tt1:0 "#G Этот модификатор положительно повлияет на экономический баланс #!"
 c3rd_other_events.70.b:0 "Если они так боятся за свое богатство, может, его у них слишком много?"
 c3rd_other_events.70.b.tt1:0 "Вы конфискуете часть состояния этих влиятельных людей. #G Это снизит дефляцию на некоторое количество #!"
 c3rd_other_events.70.c:0 "Положим этому конец"
 c3rd_other_events.70.c.tt1:0 "Вы прекратите эти инициативы и оставите ситуацию как есть"

 c3rd_other_events.71.t:0 "Гнев свободных людей"
 c3rd_other_events.71.desc:0 "Столкнувшись с обесцениванием валюты и крахом благосостояния населения, толпы разгневанных плебеев собрались в местах своего массового проживания. Они требуют значительного повышения оплаты труда, чтобы вернуть себе достойный уровень жизни. Мы могли бы вмешаться и заставить аристократов и землевладельцев сделать уступки... Но не будет ли это выглядеть как наша слабость?"
 c3rd_other_events.71.a:0 "Экономику это не спасет, но людей успокоит"
 c3rd_other_events.71.a.tt1:0 "Вы окажете давление для повышения доходов плебеев"
 c3rd_other_events.71.b:0 "Конфисковать их имущество"
 c3rd_other_events.71.b.tt1:0 "Конфисковав часть находящегося в обращении богатства, мы сможем удержать падение денежной стоимости.\n #G Это немного замедлит крах валюты #!"
 c3rd_other_events.71.c:0 "Проигнорировать их"
 c3rd_other_events.71.c.tt1:0 "Ничего не произойдет"

 c3rd_other_events.72.t:0 "Реакция на крах валюты"
 c3rd_other_events.72.desc:0 "Когда кажется, что все становится только хуже, люди ищут собственные способы сохранить ценность своего труда. Квесторы сообщают о резком росте бартерных сделок среди населения, а также об обменах с нашими соседями и союзниками для извлечения выгоды из разницы валют.\nНекоторые наши финансисты советуют позволить этому развитию, чтобы стабилизировать обесценивание. Другие утверждают, что это опасный прецедент, который может ускорить распад нашего государства."
 c3rd_other_events.72.a:0 "Пусть бартер продолжается"
 c3rd_other_events.72.a.tt1:0 "Вы поддержите бартерные инициативы\n #G Это поможет восстановить ценность валюты со временем #!"
 c3rd_other_events.72.b:0 "Регулировать приграничные потоки!"
 c3rd_other_events.72.b.tt1:0 "Вы ограничите доступ ваших клиентов к вашему рынку, чтобы поток дешевого серебра оставался по ту сторону.\n #R Ваши клиенты станут данниками #!\n #G Чем крупнее субъект, тем сильнее восстановится стоимость серебра #!\n"
 c3rd_other_events.72.b.tt2:0 "#G Стоимость серебра немного восстановится #!\n"
 c3rd_other_events.72.b.tt3:0 "#G Стоимость серебра значительно восстановится #!\n"
 c3rd_other_events.72.b.tt4:0 "#G Стоимость серебра сильно восстановится #!\n"
 c3rd_other_events.72.c:0 "Мы этого делать не будем"
 c3rd_other_events.72.c.tt1:0 "Ничего сделано не будет"

 c3rd_other_events.73.t:0 "Население уклоняется от налогов"
 c3rd_other_events.73.desc:0 "Кризис валюты тяжело сказывается на населении. С их падающей покупательной способностью и множеством разных валют, кажется, только золото сохраняет универсальную ценность. Однако именно золотом необходимо платить ежегодные налоги, а добыть его крайне сложно... если только не перестать платить налоги вовсе. \nВ стране начало развиваться массовое движение по уклонению от налогов. Мы должны быстро это остановить, пока оно не вышло из-под контроля!"
 c3rd_other_events.73.a:0 "Удвоить проверки, утроить их!"
 c3rd_other_events.73.a.tt1:0 "Больше проверок, больше инспекторов, больше дисциплины. Пусть даже ценой разрастания громоздкой администрации, которую сложно контролировать"
 c3rd_other_events.73.b:0 "Поручить эти задачи децурионам"
 c3rd_other_events.73.b.tt1:0 "Эти местные магистраты обладают влиянием и популярностью. Они знают жителей и, несомненно, лучше всего подходят для этой задачи."
 c3rd_other_events.73.c:0 "Игнорировать эту проблему"
 c3rd_other_events.73.c.tt1:0 "Вы ничего не предпримете против уклонения от налогов"

 c3rd_other_events.74.t:0 "Бегство децурионов"
 c3rd_other_events.74.desc:0 "Децурионы плохо восприняли назначение на должность местных сборщиков налогов. Их престиж и популярность пострадали, а установленные правила обязывали их возмещать недоимки из собственных средств. \nМногие децурионы бежали из назначенных им городов и скрылись в провинциях, бросив свои обязанности..."
 c3rd_other_events.74.a:0 "Вернуть их. Силой."
 c3rd_other_events.74.a.tt1:0 "Беглецов вернут в цепях к их «почетной» службе."
 c3rd_other_events.74.b:0 "Это было неправильное решение, забудем об этом"
 c3rd_other_events.74.b.tt1:0 "С них снимут обязанности по сбору налогов"

 c3rd_other_events.75.t:0 "Провал введения новой валюты"
 c3rd_other_events.75.desc:0 "В прошлый раз введение новой валюты обернулось полным провалом, несомненно из-за отсутствия экономической строгости у нашего лидера. Вместо постепенного вывода старой валюты новая была введена резко и сразу, без учета денежного равновесия. \n\nПсихологический эффект для населения оказался разрушительным: зная, что старая валюта вскоре станет бесполезной, все стараются избавиться от нее как можно быстрее! Результат — резкий рост денежной массы и десятикратный рост цен."
 c3rd_other_events.75.a:0 "Скупим как можно больше старой валюты и переплавим ее!"
 c3rd_other_events.75.a.tt1:0 "Вы решите проблему, и ваш правитель больше никогда не повторит этой ошибки."
 c3rd_other_events.75.b:0 "[office_treasure_man.GetName] разберется с проблемой"
 c3rd_other_events.75.b.tt1:0 "#G Этот выбор доступен благодаря государственности [office_treasure_man.GetName] #!. Ваш правитель больше никогда не повторит этой ошибки."
 c3rd_other_events.75.c:0 "Не вижу здесь проблемы"
 c3rd_other_events.75.c.tt1:0 "#R Это снизит стоимость серебряных денег\n Это произошло из-за слабой государственности вашего правителя, и он наверняка снова совершит эту ошибку#!"

 c3rd_other_events.76.t:0 "Разделение империи"
 c3rd_other_events.76.desc:0 "После долгих обсуждений и учитывая многочисленные трудности, с которыми сталкивается наша страна, было решено, что мудрейшим решением станет разделение империи на две отдельные администрации. \nЭтот раздел, хотя и резкий, принесет множество преимуществ и станет глотком свежего воздуха, значительно упростив защиту границ и управление денежным балансом. \n\nОсталось лишь выбрать новую столицу, откуда начнет формироваться новая администрация."
 c3rd_other_events.76.a:0 "[first_split_capital.GetName] — идеальный выбор"
 c3rd_other_events.76.a.tt1:0 "Ваша страна будет #R разделена#!, и новая часть сосредоточится вокруг [first_split_capital.GetName] в [first_split_govship.GetName]"
 c3rd_other_events.76.b:0 "Почему бы не [second_split_capital.GetName]?"
 c3rd_other_events.76.b.tt1:0 "Ваша страна будет #R разделена#!, и новая часть сосредоточится вокруг [second_split_capital.GetName] в [second_split_govship.GetName]"
 c3rd_other_events.76.c:0 "[third_split_capital.GetName] засияет!"
 c3rd_other_events.76.c.tt1:0 "Ваша страна будет #R разделена#!, и новая часть сосредоточится вокруг [third_split_capital.GetName] в [third_split_govship.GetName]"
 c3rd_other_events.76.d:0 "[byzantium.GetName], центр Греции!"
 c3rd_other_events.76.d.tt1:0 "Вы можете выбрать исторический вариант, даже если расположение ваших земель приведет к несколько необычному разделению"
 c3rd_other_events.76.e:0 "Мы передумали, отмените планы"
 c3rd_other_events.76.e.tt1:0 "Вы пока не будете делить империю"
 c3rd_other_events.76.ttm:0 "#G Этот модификатор очень положительно скажется на вашем денежном балансе #!"
 c3rd_other_events.76.ttm2:0 "#G Этот модификатор ослабит вредные действия вашей знати #!"
 c3rd_other_events.76.ttd:0 "#G Ваша дефляция будет сокращена наполовину#!"
 c3rd_other_events.76.tts:0 "#G Обесценивание серебра будет сокращено наполовину#!"
 c3rd_other_events.76.ttlag:0 "\n Раздел будет создан динамически: регионы вокруг вашей столицы сохранятся в первую очередь, а регионы вокруг новой столицы будут потеряны в первую очередь\n#T Выбирайте мудро#!, так как потеря эксплуатируемого населения негативно повлияет на ваш баланс\n#Y Это может занять несколько секунд для расчета"

 c3rd_other_events.77.t:0 "Очень ресурсоёмкий выбор"
 c3rd_other_events.77.desc:0 "#R Salvete Imperator\n\n Это подтверждающее событие, чтобы убедиться, что вы прочли примечания к предыдущему выбору: раскол империи будет создан динамически, что может вызвать зависание на несколько секунд или даже вылет игры. Если вы играете в мультиплеере, это может быть крайне неприятным эффектом. Здесь вам даётся возможность сохранить игру (или предупредить друзей/поставить на паузу), чтобы быть готовым к любому исходу. #!"
 c3rd_other_events.77.a:0 "Да, странный голос в моей голове, я осознаю свой выбор"
 c3rd_other_events.77.a.tt1:0 "Пристегните ремни"
 c3rd_other_events.77.b:0 "Лаги? В моей игре от Paradox? НИКОГДА!"
 c3rd_other_events.77.b.tt1:0 "Мой процессор и так достаточно горячий..."

 c3rd_governorship_owner_tt:0 "Эта провинция прочно контролируется [OverviewGovernorshipItem.GetGovernorship.MakeScope.GetVariable('governorship_owner').GetCharacter.GetName]\n#R [OverviewGovernorshipItem.GetGovernorship.MakeScope.GetVariable('governorship_owner_ratio').GetValue] %#! региона находится под его контролем\n\nЭто учитывает процент владений, принадлежащих самому владельцу или главе семьи, если персонаж состоит в великой семье. Если слишком много регионов вашей страны контролируется одним человеком, могут появиться могущественные землевладельцы."
 c3rd_CanChange_tt1:0 "Губернатор владеет регионом и не может быть смещён"
 c3rd_CanChange_tt2:0 "Глава семьи владеет регионом и не согласен на смещение одного из её членов"
 c3rd_CanChange_tt3:0 "Вы не можете сменить губернатора вашей столичной области"
 c3rd_CanChange_tt4:0 "Губернатор нелоялен"
 c3rd_CanChange_tt:0 "Нажмите здесь, чтобы сменить губернатора"
 c3rd_governorship_owner_regain_control_tt1:0 "Вам нужно, чтобы владение снизилось до менее чем #R 25% #!, чтобы вернуть контроль над провинцией\nКонтроль ниже #G 10% #! даёт значительно больше шансов вернуть контроль без проблем"
 c3rd_governorship_owner_regain_control_tt2:0 "Владение ниже #G 10% #! даёт больше шансов вернуть контроль без проблем"
 c3rd_governorship_owner_regain_control_tt3:0 "#T Попытка вернуть контроль над провинцией #!"
 c3rd_governorship_owner_regain_control_tt3_2:0 "#G Так как владелец является правителем, контроль можно вернуть в любое время #! \n #R При этом половина владений вашего правителя в регионе будет конфискована #!"
 c3rd_governorship_owner_regain_control_tt3_3:0 "#T Так как нынешний губернатор является родственником правителя, который всё ещё владеет значительной частью провинции, существует риск, что он снова её захватит!#!"
 c3rd_governorship_owner_regain_control_tt3_4:0 "#G Владелец является членом семьи правителя и использует владения правителя для удержания контроля над провинцией. \n Вы можете вернуть контроль над провинцией,#! #R но выступая против интересов своей семьи, вы можете навлечь неприятности#! \n#T Так как нынешний губернатор является родственником правителя, который всё ещё владеет значительной частью провинции, существует риск, что он снова её захватит!#!"
 c3rd_governorship_owner_regain_control_tt4:0 "Вы уже недавно пытались вернуть контроль над этой провинцией"
 c3rd_governorship_owner_regain_control_tt5:0 "Владелец больше не находится в стране. Его контроль над землёй перейдёт к его семье или исчезнет естественным образом."
 
 c3rd_domain_owner_tt:0 "Эта автономная область принадлежит [DiplomaticView.GetTargetCountry.MakeScope.GetVariable('owner_from_another_empire').GetCharacter.GetName]\n#G Взаимодействие 'Реинтегрировать регион' доступно на правителе #!"

 c3rd_other_events.80.t:0 "Растущее влияние"
 c3rd_other_events.80.desc:0 "[autonomy_governorship.MakeScope.GetVariable('governorship_owner').GetCharacter.GetName] и его семья вложили много ресурсов в регион [autonomy_governorship.GetName]. Достаточно, чтобы местные власти подчинялись напрямую им."
 c3rd_other_events.80.a:0 "Вот это неприятно"
 c3rd_other_events.80.a.tt1:0 "Регион теперь считается оплотом семьи [autonomy_governorship.MakeScope.GetVariable('governorship_owner').GetCharacter.GetFamily.GetName]\n\n #T Вы можете проверить региональные владения и попытаться вернуть контроль во вкладке 'Обзор нации', раздел Администрирование. #!"
 c3rd_other_events.80.a.tt2:0 "Регион теперь считается оплотом [autonomy_governorship.MakeScope.GetVariable('governorship_owner').GetCharacter.GetName]\n\n #T Вы можете проверить региональные владения и попытаться вернуть контроль во вкладке 'Обзор нации', раздел Администрирование. #!"

 c3rd_other_events.802.desc:0 "[owner_target_for_number.GetName] владеет [owner_target_for_number.MakeScope.GetVariable('country_ownership').GetValue]%"

 c3rd_other_events.82.t:0 "Конфискация земель"
 c3rd_other_events.82.desc:0 "Захват [target.GetName] государственных земель необходимо контролировать. Политическая кампания и замена местных администраторов должны позволить сдержать проблему. Очевидно, это вызовет напряжение с его семьёй.\n"
 c3rd_other_events.82.a:0 "Принять меры в [governorship_1.GetName]"
 c3rd_other_events.82.a.tt1:0 "5 владений [target.GetName] или его семьи будут изъяты в [governorship_1.GetName]"
 c3rd_other_events.82.b:0 "[governorship_2.GetName] станет целью"
 c3rd_other_events.82.b.tt1:0 "5 владений [target.GetName] или его семьи будут изъяты в [governorship_2.GetName]"
 c3rd_other_events.82.c:0 "Его влияние в [governorship_3.GetName] слишком сильно"
 c3rd_other_events.82.c.tt1:0 "5 владений [target.GetName] или его семьи будут изъяты в [governorship_3.GetName]"
 c3rd_other_events.82.d:0 "[governorship_4.GetName] вернётся в государственную собственность"
 c3rd_other_events.82.d.tt1:0 "5 владений [target.GetName] или его семьи будут изъяты в [governorship_4.GetName]"
 c3rd_other_events.82.e:0 "Не будем спешить"
 c3rd_other_events.82.e.tt1:0 "Вы не предпримете никаких действий"

 c3rd_other_events.83.t:0 "Землевладелец сопротивляется изъятию"
 c3rd_other_events.83.desc:0 "Когда наши бюрократы завершали захват региональной администрации в [regaining_governorship.GetName], реакция [regaining_governorship.MakeScope.GetVariable('governorship_owner').GetCharacter.GetName] была молниеносной. Контрольно-пропускные пункты были перекрыты, важные документы спрятаны, чиновники избиты на местах, а в высших политических кругах разразились скандалы. Похоже, возвращение региона в руки государства не предрешено. \n\nПереговоры крайне важны, если мы не хотим усиливать давление."
 c3rd_other_events.83.a:0 "Дадим ему щедрое вознаграждение при уходе"
 c3rd_other_events.83.a.tt1:0 "Золото всегда решает проблемы"
 c3rd_other_events.83.b:0 "У него наверняка будут другие земли для утешения"
 c3rd_other_events.83.b.tt1:0 "Мы даруем новые земли [regaining_governorship.MakeScope.GetVariable('governorship_owner').GetCharacter.GetName]"
 c3rd_other_events.83.c:0 "Привлечь войска и решить проблему силой"
 c3rd_other_events.83.c.tt1:0 "Вы выберете насилие"
 c3rd_other_events.83.d:0 "Поставим его в меньшинство перед его коллегами"
 c3rd_other_events.83.d.tt1:0 "Эта опция доступна, так как у вашего лидера достаточно #G тонкости #! и разумных черт."
 c3rd_other_events.83.e:0 "Завалим его похвалами"
 c3rd_other_events.83.e.tt1:0 "Эта опция доступна, так как у вашего лидера достаточно #G харизмы #! и черты переговорщика."
 c3rd_other_events.83.f:0 "Дадим ему понять, что мы знаем, где он живёт"
 c3rd_other_events.83.f.tt1:0 "Эта опция доступна, так как у вашего лидера достаточно #G воинских навыков #! и хитроумных черт."
 c3rd_other_events.83.a.tt2:0 "Вы вернёте контроль над [regaining_governorship.GetName]."
 

 c3rd_other_events.84.t:0 "Стратегические инвестиции"
 c3rd_other_events.84.desc:0 "Наши квесторы сообщают о странных перемещениях средств в провинциях империи, сопровождающихся падением налоговых поступлений, особенно от великих семей. Похоже, что введение более строгого контроля за налогами знати подтолкнуло влиятельных людей вкладывать золото в земельные владения, желательно поблизости... Эта тенденция не кажется особенно опасной, но если её не сдерживать, мы можем потерять контроль над личными богатствами знати. Мы также можем устранить корень проблемы, успокоив наших инспекторов..."
 c3rd_other_events.84.a:0 "Оставить их в покое"
 c3rd_other_events.84.a.tt1:0 "Вы не будете вмешиваться\n #R Это решение может увеличить приобретение владений губернаторами на несколько лет#!"
 c3rd_other_events.84.b:0 "Заставить их подчиниться"
 c3rd_other_events.84.b.tt1:0 "Вы сократите проблему"
 c3rd_other_events.84.c:0 "Успокоим проверки"
 c3rd_other_events.84.c.tt1:0 "Вы отмените усиление налоговых инспекций\n #R Вы не сможете возобновить их в ближайшее время#!"

 c3rd_other_events.85.t:0 "Переговоры с влиятельным персонажем"
 c3rd_other_events.85.desc:0 "[target.GetName] — влиятельная фигура в нашей стране. Нравится нам это или нет, но мы должны принять этот факт. Хотя наши усилия по подрыву его влияния ещё не исчерпаны, иногда мудрее договориться на выгодных условиях.\nМы организуем встречу, чтобы найти общую почву. У нас есть несколько направлений, по которым можно выторговать уступки, остаётся решить, на каком мы сосредоточимся."
 c3rd_other_events.85.desc2:0 "Ответ [target.GetName] скоро поступит"
 c3rd_other_events.85.a:0 "Вернём часть его владений"
 c3rd_other_events.85.a.tt1:0 "Вы попытаетесь вернуть контроль над регионами под управлением [target.GetName]."
 c3rd_other_events.85.b:0 "Обеспечим его вечную лояльность"
 c3rd_other_events.85.b.tt1:0 "Вы сильно увеличите его преданность"
 c3rd_other_events.85.c:0 "Попросим его помочь нам эксплуатировать его земли"
 c3rd_other_events.85.c.tt1:0 "Вы сможете получить бонусы на всех землях, контролируемых [target.GetName]"
 c3rd_other_events.85.d:0 "Помоги нам сохранить единство страны"
 c3rd_other_events.85.d.tt1:0 "Вы попросите [target.GetName] помочь предотвратить надвигающуюся гражданскую войну"
 c3rd_other_events.85.e:0 "Я передумал, уступки нам не нужны"
 c3rd_other_events.85.e.tt1:0 "Вы не предпримете никаких действий"

 c3rd_other_events.86.t:0 "Ответы на переговоры"
 c3rd_other_events.86.desc.1:0 "[asked_landowner.GetName] пришёл к нам, чтобы ответить на наши предложения о соглашении. Низко поклонившись, он не смог скрыть своего удовлетворения тем, что его признали одним из влиятельных людей в нашей стране. Так как переговоры были подготовлены нашими советниками, его ответ был известен заранее:\n"
 c3rd_other_events.86.desc.2:0 "[asked_landowner.GetName] прибыл, представившись, чтобы ответить на наши просьбы о соглашении. Уверенный в своей силе, он встал прямо перед нашим правителем, ухмыляясь над протокольными формальностями. Вскоре он объявил свой ответ:\n"
 c3rd_other_events.86.desc.3:0 "По обычаю всех вызывает правитель, особенно при заключении соглашений о влиянии, но [asked_landowner.GetName], похоже, отказался явиться. Поэтому [ROOT.GetCountry.GetRuler.GetName] сам пришёл к нему и вынужден был поклониться [asked_landowner.GetName] – величайшее унижение. [asked_landowner.GetName], развалившись в своём дворце и окружённый почти царским двором, не медлил с объявлением своего ответа:\n"
 c3rd_other_events.86.desc.4:0 "Ответ от [asked_landowner.GetName] не заставил себя ждать, но, к нашему удивлению, им стало объявление о его смерти! Видимо, на этом переговоры и закончились..."
 c3rd_other_events.86.desc.5:0 "Странно, что мы ничего не просили, а нам сообщают о переговорах. Похоже, это ошибка. Лучше записать это на пергаменте 404 и передать нужным людям."
 c3rd_other_events.86.desc.11:0 "Это явный отказ. Значит, мы ничего не добились этой попыткой, но, возможно, стоит попробовать снова в более благоприятной ситуации?"
 c3rd_other_events.86.desc.12:0 "Наше предложение было принято, но в обмен [asked_landowner.GetName] потребовал серьёзных политических привилегий и публичного признания своего влияния. Достаточно для многих будущих интриг, если судить по его лукавому взгляду."
 c3rd_other_events.86.desc.13:0 "Наше предложение было принято, но в обмен [asked_landowner.GetName] потребовал признать многочисленные наместничества под его влиянием его личным доменом. Давать ему такой контроль – неслыханно, но, похоже, именно такую цену нам придётся заплатить?"
 c3rd_other_events.86.desc.14:0 "Наше предложение было принято, но в обмен [asked_landowner.GetName] потребовал изменить законы страны в пользу аристократии. Довольно обычное политическое требование!"
 c3rd_other_events.86.a:0 "Да будет так"
 c3rd_other_events.86.a.tt1:0 "Вы примете эти условия в обмен на свои требования"
 c3rd_other_events.86.a.tt2:0 "[gov_tooltip.GetName] станет частью этого"
 c3rd_other_events.86.b:0 "У нас есть лучшее предложение: золото. МНОГО ЗОЛОТА"
 c3rd_other_events.86.b.tt1:0 "Золото удовлетворит [asked_landowner.GetName]. \nЭто возможно благодаря исключительному такту вашего лидера и его умению вести разговоры... или же коррумпированной натуре [asked_landowner.GetName]."
 c3rd_other_events.86.c:0 "Мы постараемся, если и ты сделаешь то же!"
 c3rd_other_events.86.c.tt1:0 "Вы получите больше от [asked_landowner.GetName]. \nЭто возможно благодаря отсутствию у [asked_landowner.GetName] харизмы, а также дипломатическим качествам вашего лидера."
 c3rd_other_events.86.d:0 "Нет, эти условия неприемлемы"
 c3rd_other_events.86.d.tt1:0 "Вы отвергнете предложение и завершите переговоры"
 c3rd_other_events.86.e:0 "Ничего не предпринимать"
 c3rd_other_events.86.e.tt1:0 "Ничего сделано не будет"
 c3rd_other_events.86.tt13:0 "[SCOPE.ScriptValue('landowner_asked_ratio_number')|0Y] наместничеств присоединятся к автономному домену [asked_landowner.GetName]" 
 c3rd_other_events.86.tt1_1:0 "Часть владений персонажа будет изъята"
 c3rd_other_events.86.tt1_2:0 "Персонаж получит прирост лояльности"
 c3rd_other_events.86.tt1_3:0 "Каждое владение персонажа получит бонусы к налогам и людским ресурсам, а вы получите политическое влияние за каждый его автономный домен"
 c3rd_other_events.86.tt1_41:0 "Все нелояльные персонажи получат #G 10#! лояльности"
 c3rd_other_events.86.tt1_42:0 "Все нелояльные персонажи получат #G 15#! лояльности"
 c3rd_other_events.86.tt1_43:0 "Все нелояльные персонажи получат #G 20#! лояльности"
 c3rd_other_events.86.tt1_44:0 "Все нелояльные персонажи получат #G 30#! лояльности"


 c3rd_other_events.87.t:0 "Возвращение к управлению"
 c3rd_other_events.87.desc:0 "Полный контроль [owner_reintegrated.GetName] над государственной землёй должен быть остановлен. Быстрая отправка отряда бюрократов, сопровождаемых верной легионной частью, в один из автономных регионов позволит нам вернуть эффективное управление. [owner_reintegrated.GetName] на этот раз не сможет этому помешать, мы позаботились об этом...\n"
 c3rd_other_events.87.a:0 "Действовать в [governorship_1.GetName]"
 c3rd_other_events.87.a.tt1:0 "[governorship_1.GetName] вернётся в состав страны"
 c3rd_other_events.87.b:0 "[governorship_2.GetName] — наша цель"
 c3rd_other_events.87.b.tt1:0 "[governorship_2.GetName] вернётся в состав страны"
 c3rd_other_events.87.c:0 "Его влияние в [governorship_3.GetName] слишком сильно"
 c3rd_other_events.87.c.tt1:0 "[governorship_3.GetName] вернётся в состав страны"
 c3rd_other_events.87.d:0 "[governorship_4.GetName] вернётся в государственное владение"
 c3rd_other_events.87.d.tt1:0 "[governorship_4.GetName] вернётся в состав страны"
 c3rd_other_events.87.e:0 "Не будем торопиться"
 c3rd_other_events.87.e.tt1:0 "Вы ничего не предпримете"


 c3rd_other_events.88.t:0 "Будущее [subject_without_owner.GetName]"
 c3rd_other_events.88.desc:0 "[subject_without_owner.GetName], наша автономная провинция, оказалась в беспрецедентной ситуации: эта земля, ранее бывшая частью частного домена, осталась без владельца. Это уникальная возможность вернуть контроль над этими землями, пусть и несколько резким образом."
 c3rd_other_events.88.a:0 "Давайте всё это реинтегрируем"
 c3rd_other_events.88.a.tt1:0 "Вы поглотите домен"
 c3rd_other_events.88.b:0 "Пусть сохранят фактическую независимость"
 c3rd_other_events.88.b.tt1:0 "Домен станет клиентским государством"


 c3rd_other_events.89.t:0 "Будущее [subject_with_foreign_owner.GetName]"
 c3rd_other_events.89.desc:0 "[subject_with_foreign_owner.GetName], наша автономная провинция, оказалась в опасной ситуации: эта земля, ранее часть частного домена одного из наших знати, оказалась во владении иностранного персонажа. Это крайне опасно, так как [subject_with_foreign_owner.MakeScope.GetVariable('owner_from_another_empire').GetCharacter.GetName], ныне в [subject_with_foreign_owner.MakeScope.GetVariable('owner_from_another_empire').GetCharacter.GetEmployer.GetName], заявляет свои права и стремится вернуть землю. К великой радости его новых хозяев, разумеется. Мы можем быстро действовать и вернуть как можно больше земель до того, как это сделают наши соперники. Но есть и интересная альтернатива: предложить местным магнатам подтверждение их должности... в обмен на вечную верность."
 c3rd_other_events.89.a:0 "Быстро, вернуть контроль!"
 c3rd_other_events.89.a.tt1:0 "Вы поглотите большую часть домена, #R но часть будет аннексирована [subject_with_foreign_owner.MakeScope.GetVariable('owner_from_another_empire').GetCharacter.GetEmployer.GetName]#!"
 c3rd_other_events.89.b:0 "Народ [subject_with_foreign_owner.GetName], восстань!"
 c3rd_other_events.89.b.tt1:0 "Домен станет нашим клиентским государством, без потерь"



 c3rd_other_events.891.t:0 "Вопрос о [owner_without_subject.GetName]"
 c3rd_other_events.891.desc:0 "По воле случая или из-за административной ошибки земли [owner_of_nonsubject.GetName] в [owner_without_subject.GetName] стали официально независимыми. Это прискорбно и должно быть немедленно исправлено.\nОднако мы можем быстро восстановить контроль благодаря местной администрации, созданной [owner_of_nonsubject.GetName]. Но, возможно, это прекрасная возможность навести порядок, заменив администраторов?"
 c3rd_other_events.891.a:0 "Вернём этот домен в руки [owner_of_nonsubject.GetName]"
 c3rd_other_events.891.a.tt1:0 "[owner_without_subject.GetName] станет автономным доменом в вашей стране.\n #G Автономные домены могут быть мирно реинтегрированы через взаимодействие «Реинтегрировать регион» у правителя домена.#!"
 c3rd_other_events.891.b:0 "Пусть сохранят независимость... под контролем"
 c3rd_other_events.891.b.tt1:0 "#R Это необходимо, потому что [owner_without_subject.GetName] слишком велик для вашей страны#!\nСтрана станет нашим клиентским государством, часть соседних владений [owner_of_nonsubject.GetName] присоединится к нему\n [owner_of_nonsubject.GetName] станет правителем [owner_without_subject.GetName]"
 c3rd_other_events.891.c:0 "Как можно скорее вернуть прямой контроль"
 c3rd_other_events.891.c.tt1:0 "Вы аннексируете все земли [owner_without_subject.GetName]"

 c3rd_other_events.90.t:0 "Интриги за закрытыми дверями"
 c3rd_other_events.90.desc:0 "[pol_target.GetName], укрепивший своё положение политическими услугами, не почивает на лаврах. Его видят, как он обольщает многочисленных чиновников в столице, а осведомители даже говорят о тайных контактах с влиятельными военачальниками. Эти манёвры явно не случайны и направлены на усиление влияния [pol_target.GetName], несомненно, ради очень амбициозных целей. Вопрос лишь в том, как мы отреагируем."
 c3rd_other_events.90.a:0 "Пусть будет так"
 c3rd_other_events.90.a.tt1:0 "Вы не будете вмешиваться"
 c3rd_other_events.90.b:0 "Покажем этому выскочке, кто здесь кукловод"
 c3rd_other_events.90.b.tt1:0 "#G Эта опция доступна, так как вы популярнее, чем [pol_target.GetName]#!"
 c3rd_other_events.90.c:0 "Нужно действовать как можно быстрее"
 c3rd_other_events.90.c.tt1:0 "Вы вмешаетесь, чтобы подорвать инициативы [pol_target.GetName]"


 c3rd_other_events.91.t:0 "Переворот!"
 c3rd_other_events.91.desc:0 "Вечер был в разгаре, и наш правитель [ROOT.GetCountry.GetRuler.GetName] отдыхал в своих покоях, когда дверь резко распахнулась: в комнату ворвалась группа вооружённых людей во главе с [pol_target_c.GetName], сопровождаемым [pol_support_1.GetName] и [pol_support_2.GetName]. Эффект неожиданности был полным, но за ним последовали чёткие и прямые требования. Кто бы мог подумать, что жажда власти [pol_target_c.GetName] приведёт его к вооружённому перевороту? Уступить его требованиям было бы благоразумно, но это означало бы потерять всё влияние. Однако можно ответить на оружие оружием!"
 c3rd_other_events.91.a:0 "У нас нет выбора"
 c3rd_other_events.91.a.tt1:0 "Вы уступите требованиям [pol_target_c.GetName] о большей власти и влиянии"
 c3rd_other_events.91.b:0 "[pol_target_c.GetName] должен взять власть"
 c3rd_other_events.91.b.tt1:0 "Это возможно, потому что [pol_target_c.GetName] #G популярнее#! нашего правителя"
 c3rd_other_events.91.c:0 "Стража, сюда! Предатель!"
 c3rd_other_events.91.c.tt1:0 "Сражаться смело, но рискованно!"
 c3rd_other_events.91.c.tt2:0 "Вы сорвёте переворот и заключите [pol_target_c.GetName] в тюрьму, если он не глава семьи"
 c3rd_other_events.91.c.tt3:0 "Ваш правитель погибнет"
 c3rd_other_events.91.c.tt4:0 "Все персонажи с лояльностью ниже #Y 50#! станут более #R мятежными#!, а те, что выше — более #G лояльными#!."

 c3rd_other_events.92.t:0 "Осуждение влияния"
 c3rd_other_events.92.desc:0 "[gov_target_complain.GetName], губернатор региона [govship_target_complain.GetName], недавно публично осудил «незаконный» контроль [gov_owner_target_complain.GetName] над землями, которыми он должен управлять. \nХотя всем хорошо известно о реальном влиянии знати на государство, это всё же политический кризис... и отличный повод для законного вмешательства в дела аристократии."
 c3rd_other_events.92.a:0 "Какой скандал! [gov_target_complain.GetName] вправе возмущаться"
 c3rd_other_events.92.a.tt2:0 "[gov_owner_target_complain.GetName] теряет владение в [govship_target_complain.GetName], у [gov_target_complain.GetName] есть 33% шанс вернуть его"
 c3rd_other_events.92.a.tt3:0 "#R Некоторые владения принадлежат главе семьи [gov_owner_target_complain.GetName] и не будут отозваны#!"
 c3rd_other_events.92.a.tt1:0 "[gov_target_complain.GetName] даст нам повод сократить владения [gov_owner_target_complain.GetName] в [govship_target_complain.GetName], под прикрытием полной законности"
 c3rd_other_events.92.b:0 "Что это? Нет, в [govship_target_complain.GetName] всё в порядке"
 c3rd_other_events.92.b.tt1:0 "Мы встанем на сторону [gov_owner_target_complain.GetName] и проигнорируем жалобу [gov_target_complain.GetName]"
 c3rd_other_events.92.c:0 "Вы все коррумпированы, и это дело только подтверждает это"
 c3rd_other_events.92.c.tt1:0 "Мы используем этот скандал как предлог, чтобы покопаться в частных делах всех сторон"

 c3rd_other_events.93.t:0 "Влияние с высших кругов"
 c3rd_other_events.93.desc:0 "Наш правитель напрямую владеет некоторыми регионами страны. Хотя это практичный способ контролировать эти богатые земли, по правде говоря, это не очень законно и не очень уважаемо. \n[gov_target_complain2.GetName], губернатор [govship_target_complain2.GetName], недавно официально выразил протест, осудив удушающий контроль [ROOT.GetCountry.GetRuler.GetName] над землями, которыми он должен управлять. Юридическая сторона его нападок не может заставить нас уступить... но последствия для репутации правительства могут быть катастрофическими."
 c3rd_other_events.93.a:0 "Этот дорогой друг, разумеется, единственный губернатор"
 c3rd_other_events.93.a.tt2:0 "Мы откажемся от части владений в [govship_target_complain2.GetName], у [gov_target_complain2.GetName] будет #R 50%#! шанс получить их"
 c3rd_other_events.93.a.tt1:0 "Уступка нескольких территорий должна успокоить этого шута и замять дело"
 c3rd_other_events.93.b:0 "Хорошо, управление — его прерогатива"
 c3rd_other_events.93.b.tt1:0 "Мы потеряем контроль над регионом, но сохраним владения"
 c3rd_other_events.93.c:0 "Эта земля — ЧАСТНАЯ собственность"
 c3rd_other_events.93.c.tt1:0 "Мы будем стоять твёрдо, несмотря на последствия"

 c3rd_other_events.101.t:0 "Реформа [ROOT.GetCountry.GetRuler.GetName]"
 c3rd_other_events.101.desc:0 "Наш правитель, [ROOT.GetCountry.GetRuler.GetName], уже некоторое время размышляет над последними военными волнениями. Для этого человека закона военный захват власти — опыт, который не должен повториться. \nЕго глубокие знания государственных дел вдохновили его на создание нового законодательства, ограничивающего возможность повторной военной анархии. \nЛюбой закон имеет недостатки, и мы вскоре их почувствуем, но это, несомненно, шанс защитить себя от будущих аппетитов."
 c3rd_other_events.101.a:0 "Воспользуемся этим шансом"
 c3rd_other_events.101.a.tt1:0 "Теперь вы сможете выбрать закон #Y Реформа Константина#! в административных законах"
 c3rd_other_events.101.b:0 "Нет, в этом нет нужды"
 c3rd_other_events.101.b.tt1:0 "Ближайшее время вы больше не получите такой возможности"

 c3rd_other_events.102.t:0 "Расширение герцогства"
 c3rd_other_events.102.desc:0 "Герцогство, некогда простая военная комендатура на границах империи, со временем превратилось в обширное владение с богатейшими ресурсами. \nНаша военная администрация постепенно эволюционировала в настоящее королевство, значительную силу в регионе..."
 c3rd_other_events.102.a:0 "Мы смотрим в будущее"
 c3rd_other_events.102.a.tt1:0 "Вы больше не просто герцогство"

 c3rd_other_events.103.t:0 "Расширение герцогства"
 c3rd_other_events.103.desc:0 "Одно из наших самых значимых герцогств, [ex_duchy.GetName], некогда простая военная комендатура на границах империи, со временем превратилось в обширное владение с богатейшими ресурсами. \nВоенная администрация постепенно эволюционировала в настоящее королевство, значительную силу в регионе...\nТеперь его положение уже не соответствует одиночной крепости, и нам следует пересмотреть наши отношения. Естественно сохранить прочную связь с ним, но, возможно, более высокая степень независимости принесёт больше пользы."
 c3rd_other_events.103.a:0 "Сохраним контроль над [ex_duchy.GetName]"
 c3rd_other_events.103.a.tt1:0 "Герцогство станет нашим клиентским государством"
 c3rd_other_events.103.b:0 "Они могут сохранить солидную автономию"
 c3rd_other_events.103.b.tt1:0 "Герцогство станет нашим данником"
 c3rd_other_events.103.c:0 "Они станут ключевым партнёром в регионе!"
 c3rd_other_events.103.c.tt1:0 "Герцогство станет полностью независимым, а мы получим значительный бонус к мнению"

 c3rd_other_events.104.t:0 "Создание герцогства"
 c3rd_other_events.104.desc:0 "Вследствие опасной экспансии варваров на наши земли [duchy_creator.GetName] решил даровать [duchy_capital.GetOwner.GetRuler.GetName] военное командование в качестве герцога (Dux)."
 c3rd_other_events.104.a:0 "Мы должны укрепить наш контроль над страной"
 c3rd_other_events.104.a.tt1:0 "Земли провинции [duchy_capital.GetState.GetName] были объединены в герцогство"
 c3rd_other_events.104.a.tt2:0 "Это произошло, так как у вас действует закон «Полная автономия»"
 c3rd_other_events.104.a.tt3:0 "Это произошло, потому что регион принадлежит [duchy_creator.GetName]"

 c3rd_other_events.105.t:0 "Хаотичное наследование"
 c3rd_other_events.105.desc:0 "После смерти прежнего главы семьи [main_heir_landowner.GetName] унаследовал власть над огромными владениями в нашей стране. Однако это наследование не прошло без проблем — [second_heir_landowner.GetName], [third_heir_landowner.GetName] и [fourth_heir_landowner.GetName] оспорили его права, требуя свои доли. \n\nВсе они обратились к власти государства, которая вполне могла решить спор в их пользу."
 c3rd_other_events.105.a:0 "Подтвердим положение [main_heir_landowner.GetName]"
 c3rd_other_events.105.a.tt1:0 "Вы не будете вмешиваться в наследование"
 c3rd_other_events.105.b:0 "Разделить поровну"
 c3rd_other_events.105.b.tt1:0 "Владения будут разделены между претендентами"
 c3rd_other_events.105.c:0 "Разделить поровну, включая долю государства!"
 c3rd_other_events.105.c.tt1:0 "Владения будут разделены между претендентами, часть будет изъята"

 c3rd_other_events.106.t:0 "Желанный владелец"
 c3rd_other_events.106.desc:0 "Мы узнали о большом приёме, организованном [first_head_pretender.GetName] и [second_head_pretender.GetName] в честь [minor_owner.GetName] в одном из богатых поместий. За этими встречами «людей хорошего общества» явно скрывается крупная операция по обольщению, цель которой — склонить Филиппа присоединиться к одной из семей со всеми её богатыми землями. \n\nМы можем вмешаться, чтобы остановить эти торжества, или поддержать одну из семей."
 c3rd_other_events.106.a:0 "Семья [first_head_pretender.GetFamily.GetName] безусловно лучшая"
 c3rd_other_events.106.a.tt1:0 "[minor_owner.GetName] присоединится к семье [first_head_pretender.GetFamily.GetName]"
 c3rd_other_events.106.b:0 "Очевидно, что семья [second_head_pretender.GetFamily.GetName] — мудрый выбор"
 c3rd_other_events.106.b.tt1:0 "[minor_owner.GetName] присоединится к семье [second_head_pretender.GetFamily.GetName]"
 c3rd_other_events.106.c:0 "Прекратить этот фарс!"
 c3rd_other_events.106.c.tt1:0 "Остановить пир — не слишком весело, но мы сохраним независимость [minor_owner.GetName]"

 c3rd_other_events.107.t:0 "Территориальная махинация"
 c3rd_other_events.107.desc:0 "[first_head_disloyal.GetName] и [second_head_disloyal.GetName], два влиятельных человека в нашей стране, объединились и представили множество документов, подтверждающих их права в [target_governorship.GetName]. Они требуют немедленной передачи всех «чужих» владений в этих землях, нацелившись в частности на нашего правителя. \n\nЗа всей этой мишурой, очевидно, скрывается грубая попытка ослабить государство ради собственной выгоды."
 c3rd_other_events.107.a:0 "Снизим напряжение и уступим"
 c3rd_other_events.107.a.tt1:0 "Вы откажетесь от всех владений в [target_governorship.GetName], часть из них получат [first_head_disloyal.GetName] и [second_head_disloyal.GetName]"
 c3rd_other_events.107.b:0 "У вас нет прав на эти земли"
 c3rd_other_events.107.b.tt1:0 "Ваш правитель сохранит свои владения"
 c3rd_other_events.107.c:0 "[loyal_head.GetName] предлагает свою поддержку!"
 c3rd_other_events.107.c.tt1:0 "#G Это возможно, потому что [loyal_head.GetName] достаточно лоялен#!"

 c3rd_other_events.110.t:0 "Мятеж в верхах"
 c3rd_other_events.110.desc:0 "Власть — вещь капризная, и очень часто зависит от расположения элит и баланса сил. \nНа этот раз баланс не в нашу пользу: [first_inter_char.GetName] развернул масштабное политическое наступление против нашего правительства. При поддержке [second_inter_char.GetName] и [third_inter_char.GetName] он стремится к радикальным переменам, соответствующим его недовольству.\n\n Такой политический кризис может потрясти основы нашей империи, если мы не решим его быстро..."
 c3rd_other_events.110.a:0 "Лучше заручиться поддержкой этих генералов..."
 c3rd_other_events.110.a.tt1:0 "Благоразумнее выслушать этих военных и дать им влияние, которого они заслуживают"
 c3rd_other_events.110.a.tt2:0 "#R Это приведёт к военной анархии на несколько лет#!"
 c3rd_other_events.110.b:0 "Армия управляет страной. Пусть сами договариваются"
 c3rd_other_events.110.b.tt1:0 "Новые сильные люди на время смуты. Пусть перебьют друг друга"
 c3rd_other_events.110.c:0 "Деньги? Привилегии? Получите всё!"
 c3rd_other_events.110.c.tt1:0 "Вы пойдёте на крупные уступки в денежной политике.\n#R Эти изменения негативно скажутся на экономическом балансе#!"
 c3rd_other_events.110.d:0 "Ваши владения, разумеется, гарантированы"
 c3rd_other_events.110.d.tt1:0 "Вы предоставите мятежникам широкие земельные права"
 c3rd_other_events.110.e:0 "Дадим некоторые льготы для решения проблемы"
 c3rd_other_events.110.e.tt1:0 "Вы дадите некоторые земельные права. Это подчеркнёт кажущуюся слабость правительства"
 c3rd_other_events.110.f:0 "Дадим владельцам больше свободы. Гораздо больше свободы"
 c3rd_other_events.110.f.tt1:0 "Вы предоставите владельцам очень широкие права"
 c3rd_other_events.110.g:0 "Чего ещё они хотят? Пусть получат всё"
 c3rd_other_events.110.g.tt1:0 "Широкая децентрализация власти приведёт к распаду провинциального единства"
 c3rd_other_events.110.g.tt2:0 "Автономная область [byebye_owner.GetName] станет клиентским государством. Государства в регионах, принадлежащих [byebye_owner.GetName], которые граничат с [byebye_domain.GetName], перейдут под власть [byebye_domain.GetName]"
 c3rd_other_events.110.h:0 "Предатели! Вы не получите НИЧЕГО"
 c3rd_other_events.110.h.tt1:0 "Вы останетесь безучастны к их требованиям, несмотря ни на какие последствия"

 c3rd_other_events.120.t:0 "Золото на руках"
 c3rd_other_events.120.desc:0 "Склонность нашего правителя [ROOT.GetCountry.GetRuler.GetName] к безудержной коррупции поначалу могла казаться лишь простыми ошибками в суждениях, но слухи лишь добавили масла в огонь разоблачений, и теперь скандал распространился во всех кругах власти...\n\nЕщё не поздно списать всё на случайность и сурово закрутить гайки, запустив масштабный антикоррупционный план, который наш правитель, разумеется, примет без возражений. Но можно и раздать всем недовольным ту же финансовую щедрость! Ведь... кто не любит золото?"
 c3rd_other_events.120.a:0 "Благоустроенное государство начинается с себя!"
 c3rd_other_events.120.a.tt1:0 "Вы запустите масштабный план очистки власти, но он не будет проходить гладко. На время действия модификатора #R вы не сможете использовать взаимодействия «Даровать владение» и «Свободные руки», а «Подкуп» приведёт к потере популярности вашим правителем#!."
 c3rd_other_events.120.b:0 "Мы умеем быть щедрыми с нашими сторонниками"
 c3rd_other_events.120.b.tt1:0 "Вы развяжете коррупцию в верхах, уладив скандал. \n#R Однако, если ваш правитель и главы великих семей станут чрезмерно коррумпированными, это может привести страну к переломному моменту.#! \n #Y В течение действия модификатора могут происходить особые мелкие события.#!"
 c3rd_other_events.120.c:0 "Клевета и ложь!"
 c3rd_other_events.120.c.tt1:0 "Вы отрицаете наличие каких-либо проблем на вершине власти. \n#R В ближайшие годы могут произойти мелкие негативные события, если ваш правитель останется слишком коррумпированным.#!"

 c3rd_other_events.121.t:0 "Выгоды знатных семей"
 c3rd_other_events.121.desc:0 "[global_corr_head.GetName] предлагает свою поддержку в обмен на личные услуги."
 c3rd_other_events.121.a:0 "Хорошая мысль"
 c3rd_other_events.121.b:0 "Пресечь это"

 c3rd_other_events.122.t:0 "Отношения при дворе"
 c3rd_other_events.122.desc:0 "[global_corr_off.GetName] готов поддержать правительство, если мы закроем глаза на его дела."
 c3rd_other_events.122.a:0 "Так тому и быть"
 c3rd_other_events.122.b:0 "Нужно всё проверить"

 c3rd_other_events.123.t:0 "Местное управление"
 c3rd_other_events.123.desc:0 "[global_corr_gov.GetName] похоже управляет землями слишком по-своему"
 c3rd_other_events.123.a:0 "Пусть будет так"
 c3rd_other_events.123.b:0 "Мы должны жёстче контролировать"

 c3rd_other_events.124.t:0 "Военное покровительство"
 c3rd_other_events.124.desc:0 "[global_corr_gen.GetName] известен своей близостью к войскам, «так что нам не о чем беспокоиться», — говорит он."
 c3rd_other_events.124.a:0 "Он имеет нашу поддержку"
 c3rd_other_events.124.b:0 "Прекратить это"

 c3rd_other_events.125.t:0 "Неповиновение знати"
 c3rd_other_events.125.desc:0 "[ruler_corr_head.GetName] открыто заявил, что больше не будет поддерживать столь коррумпированного правителя"
 c3rd_other_events.125.a:0 "Ничего страшного"
 c3rd_other_events.125.b:0 "Пригрозить ему"

 c3rd_other_events.126.t:0 "Политическое наступление"
 c3rd_other_events.126.desc:0 "[ruler_corr_off.GetName] использует своё положение в правительстве, чтобы подстрекать к мятежу против нашего правителя, которого описывают как ненадёжного и недостойного."
 c3rd_other_events.126.a:0 "Просто проигнорировать"
 c3rd_other_events.126.b:0 "Пригрозить ему"

 c3rd_other_events.127.t:0 "Ропот в провинциях"
 c3rd_other_events.127.desc:0 "Провинции под управлением [ruler_corr_gov.GetName] наводнены яростной пропагандой против нашего правителя, которого называют жестоким и коррумпированным."
 c3rd_other_events.127.a:0 "Отсюда ничего не слышно"
 c3rd_other_events.127.b:0 "Пора навестить его"

 c3rd_other_events.128.t:0 "Потеря легитимности"
 c3rd_other_events.128.desc:0 "Войска под командованием [ruler_corr_gen.GetName] наслушались ужасных историй о нашем правителе, его жажде золота и жестокости."
 c3rd_other_events.128.a:0 "Пусть верят, во что хотят"
 c3rd_other_events.128.b:0 "Отречься от этих слухов"

 c3rd_other_events.129.t:0 "Мафия-государство"
 c3rd_other_events.129.desc:0 "Ужасное состояние нашей инфраструктуры больше невозможно скрывать. Беспредельная коррупция, ранее ограниченная лишь нашим правителем, теперь открыто разделяется наиболее влиятельными фигурами государства. \nЗачем платить налоги или идти по пути заслуг, если несколько монет в нужной руке открывают все двери?"
 c3rd_other_events.129.a:0 "Это катастрофа"
 c3rd_other_events.129.a.tt1:0 "#R Это произошло потому, что ваш правитель и главы всех семей сильно коррумпированы.#!"
 c3rd_other_events.129.b:0 "Я ни при чём, виноваты эти предатели."
 c3rd_other_events.129.b.tt1:0 "#R Это произошло потому, что ваш правитель и главы всех семей сильно коррумпированы.#!"

 c3rd_other_events.130.t:0 "Эпидемия во владениях"
 c3rd_other_events.130.desc.1:0 "Болезнь распространяется по стране, но помимо пагубных последствий самой эпидемии, тревожные слухи достигли ушей знати: имения, лично управляемые нашим правителем, получили прямой приказ от [owner_epidemy_action.GetName] защищать интересы правящей семьи любой ценой, даже если придётся пожертвовать местным населением!\n\nПеред лицом всеобщего осуждения [owner_epidemy_action.GetName] должен покаяться и передать земли государству. Но разве не важнее прежде всего защитить интересы правителя?"
 c3rd_other_events.130.desc.2:0 "Болезнь распространяется по стране, но помимо пагубных последствий самой эпидемии, появилось ещё одно зло: имения, управляемые ведущими деятелями страны, ведутся... иначе. В частности, [owner_epidemy_action.GetName] обвиняется в обходе администрации, чтобы лично контролировать эпидемию в своих землях.\nБолее локальное управление, безусловно, принесло бы пользу населению в ряде областей, но национальные усилия от этого пострадают.\n\nМы должны решить, прекратить ли эти личные действия, рискуя рассердить [owner_epidemy_action.GetName], или закрыть глаза."
 c3rd_other_events.130.desc.3:0 "Болезнь распространяется по стране, но помимо пагубных последствий самой эпидемии, появилось ещё одно зло: имения, управляемые ведущими деятелями страны, ведутся... иначе. В частности, [owner_epidemy_action.GetName] обвиняется в том, что он обходит администрацию ради защиты своих богатств и владений, даже если это означает эксплуатацию сограждан и их смерть!\n\nМы должны решить, прекратить ли эти личные действия, рискуя рассердить [owner_epidemy_action.GetName], или закрыть глаза."
 c3rd_other_events.130.a:0 "[owner_epidemy_action.GetName] хозяин у себя дома"
 c3rd_other_events.130.a.tt1:0 "Позволив персонажу управлять владениями как он хочет, вы получите #R серьёзные штрафы во всех провинциях#! наместничеств, поражённых эпидемией, где владельцем является [owner_epidemy_action.GetName]."
 c3rd_other_events.130.b:0 "Остановить его, страна важнее"
 c3rd_other_events.130.b.tt1:0 "Эффект этого решения зависит от влияния [owner_epidemy_action.GetName] и вашей стабильности. Сильный персонаж обойдётся вам дороже политической власти, а высокая стабильность ухудшится ещё сильнее."
 c3rd_other_events.130.c:0 "[owner_epidemy_action.GetName] хозяин у себя дома"
 c3rd_other_events.130.c.tt1:0 "Позволив персонажу управлять владениями как он хочет, вы получите #R серьёзные штрафы во всех провинциях#! наместничеств, поражённых эпидемией, где владельцем является [owner_epidemy_action.GetName].\nТак как [owner_epidemy_action.GetName] является правителем, стабильность нарушится ещё сильнее, если в вашей стране и так высокая стабильность."
 c3rd_other_events.130.d:0 "Государство — это не всегда я"
 c3rd_other_events.130.d.tt1:0 "Ваш правитель потеряет около 60% нынешних владений, а также 60% имений в провинциях наместничеств, поражённых эпидемией."

 give_law_change_cultdec_tt1:0 "Этот модификатор можно отменить во вкладке решений по основной культуре"
 give_law_change_cultdec_tt2:0 "Это окажет #R негативное влияние#! на денежный баланс"
 give_law_change_set_tt1:0 "#R Эта привилегия увеличит темпы и возможности аристократов в приобретении земель#!"
 give_law_change_evolve_tt1:0 "#T Государственные выгоды для землевладельцев изменятся:#!"

 c3rd_barbarian_events.1.t:0 "Наши границы под давлением варваров"
 c3rd_barbarian_events.1.desc:0 "Варварская грязь подступает!\nБеженцы с наших обширных границ возвращаются с рассказами о грабежах, резне и выжженных землях. Правда это или нет — люди задаются вопросом, справимся ли мы, а наша логистика трещит под натиском всё возрастающих требований охваченного паникой населения. \nОт нас зависит, станет ли эта новая напасть лишь анекдотом в нашей истории или её концом."
 c3rd_barbarian_events.1.a:0 "Мы будем готовы"
 c3rd_barbarian_events.1.a.tt1:0 "Это событие происходит, потому что варварские разорения приближаются к нашим границам.\nЭффекты этого модификатора продлятся минимум 10 лет, а затем до тех пор, пока земли, разорённые варварами, существуют на наших границах или в нашей державе. #G Герцогства#! обладают военной устойчивостью, делающей их невосприимчивыми к варварским разорениям, и они являются эффективными пограничными стражами."
 c3rd_barbarian_events.1.a.tt2:0 "Земли вашего соседа [neighbor_got_barbarians.GetName] разоряются варварами, что ставит ваши границы в состояние тревоги."

 c3rd_barbarian_events.2.t:0 "Наши границы снова в безопасности"
 c3rd_barbarian_events.2.desc:0 "Давление на наши границы ослабло, и орды отступили. Ситуация, похоже, вернулась в норму — по крайней мере, на время!"
 c3rd_barbarian_events.2.a:0 "Остаёмся настороже"
 c3rd_barbarian_events.2.a.tt1:0 "Ваши границы в безопасности на время, но если орды снова вернутся к вашим рубежам, давление ощутится вновь!\n\n #G Герцогства#! обладают военной устойчивостью, делающей их невосприимчивыми к варварским разорениям, и они являются эффективными пограничными стражами."

 c3rd_barbarian_events.10.t:0 "Местные инициативы по обороне"
 c3rd_barbarian_events.10.desc:0 "Столкнувшись с варварским давлением на наших границах, некоторые из наиболее уязвимых государств начали организовывать и укреплять оборону на местном уровне. Эти инициативы безусловно полезны, если бы только ими не руководил [local_gov_owner.GetName], неофициальный владыка этих земель. Похоже, что за действиями во имя общего блага [local_gov_owner.GetName] стремится укрепить своё влияние и сделать себя ключевой фигурой в обороне страны. Действительно ли разумно позволять такому человеку наращивать политическую власть?"
 c3rd_barbarian_events.10.a:0 "Эти действия приветствуются"
 c3rd_barbarian_events.10.a.tt1:0 "[local_gov_owner.GetName] укрепит свою власть в стране своими действиями и предоставит следующие наместничества:"
 c3rd_barbarian_events.10.a.tt2:0 "[local_control_gov_parse.GetName]"
 c3rd_barbarian_events.10.a.tt3:0 " следующий бонус в государствах, находящихся под угрозой вторжения:"
 c3rd_barbarian_events.10.b:0 "Пресечь эти инициативы в зародыше"
 c3rd_barbarian_events.10.b.tt1:0 "Эти действия будут остановлены. Общественное и военное мнение окажется на стороне [local_gov_owner.GetName], что создаст проблемы."
 c3rd_barbarian_events.10.b.tt2:0 "#R Это расстроит армию #!"
 c3rd_barbarian_events.10.b.tt3:0 "#R Это может расстроить армию #!"
 c3rd_barbarian_events.10.c:0 "Попробуем убедить его отказаться"
 c3rd_barbarian_events.10.c.tt1:0 "Эти действия будут остановлены\n #G Это возможно благодаря харизме вашего лидера или его чертам характера. #!"
 c3rd_barbarian_events.10.d:0 "Вмешаемся в проект, чтобы снизить его значение"
 c3rd_barbarian_events.10.d.tt1:0 "Действия будут под контролем, что уменьшит их положительный и отрицательный эффект.\n #G Это возможно благодаря изяществу вашего лидера или его чертам характера. #!\n Это даст следующие наместничества:"

 c3rd_barbarian_events.11.t:0 "Военно-административные соперничества"
 c3rd_barbarian_events.11.desc.1:0 "Легион [rivalry_governorships.GetName] могущественен и прославлен, его подвиги — гордость солдат. Однако строгое разделение военного и гражданского командования порой порождает напряжение в регионе, контролируемом приближёнными [ROOT.GetCountry.GetRuler.GetName]. Недавно [rivalry_army.GetName] под командованием [rivalry_commander.GetName] вступил в конфликт с местной администрацией, требуя больше припасов и снаряжения, даже за счёт местных резервов. Администрация заявила, что подчиняется исключительно нашему правителю, отстаивая идею, что они служат лично [ROOT.GetCountry.GetRuler.GetName], а не государству.\nЭто коварное осложнение может подорвать образ нашего лидера, если мы не отреагируем быстро."
 c3rd_barbarian_events.11.desc.2:0 "Легион [rivalry_governorships.GetName] могущественен и прославлен, его подвиги — гордость солдат. Однако строгое разделение военного и гражданского командования порой порождает напряжение, особенно учитывая, что регион тайно контролирует [rivalry_owner.GetName]. Недавно [rivalry_army.GetName] под командованием [rivalry_commander.GetName] вступил в конфликт с местной администрацией, требуя больше припасов и снаряжения, даже за счёт местных резервов. [rivalry_owner.GetName] отказал ему, заявив, что администрация независима и её прерогативы священны...\nВсе взгляды устремлены на нашего лидера, который должен рассудить этот бесплодный конфликт."
 c3rd_barbarian_events.11.a:0 "У [rivalry_owner.GetName] непререкаемый авторитет"
 c3rd_barbarian_events.11.a.tt1:0 "Поддержка [rivalry_owner.GetName] будет полезна политически, но [rivalry_army.GetName] пострадает, а его командир будет унижен."
 c3rd_barbarian_events.11.b:0 "Верность лидеру превыше всего"
 c3rd_barbarian_events.11.b.tt1:0 "[rivalry_army.GetName] пострадает, а его командир будет унижен"
 c3rd_barbarian_events.11.c:0 "[rivalry_commander.GetName] должен взять всё необходимое"
 c3rd_barbarian_events.11.c.tt1:0 "Вы окажете поддержку [rivalry_commander.GetName], что вызовет недовольство у [rivalry_owner.GetName]"
 c3rd_barbarian_events.11.d:0 "Мы осуждаем этих прихвостней"
 c3rd_barbarian_events.11.d.tt1:0 "Вы будете отстаивать интересы государства, что приведёт к тому, что ваш лидер потеряет неофициальный контроль над регионом и часть своих владений"
 c3rd_barbarian_events.11.e:0 "Положим конец этим играм власти"
 c3rd_barbarian_events.11.e.tt1:0 "Вы сохраните статус-кво, но также усилите напряжённость между этими двумя людьми"
 c3rd_barbarian_events.11.e.tt2:0 "#R [rivalry_owner.GetName] и [rivalry_commander.GetName] — соперники, и их противостояние приведёт к дестабилизации#!"

 c3rd_barbarian_events.12.t:0 "Magister Militum"
 c3rd_barbarian_events.12.desc:0 "Столкнувшись с многочисленными варварскими набегами на наших границах, [magister_com.GetName], командующий одним из соединений региона, был провозглашён Magister Militum и начал руководить восстановлением региона. Его действия были встречены с похвалами, и есть все основания полагать, что они окажут положительное влияние, однако значительное влияние, которое он получает, опасно и может угрожать стабильности империи.\n Пока [magister_com.GetName] находится в столице, наслаждаясь похвалами, которые он считает заслуженными, у нас есть золотая возможность быстро отреагировать..."
 c3rd_barbarian_events.12.a:0 "[magister_com.GetName] станет нашим щитом против варваров"
 c3rd_barbarian_events.12.a.tt1:0 "[magister_army.GetName] будет значительно усилен, #R но [magister_com.GetName] получит ещё большую политическую власть и влияние в [magister_gov.GetName]#!"
 c3rd_barbarian_events.12.b:0 "Пора быстро остановить всё это"
 c3rd_barbarian_events.12.b.tt1:0 "Это унизит [magister_com.GetName], но не даст ему усилить своё влияние."
 c3rd_barbarian_events.12.c:0 "Это измена"
 c3rd_barbarian_events.12.c.tt1:0 "Используем предлог неповиновения и подозрения в мятеже, чтобы заключить его в тюрьму. #G Это возможно, так как [magister_com.GetName] ещё не слишком силён#!"

 c3rd_barbarian_events.13.t:0 "В двух шагах от Рубикона"
 c3rd_barbarian_events.13.desc:0 "Известно, что регион [owner_overtake_gov.GetName] тайно контролируется [owner_overtake_char.GetName]. Этот статус-кво не имел бы последствий, если бы его влияние ограничивалось административным. Однако, движимый жаждой власти, [owner_overtake_char.GetName] сумел убедить достаточное количество командиров [owner_overtake_legion.GetName] поддержать его амбиции. Несомненно, такая сильная поддержка поможет ему в его замыслах и даже облегчит возможный государственный переворот.\n\nЕго нужно остановить, пока не поздно, но можем ли мы позволить себе оттолкнуть собственные вооружённые силы?"
 c3rd_barbarian_events.13.tt1:0 "#R Это произошло из-за лояльности [owner_overtake_char.GetName] и числа командиров легиона в регионе, которые обладают низкой преданностью нам. #!"
 c3rd_barbarian_events.13.a:0 "Собрать всю возможную поддержку"
 c3rd_barbarian_events.13.a.tt1:0 "Соберите всю политическую поддержку и сделайте всё, чтобы остановить этого безумца.\n #Y Цена этого действия зависит от влияния [owner_overtake_char.GetName], а также от числа глав семей или должностных лиц, которые вас поддерживают. #!"
 c3rd_barbarian_events.13.b:0 "Послать войска для подтверждения верности наших командиров"
 c3rd_barbarian_events.13.b.tt1:0 "Вы продемонстрируете силу, которая, надеемся, положит конец этому мятежу"
 c3rd_barbarian_events.13.b.tt2:0 "#R Есть небольшой риск военной анархии #!"
 c3rd_barbarian_events.13.b.tt3:0 "#R Есть небольшой риск потери легитимности #!"
 c3rd_barbarian_events.13.c:0 "Мы не можем ему противостоять"
 c3rd_barbarian_events.13.c.tt1:0 "Вы позволите [owner_overtake_char.GetName] действовать по своему усмотрению и будете надеяться, что ничего серьёзного не случится..."
 c3rd_barbarian_events.13.c.tt2:0 "#R Существует риск переворота #!"
 c3rd_barbarian_events.13.c.tt3:0 "#R Существует риск потери легитимности #!"

 #regain control

 DUCHY_STATE_EFFECT_TT:0 "[SCOPE.GetRootScope.GetProvince.GetName|Y] станет столицей герцогства, военной крепостью.\nОни станут нашим вассалом с бонусом к людским ресурсам и лимиту крепостей. Они не будут вступать с нами в войны, не займут ячейку дипломатических отношений и не могут быть интегрированы. Если они вырастут свыше определённого размера, они превратятся в клиентское государство — автократическую монархию."
 DUCHY_BUTTON:0 "#T Создать герцогство#!\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( ProvinceWindow.GetProvince.MakeScope ).AddScope('player', Player.MakeScope ).End )]"
 duchy_title:0 "Создать герцогство"
 duchy_desc:0 "Вы уверены, что хотите создать герцогство? Это сделает вассалом [SCOPE.GetRootScope.GetProvince.GetName|Y], #R а также всю местную провинцию #!."
 duchy_borders_tt:0 "Герцогство может быть создано только в приграничной провинции, соседствующей с не-союзным и не-вассальным племенным государством"

 c3rd_monetary_window_button_tt1:0 "Монетарный кризис ещё не активирован"
 c3rd_monetary_window_button_tt2:0 "Монетарный кризис"

#tribals fix

 tribal_flavour_events.41.t:0 "Неизбежный крах"
 tribal_flavour_events.41.desc:0 "Страна находится на грани взрыва. Плохая дипломатия, недопонимание с главными кланами или разобщённость страны в каждой деревне... Никто не скажет, что именно внесло больший вклад в эту ситуацию, но вот мы здесь. Среди представителей, готовых довести до конца безвозвратную потерю преобладания нашего клана, наш лидер может предпринять последнюю попытку спасти страну."
 tribal_flavour_events.41.a:0 "Обратимся к их чести и привилегии служить нашему клану."
 tribal_flavour_events.41.a.tt1:0 "Вы попытаетесь произнести последнюю отчаянную речь, #G популярность #! вашего лидера повлияет на исход"
 tribal_flavour_events.41.a.tt2:0 "Страна рухнет"
 tribal_flavour_events.41.b:0 "Постойте... а если мы предложим больше автономии?"
 tribal_flavour_events.41.b.tt1:0 "Вы избежите краха ценой тяжёлых реформ"
 tribal_flavour_events.41.c:0 "Ладно, получите то, что хотите!"
 tribal_flavour_events.41.c.tt1:0 "Вы избежите краха ценой тяжёлых уступок"

 tribal_flavour_events.51.t:0 "Племенной крах"
 tribal_flavour_events.51.desc:0 "Казалось, что аудитория могла быть убеждена... но когда ваш лидер разразился пламенной речью, стало всё более очевидно, что надежда на спасение единства страны угасает с наступлением вечера. Один за другим представители вернулись в свои кланы, снова став хозяевами своих судеб."
 tribal_flavour_events.51.a:0 "Это катастрофа..."
 tribal_flavour_events.51.a.tt1:0 "Страна была разделена на множество под-кланов"