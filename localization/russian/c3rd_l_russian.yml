 c3rd_monetary_the_number_tt:0 "[Player.Custom('c3rd_monetary_the_number_customloc')]"
 c3rd_monetary_the_number_customloc_tt:0 "#Y Экономический баланс#!\n\nЭто число отражает внутреннее богатство вашей страны: насколько богаты люди, как движутся деньги между рабочими и владельцами. Оно мало связано с количеством денег в вашей казне или доходами... но последствия неэффективного управления могут косвенно влиять на него.\n#R Ниже 100%#! — генерируется недостаточно богатства для подпитки экономики, и дефляция постепенно растёт\n#G Выше 100%#! — ваша империя генерирует достаточно богатства, и дефляция сокращается\n\nКаждый поп неинтегрированной культуры вносит #G положительный#! вклад, символизируя эксплуатацию покорённых народов во благо государства.\n#G Каждый поп культуры с правами «рабы» вносит двойной вклад#!\nКаждый драгоценный минерал также вносит #G положительный#! вклад.\nКаждый интегрированный поп, символизирующий привилегии элиты, вносит #R отрицательный#! вклад.\n\nСоотношение положительных и отрицательных значений будет различаться в зависимости от законов, культурных решений (например, #G политики налоговой инспекции#!) и со временем. Удовлетворять это соотношение будет всё труднее, что символизирует постепенную коррупцию общества, гордящегося своим успехом."
 c3rd_monetary_the_number_customloc_tt1:0 "#Y Экономический баланс#!\n\nДенежная система была реформирована, и введение солидуса исключило возможность нового валютного кризиса... по крайней мере, для этой эпохи.\n\nТем не менее, вы можете продолжать наблюдать за изменениями этого показателя, если захотите."

