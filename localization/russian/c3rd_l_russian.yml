 monetary_law_desc:0 "Монетарная система, стремящаяся обеспечить регулярный и равный обмен, а также экономические отношения между жителями, обычно основана на соотношении различных валют в зависимости от содержания в них металлов. Века кризисов и перемен не пощадили экономику, и многие императоры пытались её реформировать... с разным успехом...\n\n #G Этот набор законов бесполезен до тех пор, пока механика денежного кризиса не станет доступна. Это должно произойти около 700 AUC и откроет новые изобретения в гражданском древе. До этого момента можно свободно игнорировать его #!"
 basic_monetary_law:0 "Августовская система"
 basic_monetary_law_desc:0 "Август в 27–23 гг. до н.э. ввёл денежную систему, основанную на шкале ценностей, которая связывала между собой золотые, серебряные, орихалковые и медные монеты с расчётной валютой. Поддерживаемая расширением империи, плодами завоеваний и притоком свежих денег из добычи рудников, эта система стала эталоном здоровой экономики.\n\n Плоды завоеваний символизируются неполностью интегрированным населением в ваших землях. Добыча — это общее количество драгоценных металлов (включая импорт) в вашей стране. \n #R Если ресурсов слишком мало для вашей популяции, может возникнуть дефляция #!\n\n #G Этот набор законов бесполезен до тех пор, пока механика денежного кризиса не станет доступна. Это должно произойти около 700 AUC и откроет новые изобретения в гражданском древе. До этого момента можно свободно игнорировать его #!"
 subject_exploitation_law:0 "Эксплуатация вассалов"
 subject_exploitation_law_desc:0 "В случае нехватки свежих ресурсов от завоеваний и добычи руд всегда можно выжать всё богатство из наших вассалов. Им это может не понравиться, но такова цена нашей защиты. \n\n #G Население вассалов будет учитываться в ваших ресурсах в денежном балансе #!\n\n #G Этот набор законов бесполезен до тех пор, пока механика денежного кризиса не станет доступна. Это должно произойти около 700 AUC и откроет новые изобретения в гражданском древе. До этого момента можно свободно игнорировать его #!"
 monetary_reform_law:0 "Серебряная реформа"
 monetary_reform_law_desc:0 "Постепенно уменьшая долю серебра в монетах без изменения шкалы ценностей, можно эффективно компенсировать нехватку руды. Возможность общей инфляции из-за наводнения экономики дешёвой валютой, конечно же, лишь 'маловероятна'... \n\n #G Это очень эффективно компенсирует дефляцию #! \n #R Это постепенно уменьшит процент содержания серебра в валюте #!\n\n #G Этот набор законов бесполезен до тех пор, пока механика денежного кризиса не станет доступна. Это должно произойти около 700 AUC и откроет новые изобретения в гражданском древе. До этого момента можно свободно игнорировать его #!"
 second_reform_law:0 "Реформы Аврелиана"
 second_reform_law_desc:0 "'Разложение денежной системы было замедлено, а затем остановлено, когда Аврелиан предпринял решительные меры по сокращению объёмов денежной эмиссии и стабилизировал нумерарий золота и биллона, что завершилось в 309 году созданием солидуса.'\n#G Это может исправить возможный обвал стоимости денег\nЭто положительно повлияет на денежный баланс\nЭто необходимо для продвижения дальше по древу миссий Солидуса, которое способно раз и навсегда закончить денежный кризис #!\n\n #G Этот набор законов бесполезен до тех пор, пока механика денежного кризиса не станет доступна. Это должно произойти около 700 AUC и откроет новые изобретения в гражданском древе. До этого момента можно свободно игнорировать его #!"
 administrative_law:0 "Административные законы"
 basic_administrative_law:0 "Военные губернаторства"
 basic_administrative_law_desc:0 "Магистрат, отправленный в провинцию, был единственным, кто обладал империями — полной властью народа. Он имел фактически абсолютную власть в гражданской, судебной и военной сферах. Поэтому во время гражданских войн провинции становились идеальной базой для честолюбцев, которые могли получить надёжные войска и деньги без какого-либо контроля."
 constantine_reform_law:0 "Реформа Константина"
 constantine_reform_law_desc:0 "Была внедрена новая структура управления. Военные и гражданские карьеры окончательно разделились: префекты претория и викарии занимались исключительно административными функциями, а губернаторы были освобождены от всех военных забот в пользу профессионалов войны. \n\n#G Генералы больше не будут требовать внешних войн\nГенералы с меньшей вероятностью инициируют военную анархию #! \n\n #R Губернаторы могут расширять своё личное влияние в регионах, которыми управляют #! "
 decentralized_administration_law:0 "Полная автономия"
 decentralized_administration_law_desc:0 "Губернаторам была предоставлена большая автономия, значительные полномочия и унаследованные права для ведущих семей. Это означает, что они склонны терять интерес к имперской политике и сосредотачиваться на собственных землях.\n\n #R Губернаторы могут расширять своё личное влияние в регионах, которыми управляют, и гораздо чаще предпринимать независимые действия\nВнутренняя политика может стать дороже\nЭтот закон может быть принят только во время внутренних мятежей, но отменить его будет крайне сложно #!"
 reduced_the_autonomy_desc:0 "Каждый #T крупный землевладелец#! имеет более #G 75#! лояльности"
 recent_decentralization_desc:0 "#R Децентрализация была проведена слишком недавно #!"
 constantine_reform_available_desc:0 "Реформа стала возможной благодаря вкладу просвещённого правителя"

