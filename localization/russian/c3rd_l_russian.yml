 sol_silver_bonus:0 "#G Это уменьшит падение стоимости серебра пассивно #!"
 solidus_reform_3:0 "Действия против обвала"
 solidus_reform_3_a:0 "Пограничный контроль"
 solidus_reform_3_a_DESC:0 "Использование наших вассалов для избавления от излишков нашей «картонной» валюты — изящный, пусть и не самый справедливый, способ восстановить баланс."
