 #alerts

 ALERT_MONETARY_BALANCE:0 "#T Низкий денежный баланс#!\nНаш денежный баланс опасно низок. Наше богатство и эксплуатация ниже, чем потребление населения.\nОткройте здесь окно Денежного кризиса или вкладку экономики, чтобы узнать больше"
