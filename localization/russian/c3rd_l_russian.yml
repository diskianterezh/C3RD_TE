 c3rd_monetary_deflation_custom_loc1:0 "Ваша экономика не страдает от дефляции"
 c3rd_monetary_deflation_custom_loc2:0 "#R Ваша экономика испытывает лёгкую дефляцию#!\n\nУхудшение ситуации приведёт к значительной дефляции."
 c3rd_monetary_deflation_custom_loc3:0 "#R Ваша экономика испытывает значительную дефляцию#!\n#G Требования закона «Реформа серебра» обойдены#!\n\nУхудшение ситуации приведёт к подавляющей дефляции"
 c3rd_monetary_deflation_custom_loc4:0 "#R Ваша экономика испытывает подавляющую дефляцию#!\n#G Требования закона «Реформа серебра» обойдены#!\n\nДефляция не имеет ограничений и будет продолжать накапливаться, что усложнит её преодоление"
