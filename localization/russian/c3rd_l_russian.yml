 #Inventions
 subject_exploitation_c3rd:0 "Десятина с вассалов"
 subject_exploitation_c3rd_desc:0 "Наши подвластные государства знают, что находятся под нашей защитой. Но они также должны понимать, что эта защита обходится нам дорого, и неплохо бы участвовать в расходах. Куда именно идут их средства, им знать необязательно..."
 subject_exploitation_c3rd_enabled:0 "#G Будет доступен закон 'Эксплуатация вассалов' #!"
 currency_unification:0 "Унификация валюты"
 currency_unification_desc:0 "Каждый этнос и каждый город прежде обменивались и торговали по-своему, используя собственные валюты. Хотя это и давало определённую гибкость в обмене, строгий контроль за созданием и распространением единой валюты абсолютно необходим для управления экономикой."
 mine_control:0 "Контроль над шахтами"
 mine_control_desc:0 "Многие шахты страны находятся в руках частных лиц, и их изъятие в пользу государства является важнейшим шагом в контроле над денежной политикой."
 currency_state_production:0 "Государственная чеканка валюты"
 currency_state_production_desc:0 "Централизация выпуска денег обеспечит свежие источники средств в нужный момент, что является очевидным преимуществом."
 setting_up_controls:0 "Введение контроля"
 setting_up_controls_desc:0 "Контроль над денежной политикой во всех уголках страны, без сомнения, потребует значительной части бюджета, но это абсолютно необходимая задача."
 ratio_of_value:0 "Соотношение ценности"
 ratio_of_value_desc:0 "Установление строгой шкалы ценности между различными металлическими валютами — отличный способ упорядочить экономику."
 manipulation_of_value:0 "Манипуляция ценностью"
 manipulation_of_value_desc:0 "Манипулировать валютами — это не обман, если именно ты пишешь правила..."
 devaluate_silver:0 "Обесценивание серебра"
 devaluate_silver_desc:0 "Идеальный план: уменьшая количество серебра в монете без изменения её номинала, можно множить деньги из ничего!"
 devaluate_silver_enabled:0 "Будет доступен денежный закон 'Серебряная реформа'"
 strict_control_values:0 "Жёсткий контроль валюты"
 strict_control_values_desc:0 ""
 gold_scale:0 "Золотая шкала"
 gold_scale_desc:0 "Использование золота в качестве новой базовой ценности стабилизирует денежную ситуацию."
 monetary_reform:0 "Интервенция Аврелиана"
 monetary_reform_desc:0 "'Солид Константина I обладал исключительной стабильностью, которую он сохранял в Византии вплоть до XI века, став основой денежной системы Поздней Римской и затем Византийской империи.'"
 monetary_reform_enabled:0 "Будет доступен денежный закон 'Реформа Аврелиана'\n#G Будет доступно древо миссий по Реформе солидуса, которое способно положить конец денежному кризису #!"
 force_national_currency:0 "Навязать национальную валюту"
 force_national_currency_desc:0 "Покорённые территории должны быть вынуждены использовать национальную валюту вместо своего варварского бартера — только так им можно передать цивилизацию."
 national_foreign_investments:0 "Международные инвестиции"
 national_foreign_investments_desc:0 "Унификация валюты за пределами наших границ приведёт к глобализации цивилизации."
 sanctioning_elites:0 "Наказать элиту"
 sanctioning_elites_desc:0 "Привилегированных членов общества необходимо контролировать и наказывать, когда они злоупотребляют системой. Это неприятно, но необходимо для ограничения произвола."
 social_elevator:0 "Социальный лифт"
 social_elevator_desc:0 "Любой может стать частью правящей элиты! ... любой может попробовать ..."
 public_games:0 "Публичные игры"
 public_games_desc:0 "Организация масштабных народных игр, финансируемых государством, — прекрасный способ держать население покорным и довольным.\nНаселение будет ожидать проведения игр со временем.\n#G Проведение великих игр даст другие положительные эффекты #!\n#R Отказ от игр вызовет недовольство\nПроведение игр каждый раз будет стоить денег #!"
 public_games_enabled:0 "Вы проведёте первые игры"
 administrative_military_reform_c3rd:0 "Автономия гражданской администрации"
 administrative_military_reform_c3rd_desc:0 "Гражданская администрация слишком часто подвергалась влиянию военных, возомнивших себя местными тиранами. Необходимо провести здоровое разделение между военным управлением провинций и городов."
 administrative_military_reform_c3rd_enabled:0 "#G Будет доступен закон 'Реформа Константина' в сфере администрации #!"

#Missions
 solidus_reform:0 "Реформа солидуса"
 solidus_reform_DESCRIPTION:0 "Текущая экономическая система, основанная на серебряном стандарте, имеет множество изъянов. От кризиса к кризису стало очевидно, что необходимо коренное преобразование. Фиксированные суммы, возможно, на более редких металлах, которые сложно подделать? Нас ждёт серьёзное испытание."
 solidus_reform_CRITERIA_DESCRIPTION:0 "Реформировать денежную систему"
 solidus_reform_BUTTON_TOOLTIP:0 "Пришло время реформировать нашу денежную систему. Кто получит выгоду от новой системы?"
 solidus_reform_1:0 "Действия против дефляции"
 solidus_reform_1_DESC:0 "#G Налоговая инспекция — это культурное решение.\n Вы не можете одновременно иметь Налоговую инспекцию и Освобождение от подушного налога, так как они противоречат друг другу.\n Если у вас есть Освобождение от подушного налога, сначала необходимо его отменить. #! \n"
