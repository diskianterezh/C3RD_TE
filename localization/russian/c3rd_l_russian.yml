 ALERT_COLLAPSE:0 "#T Внутренний коллапс#!\nВаша страна рушится. Пока стабильность #R ниже 25#!, будут происходить события коллапса."
 ALERT_MILITARY_ANARCHY:0 "#T Военная анархия#!\nСтрана находится в фазе военной анархии. Пока это продолжается, генералы будут требовать более серьёзных уступок и решений."
