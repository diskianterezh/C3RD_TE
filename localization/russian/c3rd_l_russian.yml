 c3rd_monetary_citizen_exemption_tt:0 "Для вашей страны принято или навязано решение основной культуры #Y «Нет переписных налогов для граждан и знати»#!\n\n#R Это оказывает очень негативное влияние на экономику#!\n\nВы можете отменить это решение в меню решений основной культуры"
 c3rd_monetary_aristocratic_exemptions_tt:0 "Для элиты объявлено полное освобождение от налогов\n\n#R Это оказывает негативное влияние на экономику#!"
 c3rd_monetary_military_advantages_tt:0 "Генералам предоставлены военные привилегии\n\n#R Это оказывает негативное влияние на экономику#!"
 c3rd_monetary_tax_inspection_tt:0 "Введено тщательное налогообложение, чтобы никто не мог уклониться от налогов\n\n#G Это оказывает очень положительное влияние на экономику#!\n\nЭто решение основной культуры, его можно отменить или принять снова"
 c3rd_monetary_consolidation_sol_tt:0 "В настоящее время проводится монетарная консолидация\n\n#G Это оказывает очень положительное влияние на экономику#!"
