 c3rd_monetary_silver_custom_loc1:0 "Ваша валюта стабильна"
 c3rd_monetary_silver_custom_loc2:0 "#R Валюта ослаблена#!\n\nУхудшение ситуации приведёт к сильной девальвации."
 c3rd_monetary_silver_custom_loc3:0 "#R Валюта сильно обесценена#!\n\nУхудшение ситуации приведёт к краху валюты"
 c3rd_monetary_silver_custom_loc4:0 "#R Ваша валюта рухнула#!\n\nДевальвация не имеет ограничений и будет продолжать накапливаться, что усложнит её преодоление"
 c3rd_monetary_silver_law_tt:0 "[Player.Custom('c3rd_monetary_silver_law_custom_loc')]"
 c3rd_monetary_silver_law_custom_loc1:0 "Закон #Y «Реформа серебра»#! не принят\n\nРеформа серебра позволяет очень эффективно бороться с дефляцией, чеканя больше монет из лёгких металлов. Однако это пагубно сказывается на ценности валюты"
 c3rd_monetary_silver_law_custom_loc2:0 "Закон #Y «Реформа серебра»#! принят\n\nВы эффективно снижаете дефляцию, чеканя больше монет из лёгких металлов. Однако это пагубно сказывается на ценности валюты"
 c3rd_inject_liquidity_tt:0 "#G Вы снизите дефляцию#!"
 c3rd_inject_liquidity_tt1:0 "#Y Влить ликвидность#!"
 c3rd_new_currency_tt2:0 "#Y Ввести новую валюту#!"
