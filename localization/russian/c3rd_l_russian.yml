 ALERT_POLITICAL_INSTABILITY:0 "#T Политическая нестабильность#!\nСтрана находится в фазе политической нестабильности, что накладывает ряд штрафов. Вы можете решить это, используя решения для реформирования государства или прекращения политической нестабильности."
