 l_french:

 ###########################
 # MODIFIERS
 ###########################
 rep_tension_1:0 "Nascent Tensions"
 desc_rep_tension_1:0 "The republican institutions are beginning to show signs of strain. Senate debates grow heated, old alliances crack under new pressures, and whispers of reform circulate through the corridors of power."
 rep_tension_2:0 "Latent Instability"
 desc_rep_tension_2:0 "The cracks in the Republic's foundations are now visible to all. Corruption spreads through the administration, commanders grumble in their camps, and the popular assemblies have become arenas of partisan violence."
 rep_tension_3:0 "Institutional Crisis"
 desc_rep_tension_3:0 "The Republican system is buckling under the weight of an empire it was never designed to govern. Provincial governors act as independent rulers, the treasury is emptied by factionalism, and no law passes the Senate without violence."
c3rd_civil_war_republic_ae:0 "War of the Republics"
 desc_c3rd_civil_war_republic_ae:0 "The country is torn by an internal republican conflict. Foreign powers see only opportunity in our disunion, and our ambitions abroad must be restrained while we settle our internal affairs."
 c3rd_rep_relief:0 "Consolidation Républicaine"
 desc_c3rd_rep_relief:0 "La République a survécu à sa guerre civile. Les factions se sont retirées du bord du gouffre, et le Sénat, si peu enthousiaste soit-il, a refermé ses rangs. Cette stabilité chèrement acquise ne durera pas éternellement — les tensions structurelles demeurent — mais elle offre un répit pour reconstruire.\n\n#G Ralentit l'accumulation mensuelle de la tension républicaine pendant cinq ans.#!"

 ###########################
 # REPUBLICAN LAWS
 ###########################
 republican_law:0 "Republican Laws"
 republican_law_desc:0 "The laws governing the functioning of the Republic date back to a time when the state was a city. As the empire has grown, these laws have become both the foundation and the weakness of our system — each reform opening new cracks even as it closes others.\n\n#G These laws are only active after 800 AUC for Republican states.#!"

 basic_republican_law:0 "Mos Maiorum"
 basic_republican_law_desc:0 "The ancestral custom — mos maiorum — is the unwritten backbone of the Republic. No single law defines it, yet every citizen knows it: the traditions of the Senate, the rights of tribunes, the dignity of the consulate. In times of stability, it is enough. In times of crisis, it merely delays the reckoning."

 lex_frumentaria:0 "Lex Frumentaria"
 lex_frumentaria_desc:0 "The distribution of subsidised grain to the citizens of the capital was one of the most powerful instruments of popular loyalty. The Lex Frumentaria institutionalises this practice across the empire — at no small cost to the treasury, but to considerable effect on the morale of the urban populace.\n\n#G Reduces republican tension monthly#!\n#R Places a permanent burden on the monetary balance#!\n#R Inactive under the Gold Standard#!"

 lex_de_provinciis:0 "Lex de Provinciis"
 lex_de_provinciis_desc:0 "A law governing the conduct of provincial governors: their terms are limited, their accounts are audited, and their armies may not cross the boundaries of their province. It was once the bulwark against military ambition. In an empire of this scale, enforcing it requires... flexibility.\n\n#G Reduces republican tension; even more effectively when military loyalty is uncertain#!\n#R Governors must be paid accordingly for their compliance#!"

 lex_sempronia:0 "Lex Sempronia"
 lex_sempronia_desc:0 "Originally championed by the Gracchi as a land reform, the Lex Sempronia in this age takes the form of a redistribution of state revenues — diverting a portion of the great estates' income toward public works and the freemen class. The aristocracy despises it. The people adore it.\n\n#G Significantly reduces republican tension#!\n#R The landed nobility will make their displeasure felt — and known#!\n#R Inactive under the Gold Standard, which has already shifted wealth irreversibly to the aristocracy#!"

 lex_villia_annalis:0 "Lex Villia Annalis"
 lex_villia_annalis_desc:0 "This old law establishes minimum ages and mandatory intervals for the holding of magistracies — a check against the concentration of power in ambitious hands. In practice, it forces experienced officers out of command at the worst moments, and binds capable men to wait while less qualified ones fill the rosters.\n\n#G Reinforces institutional stability, loyalty and limits corruption#!\n#R The artificial restriction on commands creates a slow but steady Republican tension#!"

 lex_trebonia:0 "Lex Trebonia"
 lex_trebonia_desc:0 "La loi qui prolongea les commandements provinciaux de Pompée et de Crassus, leur accordant cinq années supplémentaires d'autorité militaire au-delà de leur consulat. Réactualisée dans l'esprit du temps, elle permet au Sénat de confier le commandement prolongé à un général éprouvé, attachant les légions à une main unique. La sécurité qu'elle procure a un prix — normaliser le pouvoir militaire personnel érode les fondements républicains qui maintiennent l'État.\n\n#G Bonus militaires exceptionnels, et aide à contenir le mécontentement dans l'armée#!\n#R Le précédent du commandement personnel étendu augmente la tension républicaine#!"

 lex_hortensia:0 "Lex Hortensia"
 lex_hortensia_desc:0 "The ancient law that made plebiscites binding on all citizens regardless of senatorial approval. Revived in spirit, it empowers the popular assemblies to act more directly on institutional questions — reducing the threshold for reform, at the price of handing more leverage to the popular factions.\n\n#G Reduces the conditions required to attempt the monarchical reform#!\n#G Unlocks the Convocatio Populi decision#!\n#R A slow but steady erosion of traditional authority#!"

 ###########################
 # EVENTS — FACTION TENSION
 ###########################

 # --- Tier 1 (tension >= 25) ---

 c3rd_rep_tension.1.t:0 "The Optimates Demand Their Due"
 c3rd_rep_tension.1.desc:0 "The great families of the Senate have grown restless. In a private audience, a delegation of the most prominent optimates presented their grievances with unusual directness: they have funded campaigns, sustained armies, managed provinces — and they demand a formal recognition of their services, in the form of tax exemptions and privileged access to state contracts. The message, though delivered with perfect senatorial decorum, could not have been clearer."
 c3rd_rep_tension.1.a:0 "A reasonable request from invaluable allies"
 c3rd_rep_tension.1.a.tt1:0 "The optimates will be satisfied and their support secured. #G A reduction in institutional friction will follow.#!"
 c3rd_rep_tension.1.b:0 "The Republic does not make deals of this kind"
 c3rd_rep_tension.1.b.tt1:0 "#R The optimates will not forget this refusal. Tension will rise.#!"

 c3rd_rep_tension.2.t:0 "The Populares and the Price of Bread"
 c3rd_rep_tension.2.desc:0 "In the marketplaces, prices have climbed again. The popular tribunes took full advantage: their speeches in the assembly halls drew enormous crowds and several near-riots. They demand a formal programme of grain subsidies — not a charity, they insist, but a right. The Senate debates in hushed tones whether the cost of refusal outweighs the cost of compliance."
 c3rd_rep_tension.2.a:0 "The people must eat — open the granaries"
 c3rd_rep_tension.2.a.tt1:0 "#G The populares will be satisfied. Stability will follow at a cost to the treasury.#!"
 c3rd_rep_tension.2.b:0 "The Republic cannot feed every idle mouth in the empire"
 c3rd_rep_tension.2.b.tt1:0 "#R The assembly will not forget this. A period of popular agitation will follow.#!"

 c3rd_rep_tension.3.t:0 "The Rites of Our Ancestors"
 c3rd_rep_tension.3.desc:0 "A traditionalist delegation has arrived with a petition signed by priests, veterans, and old families from half the provinces: a great public celebration of the ancient rites has not been held in some years. They ask, with quiet insistence, that the old ceremonies be observed — the calendar respected, the sacrifices performed publicly, the memory of the founding honoured. They speak of duty to the past. Their real concern, of course, is their own influence in the present."
 c3rd_rep_tension.3.a:0 "We will honour the old ways"
 c3rd_rep_tension.3.a.tt1:0 "Les rites anciens seront publiquement observés pendant deux ans. Les vieilles familles seront satisfaites — mais ceux qui ne partagent pas la tradition ancestrale en ressentiront le poids."
 c3rd_rep_tension.3.b:0 "We have more pressing concerns than ceremonies"
 c3rd_rep_tension.3.b.tt1:0 "#R The traditionalists will interpret this as contempt for their values and their influence.#!"

 # --- Tier 2 (tension >= 50) ---

 c3rd_rep_tension.4.t:0 "The Soldiers' Wages"
 c3rd_rep_tension.4.desc:0 "A delegation of officers — careful not to seem threatening, careful to appear as petitioners — arrived at the Senate. The men have not been paid in full; the campaign season was costly and the treasury strained. They do not demand, they remind: an army that is not paid does not lose its loyalty overnight, but it does begin to ask questions. [general_leader.GetName], who delivered the message personally, smiled throughout. The smile did not help."
 c3rd_rep_tension.4.a:0 "Honour our soldiers' service — pay them"
 c3rd_rep_tension.4.a.tt1:0 "#G Military discontent will be reduced.#!"
 c3rd_rep_tension.4.b:0 "The treasury cannot accommodate this at present"
 c3rd_rep_tension.4.b.tt1:0 "#R The army will draw its own conclusions from our answer.#!"

 c3rd_rep_tension.5.t:0 "The Senate Rallies Behind a General"
 c3rd_rep_tension.5.desc:0 "It began with a dinner at [general_leader.GetName]'s estate — a private gathering, nothing unusual. But the names of those present leaked: three prominent senators, two former consuls, a treasurer. The next day, [general_leader.GetName]'s proposals for a special military command were presented to the Senate with an unusual number of enthusiastic sponsors. The optimates have decided to back a general. The question is why."
 c3rd_rep_tension.5.a:0 "A capable general with powerful friends is an asset"
 c3rd_rep_tension.5.a.tt1:0 "The optimates' support will be acknowledged. Their general will be accommodated."
 c3rd_rep_tension.5.b:0 "No man rises exceptional on senatorial backing alone"
 c3rd_rep_tension.5.b.tt1:0 "#R The optimates will not forgive this public humiliation of their chosen ally.#!\n#R Our tyranny rating will suffer.#!"

 c3rd_rep_tension.6.t:0 "The Great Redistribution"
 c3rd_rep_tension.6.desc:0 "The popular tribunes have proposed a sweeping agrarian reform — a reallocation of uncultivated public lands to landless citizens, combined with caps on private ownership of state-managed estates. It is, in principle, quite constitutional. The great landowners have reacted as if it were a declaration of war. Both sides look to us for a decision."
 c3rd_rep_tension.6.a:0 "A just redistribution is the foundation of the Republic"
 c3rd_rep_tension.6.a.tt1:0 "#G The people will be satisfied. #R The aristocracy will be outraged and corruption will rise as they seek other avenues.#!"
 c3rd_rep_tension.6.b:0 "We will not allow the Republic's estates to be scattered"
 c3rd_rep_tension.6.b.tt1:0 "#R The popular assemblies will not forgive this refusal.#!"

 # --- Tier 3 (tension >= 75) ---

 c3rd_rep_tension.7.t:0 "A Saviour for the Republic"
 c3rd_rep_tension.7.desc:0 "[general_leader.GetName] has made himself impossible to ignore. His presence in the capital — surrounded by veterans, his name on the lips of the street — is no longer that of a general awaiting orders. In a speech before the full Senate that lasted two hours, he laid out his vision with precision: the institutions are broken, the Senate is paralysed, and only a man of extraordinary mandate can restore the Republic's greatness. He does not call it kingship. He calls it salvation."
 c3rd_rep_tension.7.desc_ruler:0 "Les murmures sont devenus un choeur. La popularité de [general_leader_rt3.GetName] a dépassé le cadre des institutions qui lui ont donné son mandat. Les vétérans invoquent son nom. Les tribuns populaires citent ses décisions comme des précédents. Même ses adversaires au Sénat ont cessé de prétendre qu'il a tort — ils soutiennent seulement que ses méthodes sont dangereuses.\n\nIl n'a pas demandé de pouvoirs extraordinaires. Il n'en a pas besoin. La question s'est posée d'elle-même."
 c3rd_rep_tension.7.a:0 "Let him begin the reform — the Republic will survive it"
 c3rd_rep_tension.7.a.tt1:0 "#R This will set you irrevocably on the path to monarchical reform.#!\n#G The reform chain begins immediately.#!"
 c3rd_rep_tension.7.b:0 "The Republic does not need saving by one man"
 c3rd_rep_tension.7.b.tt1:0 "#R His frustration will rebound heavily on the institutions.#!\n#R His military support will begin to turn inward.#!"

 c3rd_rep_tension.8.t:0 "The Threat of Secession"
 c3rd_rep_tension.8.desc:0 "A consortium of the most powerful senatorial families has delivered a private ultimatum — courteous in form, unmistakable in intent. If the special provisions they have requested are not codified into law within the season, they will withdraw their governors, their armies, and their financial contributions from the common treasury. They know perfectly well that the state cannot function without them. They are counting on it."
 c3rd_rep_tension.8.a:0 "We will formalise their privileges — this time"
 c3rd_rep_tension.8.a.tt1:0 "#G The aristocratic faction is appeased. A law advantage will be gained.#!\n#R This sets a precedent they will use again.#!"
 c3rd_rep_tension.8.b:0 "No Republic can survive those who hold it hostage"
 c3rd_rep_tension.8.b.tt1:0 "#R The refusal will bring their threats closer to reality. A province of low loyalty may act on its own.#!"

 c3rd_rep_tension.9.t:0 "The Factions at Each Other's Throats"
 c3rd_rep_tension.9.desc:0 "The tensions that had simmered through months of bitter debate finally erupted in the assembly hall: a populist tribune struck a traditionalist senator across the face with a rolled document, sparking a brawl that required armed intervention to end. Three men were seriously injured. The incident has been reported across the empire. Both factions have come to us demanding satisfaction, each convinced that we will take their side."
 c3rd_rep_tension.9.a:0 "The traditionalists represent order and continuity"
 c3rd_rep_tension.9.a.tt1:0 "The traditionalists will be satisfied. The populares will interpret this as a declaration of partisan preference."
 c3rd_rep_tension.9.b:0 "The people's cause is the Republic's cause"
 c3rd_rep_tension.9.b.tt1:0 "The populares will be satisfied. The traditionalists will withdraw their cooperation."
 c3rd_rep_tension.9.c:0 "We will hear both sides — this is not a war"
 c3rd_rep_tension.9.c.tt1:0 "#G A compromise reduces tension more than either partisan option.#!\n#R But it will cost political influence to impose.#!"

 # --- Transversal (on death) ---

 c3rd_rep_tension.10.t:0 "The Death of [dead_aristocrat.GetName]"
 c3rd_rep_tension.10.desc:0 "The news arrived with little ceremony: [dead_aristocrat.GetName] is dead. In the Senate, in the camps, in the estates of half the empire, the question that follows is always the same — not who mourns him, but who profits. A man of his stature leaves behind obligations, alliances, rivalries, and ambitions that no single successor can simply inherit. The vacuum he leaves is already beginning to pull."
 c3rd_rep_tension.10.a:0 "The empire endures"
 c3rd_rep_tension.10.a.tt1:0 "The death of a major landowner will weaken senatorial cohesion and accelerate institutional tensions."

 ###########################
 # EVENTS — CRISIS
 ###########################

 c3rd_rep_crisis.1.t:0 "The Republic at the Brink"
 c3rd_rep_crisis.1.desc:0 "The Senate session that should have been the last has lasted three days. Food was brought in. People slept on the benches. Outside, a crowd that had grown from curious to anxious to openly angry pressed against the doors. Inside, the accumulated weight of a generation of institutional failure has made the question impossible to avoid: the Republic, as it stands, cannot govern what it has become.\n\nThe choice now is simple, and terrible."
 c3rd_rep_crisis.1.a:0 "Begin the reform — the Republic becomes an empire"
 c3rd_rep_crisis.1.a.tt1:0 "#R This will transform the Republic into a monarchy.#!\n#G The reform chain begins, accompanied by a powerful deep reforms modifier.#!\n#G Republican tension is cleared.#!"
 c3rd_rep_crisis.1.b:0 "Defend the Republic — let it be decided by war"
 c3rd_rep_crisis.1.b.tt1:0 "#R A republican war begins immediately. Rebel provinces will secede under a rival republican banner.#!\n#G Victory will allow the Republic to survive — weakened but intact.#!\n#R Defeat will end the Republic under worse terms.#!"

 c3rd_rep_crisis.2.t:0 "The Republic Stands"
 c3rd_rep_crisis.2.desc:0 "The rebel provinces have been reintegrated, their armies scattered, their alternative government dissolved. It was not a clean victory — few civil wars are — but it is a decisive one. The Senate received the news in silence, then, after a long pause, voted a public thanksgiving. The Republic has survived what looked, for a time, like its final crisis."
 c3rd_rep_crisis.2.a:0 "The Republic endures. For now."
 c3rd_rep_crisis.2.a.tt1:0 "#G La tension républicaine est réinitialisée à 20.#!\n#G Consolidation Républicaine : ralentit l'accumulation de la tension pendant 5 ans.#!\nLa République survit."

 c3rd_rep_crisis.3.t:0 "The Empire That Grew Beyond Its Laws"
 c3rd_rep_crisis.3.desc:0 "The numbers did not lie, even if we refused to read them for months. Province after province shifted its allegiance — not out of hatred for the Republic, but out of simple calculation: the rebel's authority was present, ours was not. The assembly voted, in the end, not as a concession to defeat, but as the only means of preserving anything at all. The Republic is ended.\n\nHistory will judge whether it was killed by its enemies, or by its own ambitions."
 c3rd_rep_crisis.3.a:0 "So it ends."
 c3rd_rep_crisis.3.a.tt1:0 "#R The Republic has failed. A monarchical transition is forced upon us.#!\n#R The transition will be painful and unstable.#!"

 ###########################
 # GUI — WINDOW & ALERTS
 ###########################

 c3rd_rep_tension_window_TITLE:0 "Republican Tension"
 rep_tension_none_active:0 "Ordre républicain"

 ALERT_REP_TENSION_YELLOW:0 "#T Republican Tensions#!\nThe Republican institutions are under strain — the factions are dissatisfied and the Senate is losing its grip.\nOpen the Republican Tension window to understand the sources and manage the situation."
 ALERT_REP_TENSION_RED:0 "#T Institutional Crisis#!\nThe Republic is on the verge of collapse. The situation demands immediate action — manage the factions or accept the inevitable reform.\nOpen the Republican Tension window."

 ###########################
 # GUI — SOURCE ICON TOOLTIPS
 ###########################

 # Rising tension (red)
 c3rd_rep_src_cities_tt:0 "#T Size of the Empire#!\nThe Republican system was built for a city-state. Every new province stretches its institutions further — and the strain accumulates."
 c3rd_rep_src_deflation_tt:0 "#T Monetary Deflation#!\nEconomic crisis erodes the population's confidence in the state's ability to govern, fuelling factional agitation."
 c3rd_rep_src_crash_tt:0 "#T Monetary Collapse#!\nA severe devaluation of the currency is generating social unrest and direct pressure on the Republican institutions."
 c3rd_rep_src_solidus_tt:0 "#T Gold Standard#!\nThe introduction of the Gold Standard has concentrated wealth in the hands of the aristocracy, fuelling factional ambitions and separatist impulses."
 c3rd_rep_src_unworthy_tt:0 "#T Unworthy Leadership#!\nThe generals' growing contempt for the current leadership is undermining the constitutional authority of the magistrates."
 c3rd_rep_src_low_stab_tt:0 "#T Low Stability#!\nWhen the country is unstable, the Republican factions use every opening to advance their agendas at the expense of the institutions."
 c3rd_rep_src_low_senate_tt:0 "#T Senate Dissatisfaction#!\nWhen the three factions are unhappy, the Senate does not function. And when the Senate does not function, the Republic does not function."

 # Reducing tension (green)
 c3rd_rep_src_small_tt:0 "#G Small Republic#!\nA modest state is far easier to govern under Republican institutions. The factions remain manageable and the machinery of government still works as designed."
 c3rd_rep_src_high_stab_tt:0 "#G High Stability#!\nA stable country gives the institutions the breathing room they need to function without constant crisis intervention."
 c3rd_rep_src_good_senate_tt:0 "#G Senate Support#!\nWhen the three factions are reasonably content, the Senate governs efficiently and the Republic holds together without extraordinary measures."
 c3rd_rep_src_law_frum_tt:0 "#G Lex Frumentaria#!\nGrain distributions keep the urban populace loyal and the popular faction satisfied — one less source of permanent agitation."
 c3rd_rep_src_law_prov_tt:0 "#G Lex de Provinciis#!\nThe law governing provincial governors is actively reducing the risk of military ambition translating into institutional pressure."
 c3rd_rep_src_law_semp_tt:0 "#G Lex Sempronia#!\nThe redistribution law is buying social peace at the price of aristocratic resentment."
 c3rd_rep_src_rep_stab_tt:0 "#G Republican Stabilization#!\nAn active governance measure is holding the institutional tensions in check."

 ###########################
 # GUI — SENATE & UNWORTHY
 ###########################

 c3rd_rep_senate_approval_tt:0 "#T Senate Approval#!\nThe combined approval of the three Republican factions. #G Above 80% it actively reduces tension.#! #R Below 50% it actively increases it.#!"
 c3rd_rep_unworthy_leader_tt:0 "#T Military Discontent#!\nThe degree of contempt the generals hold for the current political leadership. The higher this value, the stronger the pressure on Republican institutions."

 ###########################
 # CUSTOM TOOLTIPS
 ###########################

 republican_tension_desc:0 "#T Republican Tension#!\nA measure of the institutional strain on the Republic. At 25, 50, and 75, increasingly severe penalties are applied to the state. At 100, a choice between monarchical reform and republican war becomes unavoidable.\n#R Only active for Republican states after 800 AUC. Removed if the government changes.#!"
 c3rd_rep_tension_pulse_desc:0 "The Republican tension pulse calculates the monthly evolution of institutional pressure."
 c3rd_rep_tension_check_var:0 "Republican tension is only tracked for Republic governments past 800 AUC."

 ###########################
 # DECISIONS
 ###########################

 convocatio_populi:0 "Convocatio Populi"
 convocatio_populi_desc:0 "The Lex Hortensia authorises us to call a direct assembly of the people, bypassing the Senate's usual procedural delays. It is an exceptional measure, appropriate only for exceptional times. The popular factions will receive it with enthusiasm; the senatorial families, with deep suspicion.\n#G Reduces republican tension#!\n#R Can only be convened once every ten years.#!"

 # LAW ALLOW TOOLTIPS
 c3rd_rep_law_req_active:0 "Le système de Tension Républicaine est actif"
 c3rd_rep_law_req_25:0 "La Tension Républicaine est au moins à 25%"
 c3rd_rep_law_req_50:0 "La Tension Républicaine est au moins à 50%"
 c3rd_rep_law_req_max_25:0 "La Tension Républicaine est au plus à 25%"
 c3rd_rep_law_req_general:0 "Un général avec une martialité d'au moins 10 est disponible"
